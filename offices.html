];

OFFICES = OFFICES.concat(GOV_OFFICES);

var ICONS = {
  traffic: '🚗', civil: '🪪', insurance: '👴', notary: '📄'
};
var COLORS = {
  traffic: '#3b82f6', civil: '#8b5cf6', insurance: '#10b981', notary: '#6366f1'
};

var map = L.map('map').setView([30.05, 31.25], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap | خِدْمَتي AI',
  maxZoom: 18
}).addTo(map);

var markers = [];
var currentFilter = 'all';
var searchTerm = '';
var userMarker = null;

function createIcon(type) {
  return L.divIcon({
    html: '<div style="background:' + COLORS[type] + ';width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)"><span style="transform:rotate(45deg);font-size:16px">' + ICONS[type] + '</span></div>',
    iconSize: [32, 32],
    iconAnchor: [16, 32],
    popupAnchor: [0, -32]
  });
}

function renderOffices(filter) {
  for (var i = 0; i < markers.length; i++) {
    map.removeLayer(markers[i]);
  }
  markers = [];
  var count = 0;
  var bounds = [];
  for (var i = 0; i < OFFICES.length; i++) {
    var o = OFFICES[i];
    if (filter !== 'all' && o.type !== filter) continue;
    if (searchTerm) {
      var st = searchTerm.toLowerCase();
      if (o.gov.toLowerCase().indexOf(st) === -1 && o.addr.toLowerCase().indexOf(st) === -1 && o.name.toLowerCase().indexOf(st) === -1) continue;
    }
    var marker = L.marker([o.lat, o.lng], { icon: createIcon(o.type) }).addTo(map);
    var popupHtml = '<h4>' + ICONS[o.type] + ' ' + o.name + '</h4>' +
      '<p>📍 ' + o.gov + '</p>' +
      '<p>🗺️ ' + o.addr + '</p>' +
      (o.phone ? '<p>📞 ' + o.phone + '</p>' : '') +
      (o.hours ? '<p>🕒 ' + o.hours + '</p>' : '') +
      (o.services ? '<p>🧾 ' + o.services + '</p>' : '') +
      '<a href="https://www.google.com/maps/dir/?api=1&destination=' + o.lat + ',' + o.lng + '" target="_blank" style="display:block;margin-top:10px;padding:10px 16px;background:#e6c258;color:#0F1E3D;border-radius:10px;text-decoration:none;font-weight:700;font-size:13px;text-align:center">📍 الاتجاهات للمكان (GPS)</a>' +
      '<p style="margin-top:6px;font-size:11px;color:#8ea0c4;text-align:center">⚠️ الموقع تقريبي — تأكد قبل الذهاب</p>';
    marker.bindPopup(popupHtml);
    markers.push(marker);
    bounds.push([o.lat, o.lng]);
    count++;
  }
  if (count > 0 && bounds.length > 0) {
    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
  }
  document.getElementById('officeCount').innerHTML = 'عرض <strong style="color:#e6c258">' + count + '</strong> مكتب على الخريطة';
}

function searchOffices() {
  searchTerm = document.getElementById('searchInput').value.trim();
  renderOffices(currentFilter);
}

function filterOffices(filter, btn) {
  currentFilter = filter;
  var btns = document.querySelectorAll('.filter-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  if (btn) btn.classList.add('active');
  renderOffices(filter);
}

function findNearest() {
  if (!navigator.geolocation) {
    alert('المتصفح بتاعك مش بيدعم تحديد الموقع');
    return;
  }
  document.getElementById('officeCount').innerHTML = '📍 بتحديد موقعك الحالي...';
  navigator.geolocation.getCurrentPosition(function(pos) {
    var myLat = pos.coords.latitude;
    var myLng = pos.coords.longitude;
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.marker([myLat, myLng], {
      icon: L.divIcon({
        html: '<div style="background:#e6c258;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 0 10px rgba(230,194,88,.6)"><span style="font-size:14px">📍</span></div>',
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14]
      })
    }).addTo(map);
    userMarker.bindPopup('<h4 style="color:#e6c258;margin:0">أنت هنا 📍</h4>');
    var distances = [];
    for (var i = 0; i < OFFICES.length; i++) {
      var o = OFFICES[i];
      var dist = Math.sqrt(Math.pow(o.lat - myLat, 2) + Math.pow(o.lng - myLng, 2)) * 111;
      distances.push({ office: o, dist: dist });
    }
    distances.sort(function(a, b) { return a.dist - b.dist; });
    for (var i = 0; i < markers.length; i++) map.removeLayer(markers[i]);
    markers = [];
    var bounds = [[myLat, myLng]];
    var showCount = Math.min(5, distances.length);
    for (var i = 0; i < showCount; i++) {
      var o = distances[i].office;
      var distKm = distances[i].dist.toFixed(1);
      var marker = L.marker([o.lat, o.lng], { icon: createIcon(o.type) }).addTo(map);
      var popupHtml = '<h4>' + ICONS[o.type] + ' ' + o.name + '</h4>' +
        '<p>📍 ' + o.gov + '</p>' +
        '<p>🗺️ ' + o.addr + '</p>' +
        '<p>📏 على بعد ~' + distKm + ' كم منك</p>' +
        (o.phone ? '<p>📞 ' + o.phone + '</p>' : '') +
        (o.hours ? '<p>🕒 ' + o.hours + '</p>' : '') +
        (o.services ? '<p>🧾 ' + o.services + '</p>' : '') +
        '<a href="https://www.google.com/maps/dir/?api=1&origin=' + myLat + ',' + myLng + '&destination=' + o.lat + ',' + o.lng + '" target="_blank" style="display:block;margin-top:10px;padding:10px 16px;background:#e6c258;color:#0F1E3D;border-radius:10px;text-decoration:none;font-weight:700;font-size:13px;text-align:center">📍 الاتجاهات من موقعك (GPS)</a>';
      marker.bindPopup(popupHtml);
      markers.push(marker);
      bounds.push([o.lat, o.lng]);
    }
    userMarker.openPopup();
    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
    document.getElementById('officeCount').innerHTML = 'عرض <strong style="color:#e6c258">' + markers.length + '</strong> أقرب مكتب لموقعك الحالي 📍';
  }, function(err) {
    document.getElementById('officeCount').innerHTML = '❌ ما قدرناش نحدد موقعك — تأكد إن GPS شغال و اسمح بالوصول للموقع';
  }, { enableHighAccuracy: true, timeout: 10000 });
}

renderOffices('all');
</script>
