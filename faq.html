<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>الأسئلة الشائعة | خِدْمَتي AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1E3D">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/main.css">
<style>
body{font-family:Cairo,sans-serif;background:#0F1E3D;color:#e8eef8;margin:0;padding:0}
.header{background:linear-gradient(135deg,#0F1E3D,#1a2d5a);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.header a{color:#e6c258;text-decoration:none;font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.header-logo{display:flex;align-items:center;gap:10px}
.header-logo img{width:36px;height:36px;border-radius:8px}
.header-logo span{color:#fff;font-weight:900;font-size:18px}
.header-logo .ai{color:#e6c258}
.faq-hero{text-align:center;padding:60px 20px 40px}
.faq-hero h1{font-size:28px;font-weight:900;color:#fff;margin:0 0 10px}
.faq-hero p{font-size:16px;color:#8ea0c4;margin:0}
.faq-list{max-width:800px;margin:0 auto 60px;padding:0 20px}
.faq-item{background:linear-gradient(145deg,#162847,#0d1a33);border:1px solid #1e3556;border-radius:14px;margin-bottom:14px;overflow:hidden;cursor:pointer;transition:all .3s}
.faq-item:hover{border-color:#e6c258}
.faq-q{display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.faq-q-text{font-size:16px;font-weight:700;color:#fff}
.faq-q-icon{color:#e6c258;font-size:20px;font-weight:900;transition:transform .3s}
.faq-a{max-height:0;overflow:hidden;transition:max-height .4s ease;padding:0 20px;color:#c0cee0;font-size:15px;line-height:1.8}
.faq-a.active{max-height:500px;padding:0 20px 20px}
.faq-q-icon.active{transform:rotate(45deg)}
.footer{text-align:center;padding:30px 20px;color:#5a6a8a;font-size:13px}
.footer a{color:#e6c258;text-decoration:none;font-weight:700}
</style>
</head>
<body>

<div class="header">
  <a href="index.html">← الرجوع للرئيسية</a>
  <div class="header-logo">
    <img src="assets/k-logo.webp" alt="خِدْمَتي AI">
    <span>خِدْمَتي <span class="ai">AI</span></span>
  </div>
</div>

<div class="faq-hero">
  <h1>❓ الأسئلة الشائعة</h1>
  <p>كل اللي محتاج تعرفه عن خِدْمَتي AI</p>
</div>

<div class="faq-list" id="faqList"></div>

<div class="footer">
  <p>© 2024 خِدْمَتي AI | <a href="index.html">العودة للرئيسية</a></p>
</div>

<script>
var faqs=[
  {q:'هل خِدْمَتي AI منصة حكومية رسمية؟',a:'لا، خِدْمَتي AI منصة مستقلة بتساعدك تعرف وتفهم الخدمات الحكومية. كل الروابط والمعلومات من مصادر رسمية موثوقة، بس إحنا مش جهة حكومية.'},
  {q:'هل المنصة مجانية؟',a:'آه، خِدْمَتي AI مجانية بالكامل. تقدر تبحث، تسأل الـ AI، وتقرأ المقالات من غير أي رسوم.'},
  {q:'إزاي أتحدث بالصوت مع الـ AI؟',a:'في خانة الكتابة في الـ AI chat، هتلاقي زر مايك. اضغط عليه، اسمح للمتصفح يستخدم المايك، واتكلم بالعربي المصري. الكلام هيتحول لنص تلقائياً.'},
  {q:'هل بياناتي آمنة؟',a:'آه، بياناتك آمنة. إحنا مش بنحفظ بياناتك الشخصية على سيرفراتنا. كل اللي بتكتبه بيبقى على جهازك.'},
  {q:'إزاي أثبت التطبيق على موبايلي؟',a:'اضغط على زر "حمل التطبيق من هنا" في أعلى الموقع، واتبع الخطوات. أو من قائمة المتصفح اختار "Add to Home Screen".'},
  {q:'إزاي ألاقي خدمة معينة؟',a:'تقدر تبحث في الصفحة الرئيسية، أو في الدليل الحكومي الذكي، أو تسأل الـ AI مباشرة بالعربي المصري.'},
  {q:'هل تقدروا تساعدوني أخلص معاملاتي؟',a:'خِدْمَتي AI بيساعدك تفهم الخطوات والمستندات المطلوبة. لو محتاج حد يخلصها لك، تقدر تطلب من قسم "مقدمو الخدمات" وتتواصل مع مقدم خدمة.'},
  {q:'هل المنصة بتشتغل على الكمبيوتر والموبايل؟',a:'آه، خِدْمَتي AI بتشتغل على كل الأجهزة: موبايل، تابلت، كمبيوتر. وتقدر تثبتها كتطبيق على جهازك.'},
  {q:'إزاي أتواصل معكم؟',a:'تقدر تتواصل معانا من خلال الجروب بتاعنا على تيلجرام، أو من قسم "تواصل معنا" في أسفل الموقع.'},
  {q:'هل في رسوم على مقدمي الخدمة؟',a:'التسجيل كمقدم خدمة على المنصة مجاني. أي رسوم بتحصل بينك و بين مقدم الخدمة بشكل مباشر.'}
];

var list=document.getElementById('faqList');
list.innerHTML=faqs.map(function(f,i){
  return '<div class="faq-item" onclick="toggleFAQ('+i+')">'+
    '<div class="faq-q"><span class="faq-q-text">'+f.q+'</span><span class="faq-q-icon" id="icon'+i+'">+</span></div>'+
    '<div class="faq-a" id="ans'+i+'">'+f.a+'</div>'+
    '</div>';
}).join('');

function toggleFAQ(i){
  var ans=document.getElementById('ans'+i);
  var icon=document.getElementById('icon'+i);
  if(ans.classList.contains('active')){
    ans.classList.remove('active');
    icon.classList.remove('active');
  }else{
    ans.classList.add('active');
    icon.classList.add('active');
  }
}
</script>
</body>
</html>
