<style>

.arc-search{width:100%;background:#162847;border:1px solid #2a4068;border-radius:12px;padding:13px 42px 13px 14px;color:#e8eef8;font-family:Cairo;font-size:15px;box-sizing:border-box}

.arc-count{text-align:center;font-size:13px;color:#8ea0c4;margin:0 0 18px}

/* بطاقة القرار (نفس ستايل الهوم) */
.dn-card{background:linear-gradient(145deg,#162847,#0d1a33);border:1px solid #2a4068;border-radius:18px;padding:24px 20px;box-shadow:0 10px 40px rgba(0,0,0,.32);margin-bottom:18px;scroll-margin-top:80px}

.dn-date{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#8ea0c4;font-weight:700;background:#10213f;border:1px solid #1e3556;border-radius:8px;padding:5px 10px;margin-bottom:12px}
.dn-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(230,194,88,.12);border:1px solid rgba(230,194,88,.4);color:#e6c258;font-size:12.5px;font-weight:800;padding:6px 14px;border-radius:30px;margin-bottom:14px}
.dn-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.dn-ico{font-size:30px;line-height:1;flex-shrink:0;margin-top:2px}
.dn-cat{font-size:12px;color:#8ea0c4;font-weight:700;margin-bottom:3px}
.dn-title{font-size:19px;font-weight:800;color:#fff;line-height:1.4;margin:0}
.dn-summary{font-size:14.5px;color:#aebbdd;line-height:1.7;margin:0 0 16px}
.dn-block{margin-bottom:14px}
.dn-label{font-size:13px;font-weight:800;color:#e6c258;margin-bottom:8px}
.dn-list{margin:0;padding:0;list-style:none}
.dn-list li{position:relative;padding:6px 0 6px 22px;font-size:14px;color:#cdd7ee;line-height:1.6;border-bottom:1px solid rgba(255,255,255,.05)}
.dn-list li:last-child{border-bottom:none}
.dn-list li::before{content:"";position:absolute;left:2px;top:13px;width:8px;height:8px;border-radius:50%;background:#e6c258;opacity:.85}
.dn-fees{background:rgba(230,194,88,.06);border:1px solid rgba(230,194,88,.22);border-radius:12px;padding:14px 16px}
.dn-guide{background:#10213f;border:1px solid #1e3556;border-radius:12px;padding:14px 16px;font-size:14px;color:#c2cdec;line-height:1.7}
.dn-docs li::before{background:#10b981;opacity:.7}
.dn-sources{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.dn-src{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:#aebbdd;background:#162847;border:1px solid #2a4068;border-radius:8px;padding:6px 10px;text-decoration:none;transition:all .2s}
.dn-src:hover{border-color:#e6c258;color:#e6c258}
.dn-src .chk{color:#10b981;font-size:13px}
.dn-share{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dn-sharelink{background:#162847;border:1px solid #2a4068;color:#cdd7ee;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:Cairo;text-decoration:none;transition:all .2s}
.dn-sharelink:hover{border-color:#e6c258;color:#e6c258}
.arc-empty{text-align:center;padding:50px 20px;color:#8ea0c4;font-size:15px}

<script type="application/ld+json">{"@context": "https://schema.org", "@type": "CollectionPage", "name": "أرشيف القرارات الحكومية", "description": "أرشيف يومي للقرارات والتحديثات الحكومية المصرية: الرسوم، الأوراق، والمصادر الرسمية.", "url": "https://khidmatyai.com/archive.html", "inLanguage": "ar-EG", "isPartOf": {"@type": "WebSite", "name": "خِدْمَتي AI", "url": "https://khidmatyai.com/"}, "publisher": {"@type": "Organization", "name": "خِدْمَتي AI", "url": "https://khidmatyai.com/"}}</script>

<body>

<header class="arc-header">
  <a href="index.html" class="arc-back">
    <img src="assets/k-logo.webp" alt="خِدْمَتي AI">
    <span class="bn">خِدْمَتي <span class="ai">AI</span></span>
  </a>
  <a href="index.html" class="arc-home">← الرئاسية</a>
</header>

<div class="arc-hero">
  <h1>أرشيف <span class="gold">القرارات الحكومية</span></h1>
  <p>كل قرار وتحديث حكومي نزل يوميًا على خِدْمَتي AI — تصفّح اللي فات، وابحث عن أي قرار قديم بالكلمة. كل قرار بفضل هنا للابد، بالرسوم والأوراق والمصادر الرسمية.</p>
</div>

<div class="arc-controls">
  <div class="arc-search-wrap">
    <input type="text" id="arcSearch" class="arc-search" placeholder="ابحث في القرارات: ضريبي، رخصة، معاش...">
    <span class="si">🔍</span>
  </div>
  <div class="arc-filter" id="arcFilter"></div>
</div>
<p class="arc-count" id="arcCount"></p>

<div class="arc-list" id="archiveCards"></div>

<div class="arc-foot">
  أرشيف القرارات الحكومية — خِدْمَتي AI · <a href="index.html">الصفحة الرئاسية</a>
</div>

<script src="src/data/daily-needs.js"></script>
<script>
(function(){
  var host=document.getElementById('archiveCards');
  var filterBox=document.getElementById('arcFilter');
  var countEl=document.getElementById('arcCount');
  var searchEl=document.getElementById('arcSearch');
  if(!host||typeof dailyNeeds==='undefined'||!Array.isArray(dailyNeeds)){host.innerHTML='<div class="arc-empty">مفيش قرارات في الأرشيف دلوقتي — رجعنا قريب 👋</div>';return;}

  var cards=dailyNeeds.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  var activeCat='all';

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
  function fmtDate(d){var p=d.split('-');var m=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];return (parseInt(p[2],10))+' '+m[parseInt(p[1],10)-1]+' '+p[0];}

  function cardHTML(c){
    var site='https://khidmatyai.com/archive.html#card-'+c.date;
    var h='<div class="dn-card" id="card-'+esc(c.date)+'">';
    h+='<span class="dn-date">📅 '+fmtDate(c.date)+'</span> ';
    h+='<span class="dn-badge">'+esc(c.badge||'قرار جديد')+'</span>';
    h+='<div class="dn-top"><div class="dn-ico">'+esc(c.icon||'📋')+'</div><div><div class="dn-cat">'+esc(c.category||'')+'</div><h2 class="dn-title">'+esc(c.title||'')+'</h2></div></div>';
    if(c.summary){h+='<p class="dn-summary">'+esc(c.summary)+'</p>';}
    if(c.highlights&&c.highlights.length){h+='<div class="dn-block"><div class="dn-label">🆕 الجديد في القرار</div><ul class="dn-list">'+c.highlights.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';}
    if(c.fees&&c.fees.length){h+='<div class="dn-block"><div class="dn-label">💰 الرسوم</div><ul class="dn-list dn-fees">'+c.fees.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';}
    if(c.complexPapers){h+='<div class="dn-block"><div class="dn-label">🧭 الأوراق الصعبة — تمشي فيها إزاي</div><div class="dn-guide">'+esc(c.complexPapers)+'</div></div>';}
    if(c.documents&&c.documents.length){h+='<div class="dn-block"><div class="dn-label">📄 الأوراق المطلوبة</div><ul class="dn-list dn-docs">'+c.documents.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';}
    if(c.sources&&c.sources.length){h+='<div class="dn-block"><div class="dn-label">✅ المصادر الرسمية</div><div class="dn-sources">'+c.sources.map(function(s){return '<a class="dn-src" href="'+esc(s.url)+'" target="_blank" rel="noopener"><span class="chk">✓</span>'+esc(s.name)+'</a>';}).join('')+'</div></div>';}
    if(c.cta&&c.ctaLink){h+='<div style="margin-top:14px"><a class="dn-sharelink" href="'+esc(c.ctaLink)+'">'+esc(c.cta)+'</a></div>';}
    h+='<div class="dn-share">';
    h+='<a class="dn-sharelink" href="https://wa.me/?text='+encodeURIComponent(c.title+' — خِدْمَتي AI\n'+site)+'" target="_blank" rel="noopener">💬 واتساب</a>';
    h+='<a class="dn-sharelink" href="https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(site)+'" target="_blank" rel="noopener">📘 فيسبوك</a>';
    h+='<button type="button" class="dn-sharelink" data-link="'+esc(site)+'">🔗 نسخ رابط القرار</button>';
    h+='</div></div>';
    return h;
  }

  function buildFilter(){
    var cats=['all'];
    cards.forEach(function(c){if(c.category&&cats.indexOf(c.category)===-1)cats.push(c.category);});
    filterBox.innerHTML=cats.map(function(ct){return '<button type="button" class="arc-pill'+(ct===activeCat?' active':'')+'" data-cat="'+esc(ct)+'">'+(ct==='all'?'الكل':ct)+'</button>';}).join('');
    filterBox.querySelectorAll('.arc-pill').forEach(function(b){
      b.addEventListener('click',function(){activeCat=b.getAttribute('data-cat');filterBox.querySelectorAll('.arc-pill').forEach(function(x){x.classList.toggle('active',x===b);});render();});
    });
  }

  function render(){
    var q=searchEl.value.trim().toLowerCase();
    var list=cards.filter(function(c){
      var okCat=(activeCat==='all'||c.category===activeCat);
      var blob=((c.title||'')+' '+(c.summary||'')+' '+(c.category||'')+' '+((c.highlights||[]).join(' '))+' '+((c.fees||[]).join(' '))).toLowerCase();
      var okQ=!q||blob.indexOf(q)>-1;
      return okCat&&okQ;
    });
    countEl.innerHTML='عرض <b>'+list.length+'</b> من <b>'+cards.length+'</b> قرار';
    host.innerHTML=list.length?list.map(cardHTML).join(''):'<div class="arc-empty">مفيش نتايج لبحثك — جرّب كلمة تانية.</div>';
    host.querySelectorAll('.dn-sharelink[data-link]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var u=btn.getAttribute('data-link');
        try{navigator.clipboard.writeText(u).then(function(){var o=btn.textContent;btn.textContent='تم النسخ ✓';setTimeout(function(){btn.textContent=o;},1500);}).catch(function(){});}catch(e){}
      });
    });
  }

  buildFilter();
  searchEl.addEventListener('input',render);
  render();

  // لو فتح لينك بـ #card-DATE، سلّط عليه
  if(window.location.hash){
    setTimeout(function(){var t=document.querySelector(window.location.hash);if(t){t.classList.add('target');t.scrollIntoView({behavior:'smooth',block:'start'});}},200);
  }
})();
</script>
</body>
