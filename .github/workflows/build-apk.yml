name: Build Scan Macaron APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'twa-build/**'
      - 'scan/icon-512.png'
      - 'scan/icon-512-maskable.png'
      - 'scan/manifest.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK (bubblewrap expects 'tools' + build-tools)
        run: |
          # bubblewrap بيتحقق من $SDK/tools/bin/sdkmanager + build-tools
          if [ ! -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            echo "Installing cmdline-tools as 'tools' (bubblewrap structure)..."
            curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmd.zip
            unzip -q /tmp/cmd.zip -d /tmp/cmdtmp
            rm -rf "$ANDROID_HOME/tools"
            mv /tmp/cmdtmp/cmdline-tools "$ANDROID_HOME/tools"
            # symlink cmdline-tools/latest too (للإصدارات الجديدة)
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            ln -sf "$ANDROID_HOME/tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/tools/bin/sdkmanager"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version
          echo "Installing build-tools + platforms + platform-tools..."
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          echo "---structure---"
          ls "$ANDROID_HOME" | head -20
          ls "$ANDROID_HOME/build-tools" 2>/dev/null | tail -2
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -2
          echo "SDK ready"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode signing keystore
        env:
          KS_BASE64: ${{ secrets.SCANMACARON_KEYSTORE_BASE64 }}
        run: echo "$KS_BASE64" | base64 -d > /tmp/scanmacaron.keystore

      - name: Write Bubblewrap config (non-interactive)
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {"jdkPath":"$JAVA_HOME","androidSdkPath":"$ANDROID_SDK_ROOT"}
          EOF
          cat ~/.bubblewrap/config.json

      - name: Build TWA APK
        working-directory: twa-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.SCANMACARON_KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.SCANMACARON_KS_PASS }}
        run: bubblewrap build --manifest . --signingKeyPath=/tmp/scanmacaron.keystore --signingKeyAlias=scanmacaron --skipPwaValidation

      - name: Locate APK
        working-directory: twa-build
        run: find . -name "*.apk" -type f -exec ls -la {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-macaron-apk
          path: twa-build/**/*.apk
          if-no-files-found: error
          retention-days: 30
