<script>
(function(){
  var cats = window.interactiveCategories || interactiveCategories;
  var arts = window.interactiveArticles || interactiveArticles;
  var grid = document.getElementById('articlesGrid');
  var chipsEl = document.getElementById('chips');
  var searchEl = document.getElementById('searchBox');
  var emptyEl = document.getElementById('emptyState');
  var countEl = document.getElementById('heroCount');
  var activeCat = 'all';
  var query = '';

  function catObj(id){ return cats.find(function(c){return c.id===id}); }
  function catName(id){ var c=catObj(id); return c?c.name:id; }
  function catIcon(id){ var c=catObj(id); return c?c.icon:'📋'; }
  function countFor(id){ return id==='all'?arts.length:arts.filter(function(a){return a.cat===id}).length; }
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderChips(){
    var html = '<button class="chip '+(activeCat==='all'?'on':'')+'" data-cat="all">الكل <span>'+arts.length+'</span></button>';
    cats.forEach(function(c){
      html += '<button class="chip '+(activeCat===c.id?'on':'')+'" data-cat="'+c.id+'">'+c.icon+' '+c.name+' <span>'+countFor(c.id)+'</span></button>';
    });
    chipsEl.innerHTML = html;
  }

  function render(){
    var q = query.trim().toLowerCase();
    var list = arts.filter(function(a){
      if(activeCat!=='all' && a.cat!==activeCat) return false;
      if(q){ if((a.title+' '+a.desc).toLowerCase().indexOf(q)<0) return false; }
      return true;
    });
    if(!list.length){
      grid.innerHTML='';
      emptyEl.style.display='block';
      emptyEl.innerHTML='🔍 مفيش نتائج لـ"'+esc(query)+'"<br>جرّب كلمة تانية أو شيل التصفية';
      countEl.textContent='مفيش نتائج';
      return;
    }
    emptyEl.style.display='none';
    grid.innerHTML = list.map(function(a){
      return '<a class="article-card" href="services/'+a.slug+'.html">'+
        '<div class="article-icon">'+(a.icon||catIcon(a.cat))+'</div>'+
        '<span class="article-cat">'+catIcon(a.cat)+' '+catName(a.cat)+'</span>'+
        '<h3 class="article-title">'+esc(a.title)+'</h3>'+
        '<p class="article-excerpt">'+esc(a.desc)+'</p>'+
        '<span class="article-cta">ابدأ الخدمة التفاعلية ←</span>'+
      '</a>';
    }).join('');
    countEl.textContent = 'بتعرض '+list.length+' من '+arts.length+' دليل تفاعلي';
  }

  chipsEl.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.chip') : null;
    if(!b){ b=e.target; if(!b.classList.contains('chip')) return; }
    activeCat = b.getAttribute('data-cat');
    renderChips();
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  });
  searchEl.addEventListener('input', function(){ query=this.value; render(); });

  renderChips();
  render();

  // إعلان كتاب «قوة العقل» بعد الشبكة
  var bookAd = `<aside style="background:linear-gradient(145deg,#0d1a33,#162847);margin:20px 16px;padding:16px;border-radius:12px;border:1px solid #1e3556;display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:700px;margin-left:auto;margin-right:auto">
  <img src="assets/cover-book1-ar.webp" alt="غلاف قوة العقل" style="width:55px;height:75px;border-radius:6px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.5)">
  <div style="flex:1;min-width:150px">
    <div style="font-size:13px;color:#e6c258;font-weight:800">📚 قوة العقل وتطوير الذات</div>
    <div style="font-size:12px;color:#8ea0c4;margin:2px 0">عربي 75ج | إنجليزي 100ج | <b style="color:#e6c258">الاثنين 129ج</b></div>
    <div style="font-size:11px;color:#5a6a8a">📄 PDF فقط ⏰ عرض محدود</div>
  </div>
  <a href="https://wa.me/201005305955?text=أريد%20شراء%20سلسلة%20قوة%20العقل%20-%20العرض%20129ج" target="_blank" rel="noopener" style="background:#e6c258;color:#0F1E3D;text-decoration:none;font-size:14px;font-weight:800;padding:10px 18px;border-radius:8px;white-space:nowrap">📲 اطلب</a>
</aside>`;
  grid.insertAdjacentHTML('afterend', bookAd);
})();
</script>
