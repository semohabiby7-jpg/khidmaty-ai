<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>حاسبة الرسوم | خِدْمَتي AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1E3D">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/main.css">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
body{font-family:Cairo,sans-serif;background:#0F1E3D;color:#e8eef8;margin:0;padding:0}
.header{background:linear-gradient(135deg,#0F1E3D,#1a2d5a);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.header a{color:#e6c258;text-decoration:none;font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.header-logo{display:flex;align-items:center;gap:10px}
.header-logo img{width:36px;height:36px;border-radius:8px}
.header-logo span{color:#fff;font-weight:900;font-size:18px}
.header-logo .ai{color:#e6c258}
.calc-hero{text-align:center;padding:50px 20px 20px}
.calc-hero h1{font-size:28px;font-weight:900;color:#fff;margin:0 0 10px}
.calc-hero p{font-size:16px;color:#8ea0c4;margin:0}
/* Tabs */
.cat-tabs{max-width:700px;margin:0 auto 24px;padding:0 16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cat-tab{background:#162847;border:1px solid #2a4068;border-radius:30px;padding:10px 18px;font-size:14px;font-weight:700;color:#8ea0c4;cursor:pointer;transition:all .2s;font-family:Cairo}
.cat-tab:hover{border-color:#e6c258;color:#e6c258}
.cat-tab.active{background:linear-gradient(135deg,#e6c258,#d4a843);color:#0F1E3D;border-color:#e6c258}
/* Services grid */
.calc-services{max-width:700px;margin:0 auto 30px;padding:0 20px}
.calc-services-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.calc-service-tag{background:#162847;border:1px solid #2a4068;border-radius:12px;padding:14px 10px;text-align:center;font-size:13px;color:#8ea0c4;cursor:pointer;transition:all .2s;font-weight:600}
.calc-service-tag:hover{border-color:#e6c258;color:#e6c258;transform:translateY(-2px)}
.calc-service-tag.active{border-color:#e6c258;background:rgba(230,194,88,.1);color:#e6c258}
/* Calculator box */
.calc-box{max-width:600px;margin:0 auto 40px;padding:0 20px}
.calc-card{background:linear-gradient(145deg,#162847,#0d1a33);border:1px solid #1e3556;border-radius:16px;padding:28px}
.calc-card h2{font-size:20px;font-weight:800;color:#e6c258;margin:0 0 6px;text-align:center}
.calc-card .calc-sub{font-size:13px;color:#8ea0c4;text-align:center;margin-bottom:20px}
.calc-field{margin-bottom:16px}
.calc-field label{display:block;font-size:14px;color:#8ea0c4;margin-bottom:8px;font-weight:600}
.calc-field select,.calc-field input{width:100%;padding:12px 16px;background:#0F1E3D;border:1px solid #2a4068;border-radius:10px;color:#fff;font-size:16px;font-family:Cairo,sans-serif;box-sizing:border-box}
.calc-field select:focus,.calc-field input:focus{outline:none;border-color:#e6c258}
.calc-field option{background:#0F1E3D;color:#fff}
.calc-btn{width:100%;padding:14px;background:linear-gradient(135deg,#e6c258,#d4a843);color:#0F1E3D;border:none;border-radius:10px;font-size:18px;font-weight:900;cursor:pointer;transition:all .3s;font-family:Cairo,sans-serif}
.calc-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(230,194,88,.3)}
/* Result */
.calc-result{display:none;background:linear-gradient(145deg,#0d1a33,#162847);border:2px solid #e6c258;border-radius:14px;padding:24px;margin-top:20px;text-align:center}
.calc-result.active{display:block}
.calc-breakdown{background:#0F1E3D;border-radius:10px;padding:14px;margin:14px 0;text-align:right}
.calc-breakdown-row{display:flex;justify-content:space-between;font-size:14px;color:#c0cee0;padding:4px 0}
.calc-breakdown-total{display:flex;justify-content:space-between;font-size:16px;font-weight:800;color:#e6c258;padding-top:10px;margin-top:8px;border-top:1px solid #2a4068}
.calc-result-amount{font-size:36px;font-weight:900;color:#e6c258;margin:10px 0}
.calc-result-note{font-size:13px;color:#8ea0c4;margin-top:10px;line-height:1.5}
.footer{text-align:center;padding:30px 20px;color:#5a6a8a;font-size:13px}
.footer a{color:#e6c258;text-decoration:none;font-weight:700}
</style>
</head>
<body>

<div class="header">
  <a href="index.html">← الرجوع للرئيسية</a>
  <div class="header-logo">
    <img src="assets/k-logo.webp" alt="خِدْمَتي AI">
    <span>خِدْمَتي <span class="ai">AI</span></span>
  </div>
</div>

<div class="calc-hero">
  <h1>🧮 حاسبة الرسوم</h1>
  <p>اعرف رسوم أي خدمة حكومية في ثواني</p>
</div>

<div class="cat-tabs" id="catTabs"></div>

<div class="calc-services">
  <div class="calc-services-grid" id="servicesGrid"></div>
</div>

<div class="calc-box">
  <div class="calc-card" id="calcCard" style="display:none">
    <h2 id="calcTitle">احسب الرسوم</h2>
    <div class="calc-sub" id="calcSub"></div>
    <div id="calcFields"></div>
    <button class="calc-btn" onclick="calculate()">احسب الرسوم</button>
    <div class="calc-result" id="resultBox">
      <div class="calc-result-amount" id="resultAmount">0 جنيه</div>
      <div class="calc-breakdown" id="breakdownBox" style="display:none"></div>
      <div class="calc-result-note" id="resultNote"></div>
    </div>
  </div>
</div>

<div class="footer">
  <p>© 2026 خِدْمَتي AI | <a href="index.html">العودة للرئيسية</a> | <a href="articles.html">المقالات</a> | <a href="faq.html">الأسئلة الشائعة</a></p>
</div>

<script>
/* ============================================================
   بيانات الخدمات — مقسّمة حسب التصنيف
   ============================================================ */
var categories = [
  { id:'traffic', name:'🚗 مرور' },
  { id:'civil', name:'🪪 أحوال مدنية' },
  { id:'passport', name:'🛂 جوازات' },
  { id:'business', name:'💼 شركات' },
  { id:'insurance', name:'👷 تأمينات' },
  { id:'notary', name:'⚖️ شهر عقاري' },
  { id:'postal', name:'🏦 بريد' },
  { id:'education', name:'🎓 تعليم' }
];

var fees = {
  /* ===== 🚗 مرور ===== */
  license_car: { cat:'traffic', name:'تجديد رخصة سيارة', detailed:'car', note:'تجديد رخصة السيارة يشمل رسوم المرور + الفحص الفني + التأمين الإجباري' },
  license_drive: { cat:'traffic', name:'رخصة قيادة', simple:true, normal:115, express:250, note:'العادية 115 جنيه | الدولية 250 جنيه' },
  license_motorcycle: { cat:'traffic', name:'رخصة تسيكل', simple:true, normal:60, express:100, note:'العادية 60 جنيه | المستعجلة 100 جنيه' },
  car_transfer: { cat:'traffic', name:'نقل ملكية سيارة', simple:true, normal:100, express:300, note:'تتراوح بين 100-500 جنيه حسب سنة الموديل' },

  /* ===== 🪪 أحوال مدنية ===== */
  id_card: { cat:'civil', name:'بطاقة الرقم القومي', simple:true, normal:15, express:60, note:'الاستلام بعد 3 أيام للعادي، نفس اليوم للمستعجل' },
  id_card_lost: { cat:'civil', name:'بدل فاقد بطاقة', simple:true, normal:15, express:60, note:'لازم تقدم محضر لو البطاقة سرقت' },
  birth_cert: { cat:'civil', name:'شهادة ميلاد', simple:true, normal:15, express:50, note:'الاستلام فوري أو خلال 24 ساعة' },
  death_cert: { cat:'civil', name:'شهادة وفاة', simple:true, normal:15, express:50, note:'لازم تسجل الوفاة خلال 30 يوم' },
  criminal_record: { cat:'civil', name:'صحيفة حالة جنائية', simple:true, normal:63, express:113, note:'50 جنيه رسم + 13 جنيه خدمة. استلام خلال 24 ساعة' },
  marriage: { cat:'civil', name:'توثيق زواج', simple:true, normal:50, express:100, note:'الطرفين لازم يكونوا حاضرين' },
  no_marriage: { cat:'civil', name:'شهادة عدم زواج', simple:true, normal:15, express:50, note:'15 جنيه عادي | 50 جنيه مستعجل' },

  /* ===== 🛂 جوازات ===== */
  passport_new: { cat:'passport', name:'جواز سفر جديد', detailed:'passport', note:'الرسوم تختلف حسب عدد الصفحات و سرعة الاستلام' },
  passport_renew: { cat:'passport', name:'تجديد جواز السفر', detailed:'passport', note:'نفس رسوم الاستخراج الجديد' },
  residence: { cat:'passport', name:'إقامة لأجنبي', simple:true, normal:200, express:1000, note:'العادية 200-500 جنيه | الخاصة 1000+ جنيه' },
  nationality: { cat:'passport', name:'الجنسية المصرية', simple:true, normal:500, express:500, note:'رسوم تقديم الطلب 500 جنيه. الموافقة بقرار من رئيس الجمهورية' },

  /* ===== 💼 شركات ===== */
  commercial_reg: { cat:'business', name:'سجل تجاري', detailed:'commercial', note:'الرسوم تختلف حسب نوع النشاط و رأس المال' },
  trade_license: { cat:'business', name:'رخصة تجارية', simple:true, normal:200, express:2000, note:'تختلف حسب النشاط: 200-2000 جنيه' },
  industrial_fund: { cat:'business', name:'صندوق تنمية الصناعة', simple:true, normal:500, express:500, note:'رسوم تسجيل 500 جنيه + قروض ميسرة' },
  msme_loan: { cat:'business', name:'قرض تنمية المشروعات', simple:true, normal:0, express:0, note:'مجاني التقديم. القرض من 10 آلاف لـ 2 مليون بفائدة 3-5%' },

  /* ===== 👷 تأمينات ===== */
  social_insurance: { cat:'insurance', name:'تسجيل تأمين اجتماعي', simple:true, normal:0, express:0, note:'مجاني. اشتراكات: العامل 14% + صاحب العمل 11%' },
  health_card: { cat:'insurance', name:'كارت علاج مجاني', simple:true, normal:0, express:0, note:'مجاني. بيغطي العلاج في المستشفيات الحكومية' },
  pension: { cat:'insurance', name:'استخراج معاش', simple:true, normal:0, express:0, note:'مجاني التقديم. المعاش بيتحسب حسب مدة الاشتراك' },

  /* ===== ⚖️ شهر عقاري ===== */
  notary: { cat:'notary', name:'توثيق عقد (بيع/رهن)', detailed:'notary', note:'الرسوم = 0.1% من قيمة العقار + رسوم إدارية' },
  inheritance: { cat:'notary', name:'تسجيل ميراث', detailed:'notary_inheritance', note:'الرسوم حسب قيمة الميراث' },
  building_permit: { cat:'notary', name:'تصريح بناء', simple:true, normal:500, express:5000, note:'تتراوح بين 500-5000 جنيه حسب مساحة المبنى' },

  /* ===== 🏦 بريد ===== */
  postal_savings: { cat:'postal', name:'حساب توفير بريدي', simple:true, normal:50, express:50, note:'الحد الأدنى للإيداع 50 جنيه. فائدة سنوية 12-15%' },

  /* ===== 🎓 تعليم ===== */
  school_reg: { cat:'education', name:'تسجيل طفل في مدرسة', simple:true, normal:0, express:0, note:'مجاني في المدارس الحكومية' },
  degree_cert: { cat:'education', name:'شهادة مؤهل دراسي', simple:true, normal:20, express:200, note:'من 20 لـ 200 جنيه حسب المؤهل' }
};

/* ============================================================
   الحاسبات التفصيلية
   ============================================================ */
var detailedCalculators = {

  /* تجديد رخصة سيارة */
  car: {
    title:'تجديد رخصة سيارة',
    sub:'احسب الرسوم الكلية (مرور + فحص + تأمين)',
    fields:[
      { id:'car_type', label:'نوع السيارة', type:'select', options:[
        { v:'private', t:'🚗 خصوصي' },
        { v:'truck', t:'🚚 نقل' },
        { v:'microbus', t:'🚐 ميكروباص' }
      ]},
      { id:'duration', label:'مدة التجديد', type:'select', options:[
        { v:'1', t:'1 سنة' },
        { v:'3', t:'3 سنوات' }
      ]}
    ],
    calc: function(v){
      var base = { private:266, truck:400, microbus:350 }[v.car_type];
      var total = base * parseInt(v.duration);
      var inspection = 150; // فحص فني
      var insurance = 400; // تأمين إجباري
      var grand = total + inspection + insurance;
      return {
        amount: grand + ' جنيه',
        breakdown:[
          { label:'رسوم المرور', value: total + ' جنيه' },
          { label:'فحص فني', value: inspection + ' جنيه' },
          { label:'تأمين إجباري', value: insurance + ' جنيه' }
        ],
        note:'تجديد ' + (v.duration==='1'?'سنة':'3 سنوات') + ' لسيارة ' + ({private:'خصوصي',truck:'نقل',microbus:'ميكروباص'}[v.car_type])
      };
    }
  },

  /* جواز سفر جديد */
  passport: {
    title:'جواز سفر جديد',
    sub:'احسب رسوم استخراج الجواز حسب السرعة و الصفحات',
    fields:[
      { id:'speed', label:'نوع الخدمة', type:'select', options:[
        { v:'normal', t:'⏱ عادي' },
        { v:'express', t:'⚡ مستعجل' }
      ]},
      { id:'pages', label:'عدد الصفحات', type:'select', options:[
        { v:'36', t:'📄 36 صفحة' },
        { v:'72', t:'📄 72 صفحة' }
      ]}
    ],
    calc: function(v){
      var base = v.speed==='express' ? 400 : 250;
      var extraPages = v.pages==='72' ? 200 : 0; // 72 صفحة أغلى
      var total = base + extraPages;
      return {
        amount: total + ' جنيه',
        breakdown:[
          { label:'رسوم الجواز (' + (v.speed==='express'?'مستعجل':'عادي') + ')', value: base + ' جنيه' },
          { label:'صفحات إضافية (72)', value: extraPages > 0 ? extraPages + ' جنيه' : 'مجاني' }
        ],
        note:'استلام بعد أسبوع للعادي، 3 أيام للمستعجل'
      };
    }
  },

  /* سجل تجاري */
  commercial: {
    title:'استخراج سجل تجاري',
    sub:'احسب الرسوم حسب النشاط و رأس المال',
    fields:[
      { id:'activity', label:'نوع النشاط', type:'select', options:[
        { v:'commercial', t:'🏪 تجاري' },
        { v:'industrial', t:'🏭 صناعي' },
        { v:'service', t:'🛎️ خدمي' }
      ]},
      { id:'capital', label:'رأس المال (جنيه)', type:'number', placeholder:'50000' }
    ],
    calc: function(v){
      var baseFee = { commercial:50, industrial:200, service:100 }[v.activity];
      var capital = parseInt(v.capital) || 0;
      // رسوم إضافية حسب رأس المال (0.1% من رأس المال، حد أقصى 2000)
      var capitalFee = Math.min(Math.round(capital * 0.001), 2000);
      var total = baseFee + capitalFee;
      return {
        amount: total + ' جنيه',
        breakdown:[
          { label:'رسوم السجل (' + ({commercial:'تجاري',industrial:'صناعي',service:'خدمي'}[v.activity]) + ')', value: baseFee + ' جنيه' },
          { label:'رسوم رأس المال (0.1%)', value: capitalFee + ' جنيه' }
        ],
        note:'رسوم إضافية حسب رأس المال (حد أقصى 2000 جنيه)'
      };
    }
  },

  /* توثيق عقد في الشهر العقاري */
  notary: {
    title:'توثيق عقد (بيع/رهن)',
    sub:'احسب رسوم التوثيق حسب قيمة العقار',
    fields:[
      { id:'property_value', label:'قيمة العقار / العقد (جنيه)', type:'number', placeholder:'1000000' },
      { id:'transaction', label:'نوع المعاملة', type:'select', options:[
        { v:'sale', t:'🤝 بيع' },
        { v:'mortgage', t:'🏦 رهن' },
        { v:'gift', t:'🎁 هبة' }
      ]}
    ],
    calc: function(v){
      var value = parseInt(v.property_value) || 0;
      if (value === 0) return { amount:'ادخل قيمة العقار', breakdown:[], note:'ادخل قيمة العقار عشان نحسب الرسوم' };
      var rate = { sale:0.001, mortgage:0.0005, gift:0.002 }[v.transaction];
      var fee = Math.round(value * rate);
      var adminFee = 50; // رسوم إدارية
      var total = fee + adminFee;
      return {
        amount: total + ' جنيه',
        breakdown:[
          { label:'رسوم التوثيق (' + ({sale:'بيع',mortgage:'رهن',gift:'هبة'}[v.transaction]) + ')', value: fee + ' جنيه' },
          { label:'رسوم إدارية', value: adminFee + ' جنيه' }
        ],
        note:'الرسوم = ' + (rate*100) + '% من قيمة العقار'
      };
    }
  },

  /* تسجيل ميراث */
  notary_inheritance: {
    title:'تسجيل ميراث',
    sub:'احسب رسوم تسجيل إعلام الوراثة',
    fields:[
      { id:'inheritance_value', label:'قيمة الميراث (جنيه)', type:'number', placeholder:'500000' }
    ],
    calc: function(v){
      var value = parseInt(v.inheritance_value) || 0;
      if (value === 0) return { amount:'ادخل قيمة الميراث', breakdown:[], note:'ادخل قيمة الميراث عشان نحسب الرسوم' };
      var fee = Math.round(value * 0.002); // 0.2% من قيمة الميراث
      var adminFee = 100;
      var total = fee + adminFee;
      return {
        amount: total + ' جنيه',
        breakdown:[
          { label:'رسوم التسجيل (0.2%)', value: fee + ' جنيه' },
          { label:'رسوم إدارية', value: adminFee + ' جنيه' }
        ],
        note:'سجّل الميراث في أقرب وقت عشان تتجنب أي نزاعات'
      };
    }
  }
};

/* ============================================================
   الكود الرئيسي
   ============================================================ */
var currentCat = 'traffic';
var currentService = null;

// بناء التبويبات
var catTabs = document.getElementById('catTabs');
catTabs.innerHTML = categories.map(function(c){
  return '<div class="cat-tab" onclick="selectCat(\'' + c.id + '\')" id="tab-' + c.id + '">' + c.name + '</div>';
}).join('');

function selectCat(catId){
  currentCat = catId;
  // تحديث التبويبات
  categories.forEach(function(c){
    var el = document.getElementById('tab-' + c.id);
    if (el) el.classList.toggle('active', c.id === catId);
  });
  // عرض خدمات التصنيف
  var grid = document.getElementById('servicesGrid');
  var services = Object.keys(fees).filter(function(k){ return fees[k].cat === catId; });
  grid.innerHTML = services.map(function(k){
    return '<div class="calc-service-tag" onclick="selectService(\'' + k + '\')" id="svc-' + k + '">' + fees[k].name + '</div>';
  }).join('');
  // إخفاء الحاسبة
  document.getElementById('calcCard').style.display = 'none';
  currentService = null;
}

function selectService(key){
  currentService = key;
  // تحديث التاجز النشطة
  Object.keys(fees).forEach(function(k){
    var el = document.getElementById('svc-' + k);
    if (el) el.classList.toggle('active', k === key);
  });
  // عرض الحاسبة
  var data = fees[key];
  var card = document.getElementById('calcCard');
  var title = document.getElementById('calcTitle');
  var sub = document.getElementById('calcSub');
  var fieldsBox = document.getElementById('calcFields');
  var resultBox = document.getElementById('resultBox');
  resultBox.classList.remove('active');

  card.style.display = 'block';
  title.textContent = data.name;

  if (data.simple){
    // حاسبة بسيطة (عادي/مستعجل)
    sub.textContent = 'اختار نوع الخدمة';
    fieldsBox.innerHTML =
      '<div class="calc-field"><label>نوع الخدمة</label><select id="speedSelect">' +
      '<option value="normal">⏱ عادي (' + data.normal + ' جنيه)</option>' +
      (data.express !== data.normal ? '<option value="express">⚡ مستعجل (' + data.express + ' جنيه)</option>' : '') +
      '</select></div>';
  } else if (data.detailed){
    // حاسبة تفصيلية
    var calc = detailedCalculators[data.detailed];
    sub.textContent = calc.sub;
    fieldsBox.innerHTML = calc.fields.map(function(f){
      if (f.type === 'select'){
        return '<div class="calc-field"><label>' + f.label + '</label><select id="field-' + f.id + '">' +
          f.options.map(function(o){ return '<option value="' + o.v + '">' + o.t + '</option>'; }).join('') +
          '</select></div>';
      } else {
        return '<div class="calc-field"><label>' + f.label + '</label><input type="number" id="field-' + f.id + '" placeholder="' + (f.placeholder||'0') + '"></div>';
      }
    }).join('');
  }

  // scroll للحاسبة
  card.scrollIntoView({ behavior:'smooth', block:'center' });
}

function calculate(){
  if (!currentService) return;
  var data = fees[currentService];
  var resultBox = document.getElementById('resultBox');
  var amountEl = document.getElementById('resultAmount');
  var noteEl = document.getElementById('resultNote');
  var breakdownBox = document.getElementById('breakdownBox');

  if (data.simple){
    var speed = document.getElementById('speedSelect').value;
    var amount = speed === 'express' ? data.express : data.normal;
    amountEl.textContent = amount + ' جنيه';
    noteEl.textContent = data.note;
    breakdownBox.style.display = 'none';
  } else if (data.detailed){
    var calc = detailedCalculators[data.detailed];
    var values = {};
    calc.fields.forEach(function(f){
      var el = document.getElementById('field-' + f.id);
      values[f.id] = el ? el.value : '';
    });
    var result = calc.calc(values);
    amountEl.textContent = result.amount;
    noteEl.textContent = result.note;
    if (result.breakdown && result.breakdown.length > 0){
      breakdownBox.innerHTML = result.breakdown.map(function(r){
        return '<div class="calc-breakdown-row"><span>' + r.label + '</span><span>' + r.value + '</span></div>';
      }).join('') + '<div class="calc-breakdown-total"><span>المجموع</span><span>' + result.amount + '</span></div>';
      breakdownBox.style.display = 'block';
    } else {
      breakdownBox.style.display = 'none';
    }
  }
  resultBox.classList.add('active');
}

// ابدأ بتصنيف مرور
selectCat('traffic');
</script>
