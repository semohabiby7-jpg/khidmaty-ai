name: Build Scan Macaron APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'twa-build/**'
      - 'scan/icon-512.png'
      - 'scan/icon-512-maskable.png'
      - 'scan/manifest.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK (symlink 'tools' for bubblewrap + ensure build-tools)
        run: |
          # ubuntu-latest runner بيجي بـSDK + cmdline-tools/latest جاهزين
          # bubblewrap بيدوّر على $ANDROID_HOME/tools/bin/sdkmanager (المسار القديم) — نعمل symlink
          if [ ! -e "$ANDROID_HOME/tools" ]; then
            ln -sf "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/tools/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          # نقبل التراخيص + نتأكد من build-tools + platforms
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" "platform-tools" >/dev/null 2>&1 || true
          echo "---structure---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null | tail -2
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -2
          echo "SDK ready"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode signing keystore
        env:
          KS_BASE64: ${{ secrets.SCANMACARON_KEYSTORE_BASE64 }}
        run: echo "$KS_BASE64" | base64 -d > /tmp/scanmacaron.keystore

      - name: Write Bubblewrap config (non-interactive)
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {"jdkPath":"$JAVA_HOME","androidSdkPath":"$ANDROID_SDK_ROOT"}
          EOF
          cat ~/.bubblewrap/config.json

      - name: Build TWA APK
        working-directory: twa-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.SCANMACARON_KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.SCANMACARON_KS_PASS }}
        run: yes n | bubblewrap build --manifest twa-manifest.json --signingKeyPath=/tmp/scanmacaron.keystore --signingKeyAlias=scanmacaron --skipPwaValidation

      - name: Locate APK
        working-directory: twa-build
        run: find . -name "*.apk" -type f -exec ls -la {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-macaron-apk
          path: twa-build/**/*.apk
          if-no-files-found: error
          retention-days: 30
