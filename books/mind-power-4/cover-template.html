<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 683px;
    height: 1024px;
    background: #0a0806;
    position: relative;
    overflow: hidden;
    font-family: 'Noto Naskh Arabic', 'Amiri', 'Arial', serif;
  }
  .bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image: url('cover.webp');
    background-size: cover;
    background-position: center;
    opacity: 0.85;
  }
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(10,8,6,0.75) 0%, rgba(10,8,6,0.15) 30%, rgba(10,8,6,0.15) 60%, rgba(10,8,6,0.85) 100%);
  }
  .content {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 50px 40px;
  }
  .top {
    text-align: center;
  }
  .series-name {
    font-size: 42px;
    font-weight: 700;
    color: #F4CD66;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(244,205,102,0.4), 0 2px 8px rgba(0,0,0,0.8);
    margin-bottom: 8px;
  }
  .ornament {
    color: #F4CD66;
    font-size: 20px;
    margin: 6px 0;
    opacity: 0.8;
    letter-spacing: 4px;
  }
  .volume-num {
    font-size: 72px;
    font-weight: 800;
    color: #F4CD66;
    text-shadow: 0 0 30px rgba(244,205,102,0.5), 0 2px 10px rgba(0,0,0,0.8);
    line-height: 1;
    margin-top: 10px;
  }
  .spacer { flex: 1; }
  .bottom {
    text-align: center;
  }
  .title {
    font-size: 48px;
    font-weight: 800;
    color: #F4CD66;
    text-shadow: 0 0 25px rgba(244,205,102,0.4), 0 2px 12px rgba(0,0,0,0.9);
    line-height: 1.3;
    margin-bottom: 20px;
  }
  .ornament2 {
    color: #F4CD66;
    font-size: 20px;
    margin: 10px 0;
    opacity: 0.8;
    letter-spacing: 4px;
  }
  .signature {
    font-size: 28px;
    color: #F4CD66;
    font-style: italic;
    font-family: 'Georgia', 'Times New Roman', serif;
    text-shadow: 0 0 15px rgba(244,205,102,0.3), 0 2px 6px rgba(0,0,0,0.8);
    margin-top: 8px;
    opacity: 0.95;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="top">
      <div class="series-name">قوة العقل</div>
      <div class="ornament">◆━━━━◆</div>
      <div class="volume-num">4</div>
    </div>
    <div class="spacer"></div>
    <div class="bottom">
      <div class="title">مين بيسوق؟</div>
      <div class="ornament2">◆━━━━◆</div>
      <div class="signature">M. Ismail</div>
    </div>
  </div>
</body>
</html>
