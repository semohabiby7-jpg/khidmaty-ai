<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>حسابات عربيات التشغيل</title>
<style>
:root{
  --ink:#0b1117; --ink-2:#131f2b;
  --muted:#6b7583; --line:#e5e9ef; --line-2:#eef1f5;
  --bg:#f4f6f9; --card:#ffffff;
  --accent:#0d6a5f; --accent-2:#0a5249; --accent-soft:#e7f3f1;
  --pos:#0f7b4f; --neg:#c02637; --warn:#a26400; --warn-soft:#fff7e8;
  --r:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(11,17,23,.04), 0 10px 26px rgba(11,17,23,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
b,strong{font-weight:800}

/* ===== التوب بار ===== */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15.5px;letter-spacing:-.2px}
.brand .dot{width:34px;height:34px;border-radius:11px;background:linear-gradient(160deg,#1c2b3a,#0b1117);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.brand .sub{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:-4px;letter-spacing:0}
.nav{display:flex;gap:2px;margin-inline-start:auto;background:#eef1f5;padding:4px;border-radius:12px}
.nav a{padding:7px 14px;border-radius:9px;font-size:12.5px;color:var(--muted);font-weight:700;transition:.15s;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(11,17,23,.12)}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 110px}

/* ===== كارت الأرصدة ===== */
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,#16232f 0%,#0b1117 62%);color:#fff;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 14px 34px rgba(11,17,23,.16)}
.hero:after{content:"";position:absolute;inset-inline-end:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(13,106,95,.6),transparent 70%)}
.hero .eyebrow{font-size:12px;font-weight:700;color:#9db0bf;position:relative;z-index:1}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;direction:ltr;text-align:start;margin-top:2px;position:relative;z-index:1;line-height:1.25}
.hero .big small{font-size:13.5px;font-weight:700;color:#9db0bf;margin-inline-start:7px;letter-spacing:0}
.hero-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px;position:relative;z-index:1}
@media(min-width:720px){.hero-kpis{grid-template-columns:repeat(4,1fr)}}
.hk{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:9px 12px}
.hk .k{font-size:11px;color:#9db0bf;font-weight:700}
.hk .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:1px;direction:ltr;text-align:start}
.hk .v.pos{color:#6ee7b7}
.hk .v.neg{color:#fda4af}

/* ===== كروت عامة ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(11,17,23,.03)}
.section{display:flex;align-items:center;gap:9px;margin:20px 2px 10px}
.section h2{font-size:16.5px;margin:0;font-weight:800;letter-spacing:-.3px}
.section .count{font-size:11.5px;font-weight:800;color:var(--muted);background:#e9edf3;border-radius:999px;padding:2px 9px}
.section .spacer{margin-inline-start:auto}
h2{font-size:20px;margin:0 0 12px;font-weight:800;letter-spacing:-.4px}
h3{font-size:14px;margin:0 0 13px;font-weight:800;display:flex;align-items:center;gap:8px}

/* ===== بحث ===== */
.search{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:0 13px;height:46px;margin-bottom:12px;transition:.15s}
.search:focus-within{border-color:#a8cdc8;box-shadow:0 0 0 4px rgba(13,106,95,.08)}
.search svg{flex:none;color:var(--muted)}
.search input{border:none;background:transparent;height:100%;padding:0;font-size:15px;min-width:0}
.search input:focus{box-shadow:none;background:transparent;border:none}

/* ===== كروت العربيات ===== */
.trucks{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.tcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;overflow:hidden}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#d4dae3}
.tcard:active{transform:translateY(-1px)}
.tcard .tno{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.5px}
.tcard .tno span.ar{color:#c3ccd6;font-weight:700;font-size:15px}
.tcard .tsub{font-size:12px;color:var(--muted);margin-top:3px;min-height:17px;font-weight:700}
.tcard .tamt{font-size:16.5px;font-weight:800;margin-top:10px;font-variant-numeric:tabular-nums;direction:ltr;text-align:start;letter-spacing:-.2px}
.tcard .tfoot{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;min-height:20px}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:#f0f3f8;color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.pos{background:#effaf4;color:var(--pos)}
.chip.neg{background:#fdf2f3;color:var(--neg)}

/* ===== مدخلات ===== */
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.grid.g2{grid-template-columns:1fr 1fr}.grid.g3{grid-template-columns:repeat(3,1fr)}}
label{display:block;min-width:0}
label>span{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
input,select{width:100%;height:46px;padding:0 12px;font-size:15.5px;font-family:inherit;border:1px solid var(--line);border-radius:var(--r-sm);background:#fbfcfd;color:var(--ink);transition:.15s}
input:focus,select:focus{outline:none;border-color:#a8cdc8;background:#fff;box-shadow:0 0 0 4px rgba(13,106,95,.1)}
input::placeholder{color:#a9b2bd;font-weight:500}
input[type=number]{direction:ltr;text-align:start;font-variant-numeric:tabular-nums}
input[type=date]{padding-inline-end:6px}
input:disabled{opacity:.55}

/* ===== أزرار ===== */
.btn{height:44px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn:hover{background:#f7f9fb;border-color:#d7dde5}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink-2);border-color:var(--ink-2);color:#fff;box-shadow:0 1px 2px rgba(11,17,23,.2)}
.btn.primary:hover{background:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:#f0f3f8;color:var(--ink)}
.btn.danger{color:var(--neg);border-color:#f0d5d8;background:#fff}
.btn.danger:hover{background:#fdf2f3;border-color:#e6bec2}
.btn.sm{height:32px;padding:0 10px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ===== تبويبات ===== */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:2px 0 14px;padding:0 2px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:11px 14px;font-size:13.5px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:.15s}
.tabs a:hover{color:var(--ink)}
.tabs a.active{color:var(--ink);border-bottom-color:var(--accent)}

/* ===== جداول ===== */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:560px}
thead th{position:sticky;top:0;z-index:1;background:#f8fafc;color:var(--muted);font-weight:700;font-size:11.5px;text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover td{background:#fafcfd}
tbody tr:last-child td{border-bottom:none}
.num{font-variant-numeric:tabular-nums;direction:ltr;text-align:start;white-space:nowrap}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.zero{color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.empty{padding:34px 14px;text-align:center;color:var(--muted);font-size:13.5px}

/* ===== رصيد / إجماليات ===== */
.verdict{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:14px;margin-top:12px;background:#f5f7fa;border:1px solid var(--line)}
.verdict span:first-child{font-size:13px;font-weight:700;color:var(--muted)}
.verdict .big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;letter-spacing:-.5px}
.verdict.pos{background:#f0fbf5;border-color:#cfeee0}
.verdict.pos .big{color:var(--pos)}
.verdict.neg{background:#fdf2f3;border-color:#f6dade}
.verdict.neg .big{color:var(--neg)}

.sumline{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line);font-size:13.5px;color:var(--muted);font-weight:700}
.sumline b{font-variant-numeric:tabular-nums;color:var(--ink);direction:ltr;font-weight:800}
.items-head{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px}
.item{display:grid;grid-template-columns:1fr 128px 42px;gap:9px;margin-bottom:9px;align-items:center}
.item .del{height:46px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;color:#a9b2bd;font-size:15px;cursor:pointer;transition:.15s}
.item .del:hover{background:#fdf2f3;color:var(--neg);border-color:#f0d5d8}
.hint{background:var(--warn-soft);border:1px solid #f2e2c2;color:#7a4b00;border-radius:12px;padding:11px 14px;font-size:13px;margin-top:12px;font-weight:700}
.hr{height:1px;background:var(--line);margin:14px 0}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
@media(min-width:640px){.kpi{grid-template-columns:repeat(4,1fr)}}
.kpi>div{background:#f8fafc;border:1px solid var(--line-2);border-radius:12px;padding:11px 13px}
.kpi .k{font-size:11px;color:var(--muted);font-weight:700}
.kpi .v{font-size:18px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.savebar{position:sticky;bottom:0;z-index:5;background:linear-gradient(to top,#fff 62%,rgba(255,255,255,0));padding:12px 0 2px;margin-top:8px;display:flex;gap:9px;flex-wrap:wrap}
.savebar .btn{flex:1;min-width:150px}
.savebar .btn.ghost,.savebar .btn.danger{flex:0 0 auto;min-width:0}
.footlink{display:inline-block;margin:14px 2px 0;font-size:13px;color:var(--muted);font-weight:700}
.footlink:hover{color:var(--ink)}
.msg{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:86vw;z-index:80;background:var(--ink-2);color:#fff;border-radius:12px;padding:11px 18px;font-weight:700;font-size:13.5px;box-shadow:0 14px 34px rgba(11,17,23,.28)}
.msg.bad{background:var(--neg)}
@media print{.top,.nav,.savebar,.btn,.search,.section .spacer{display:none!important}body{background:#fff}.card{border:none;box-shadow:none;padding:0}}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="brand"><span class="dot">ن</span><div>حسابات التشغيل<span class="sub">محمد إسماعيل · نقل ومواد بناء</span></div></div>
    <nav class="nav">
      <a href="#/" id="nav-home">العربيات</a>
      <a href="#/trips" id="nav-trips">النقلات</a>
      <a href="#/drivers" id="nav-drivers">السواقين</a>
      <a href="#/backup" id="nav-backup">نسخة احتياطية</a>
    </nav>
  </div>
</div>

<div class="wrap" id="app"></div>

<script>
/* ============ الأساسيات ============ */
var KEY = 'naql.v1';        /* نفس مفتاح البيانات القديم — بياناتك القديمة هتظهر تلقائي */
var TAB = 'trips';
var MSG = '';
var DRAFT = {};
/* مفيش أي بيانات تجريبية — بس أرقام العربيات الحقيقية بتاعتك */
var MYTRUCKS = ['2428','4134','5358','6371','7158','7489','7594','8124','9274','9775'];
/* أرقام كانت بتتحط تلقائي كعينة في النسخة القديمة — لو المخزَّن هو بس العينة دي من غير أي حركة، يتشال */
var OLDSEED = ['372','374','384','395','401','402','404','428','439','440','441','445','446'];
function isOldSeedOnly(o){
  if (!Array.isArray(o.trucks) || o.trucks.length !== OLDSEED.length) return false;
  var nos = o.trucks.map(function(t){ return String(t.no); }).sort().join(',');
  if (nos !== OLDSEED.slice().sort().join(',')) return false;
  if (o.trucks.some(function(t){ return (t.driver || '').trim() !== ''; })) return false;
  var lists = ['trips','cards','maint','oil','settles'];
  for (var i = 0; i < lists.length; i++){
    if (Array.isArray(o[lists[i]]) && o[lists[i]].length) return false;
  }
  return true;
}

function num(v){ var x = Number(v); return isFinite(x) ? x : 0; }
function r2(x){ return Math.round(x * 100) / 100; }
function money(x){ return r2(Math.abs(x)).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
function sgn(x){ return x > 0 ? 'pos' : (x < 0 ? 'neg' : 'zero'); }
function today(){ var d = new Date(); return d.toISOString().slice(0,10); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dshort(d){ return d ? String(d).slice(5).replace('-','/') : '—'; }
function arDate(d){ try { return new Date(d).toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'}); } catch(e){ return d; } }

/* ============ التخزين ============ */
function blank(){
  var d = { trucks:[], trips:[], cards:[], maint:[], oil:[], settles:[] };
  for (var i = 0; i < MYTRUCKS.length; i++) d.trucks.push({ no: MYTRUCKS[i], driver: '' });
  return d;
}
function loadDB(){
  try{
    var raw = localStorage.getItem(KEY);
    if (raw){
      var o = JSON.parse(raw);
      if (o && isOldSeedOnly(o)){ localStorage.removeItem(KEY); return blank(); }
      if (o && Array.isArray(o.trucks)){
        var db = { trucks:o.trucks, trips:o.trips||[], cards:o.cards||[], maint:o.maint||[], oil:o.oil||[], settles:o.settles||[] };
        /* لو المخزَّن فاضي خالص، نبدأ بأرقام عربياتك */
        if (!db.trucks.length && !db.trips.length && !db.cards.length && !db.maint.length && !db.oil.length && !db.settles.length) return blank();
        return db;
      }
    }
  }catch(e){}
  return blank();
}
var DB = loadDB();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ MSG = 'المتصفح رفض الحفظ — صدّر نسخة احتياطية.'; } }

/* ============ الحسابات ============ */
function tripSpend(t){ return (t.items||[]).reduce(function(s,i){ return s + num(i.val); }, 0); }
function tripNet(t){ return r2(num(t.aada) - num(t.agr) - tripSpend(t)); }
function cardCalc(c){
  var v = r2(num(c.weight) * num(c.price));
  var ins = r2(v * 0.005);
  var q = r2(v - num(c.party));
  return { v:v, q:q, ins:ins, net:r2(q - ins) };
}
function truckOf(no){ return DB.trucks.filter(function(t){ return t.no === no; })[0] || { no:no, driver:'' }; }
function truckTrips(no){ return DB.trips.filter(function(t){ return t.truck === no; }); }
function truckCards(no){ return DB.cards.filter(function(c){ return c.truck === no; }); }
function truckMaint(no){ return DB.maint.filter(function(m){ return m.truck === no; }); }
function truckOil(no){ return DB.oil.filter(function(o){ return o.truck === no; }); }
function truckBalance(no){
  var c = truckCards(no).reduce(function(s,x){ return s + cardCalc(x).net; }, 0);
  var t = truckTrips(no).reduce(function(s,x){ return s + tripNet(x); }, 0);
  var m = truckMaint(no).reduce(function(s,x){ return s + num(x.cost); }, 0);
  var o = truckOil(no).reduce(function(s,x){ return s + num(x.cost); }, 0);
  return r2(c + t - m - o);
}
function driverNames(){
  var out = [];
  DB.trucks.forEach(function(t){ if (t.driver) out.push(t.driver.trim()); });
  DB.trips.forEach(function(t){ if (t.driver) out.push(t.driver.trim()); });
  DB.cards.forEach(function(c){ if (c.driver) out.push(c.driver.trim()); });
  return out.filter(function(v,i,a){ return v && a.indexOf(v) === i; });
}
/* أي حركة على عربية مسجّلة باسم السواق تتحسب له، حتى لو اتسجلت قبل تسميته */
function driverStatement(name){
  var nos = DB.trucks.filter(function(t){ return (t.driver||'').trim() === name; }).map(function(t){ return t.no; });
  var mine = DB.settles.filter(function(s){ return s.driver === name; }).sort(function(a,b){ return b.at - a.at; });
  var last = mine[0];
  var since = last ? num(last.at) : 0;
  function belongs(r){ return (r.driver||'').trim() === name || nos.indexOf(r.truck) > -1; }
  var cards = DB.cards.filter(function(c){ return belongs(c) && num(c.at) > since; });
  var trips = DB.trips.filter(function(t){ return belongs(t) && num(t.at) > since; });
  var cnet = cards.reduce(function(s,c){ return s + cardCalc(c).net; }, 0);
  var tnet = trips.reduce(function(s,t){ return s + tripNet(t); }, 0);
  var opening = last ? num(last.amount) : 0;
  return { last:last, opening:opening, cnet:r2(cnet), tnet:r2(tnet), fresh:r2(cnet+tnet), total:r2(opening+cnet+tnet), cards:cards, trips:trips };
}
function rawTrips(no){ return truckTrips(no).slice().sort(function(a,b){ return (b.date||'') < (a.date||'') ? -1 : 1; }); }
function nextTripNo(no){ return truckTrips(no).reduce(function(m,t){ return Math.max(m, num(t.tripNo)); }, 0) + 1; }

/* ============ التوجيه ============ */
function route(){ return (location.hash || '#/').replace(/^#/, '') || '/'; }
function go(p){ location.hash = p; }
var PENDING_TRIP = null;
window.addEventListener('hashchange', function(){
  MSG = ''; DRAFT = {}; TAB = 'trips';
  var pid = PENDING_TRIP; PENDING_TRIP = null;
  if (pid){
    var t = DB.trips.filter(function(x){ return x.id === pid; })[0];
    if (t){ DRAFT.trip = tripDraftOf(t); TAB = 'trips'; }
  }
  render();
});

function render(){
  var h = route();
  var el = document.getElementById('app');
  var html = '';
  var nav = '';
  if (h.indexOf('/truck/') === 0) html = viewTruck(decodeURIComponent(h.slice(7)));
  else if (h.indexOf('/driver/') === 0) html = viewDriver(decodeURIComponent(h.slice(8)));
  else if (h === '/trips'){ html = viewAllTrips(); nav = 'trips'; }
  else if (h === '/drivers'){ html = viewDrivers(); nav = 'drivers'; }
  else if (h === '/backup'){ html = viewBackup(); nav = 'backup'; }
  else { html = viewHome(); nav = 'home'; }
  el.innerHTML = (MSG ? '<div class="msg' + (MSG.indexOf('✓') > -1 ? '' : ' bad') + '">' + esc(MSG) + '</div>' : '') + html;
  var ids = { home:'nav-home', trips:'nav-trips', drivers:'nav-drivers', backup:'nav-backup' };
  for (var k in ids){ var n = document.getElementById(ids[k]); if (n) n.className = (nav === k ? 'on' : ''); }
  if (MSG){
    setTimeout(function(){
      var m = document.querySelector('.msg');

        m.style.opacity = '0';
        setTimeout(function(){ if (m.parentNode) m.parentNode.removeChild(m); }, 320);

function addTruck(){
  var el = document.getElementById('new-truck');
  var raw = (el.value || '').trim();
  if (!raw){ MSG = 'اكتب رقم العربية'; render(); return; }
  var parts = raw.split(/[^0-9]+/).filter(function(s){ return s !== ''; });
  if (!parts.length){ MSG = 'الرقم لازم يكون أرقام بس'; render(); return; }
  var added = 0, dup = 0;
  for (var i = 0; i < parts.length; i++){
    var no = parts[i];
    if (DB.trucks.some(function(t){ return t.no === no; })){ dup++; continue; }
    DB.trucks.push({ no:no, driver:'' }); added++;
  }
  DB.trucks.sort(function(a,b){ return Number(a.no) - Number(b.no); });
  save();
  MSG = added ? ('اتضافت ' + added + ' عربية ✓' + (dup ? ' — ' + dup + ' كانت موجودة' : '')) : 'الأرقام دي موجودة بالفعل';
  el.value = '';
  render();
}
function setDriver(no, v){
  DB.trucks = DB.trucks.map(function(t){ return t.no === no ? { no:t.no, driver:v.trim() } : t; });
  save(); MSG = 'اتحفظ اسم السواق ✓'; render();
}
function delTruck(no){
  if (!confirm('هتحذف العربية ' + no + ' وكل نقلاتها وبطاقاتها؟')) return;
  DB.trucks = DB.trucks.filter(function(t){ return t.no !== no; });
  DB.trips = DB.trips.filter(function(t){ return t.truck !== no; });
  DB.cards = DB.cards.filter(function(c){ return c.truck !== no; });
  DB.maint = DB.maint.filter(function(m){ return m.truck !== no; });
  DB.oil = DB.oil.filter(function(o){ return o.truck !== no; });
  save(); MSG = 'اتحذفت ✓'; go('#/'); render();
}

function recalcTrip(){
  var d = DRAFT.trip; if (!d) return;
  var sp = d.items.reduce(function(s,i){ return s + num(i.val); }, 0);
  var aada = num(d.aada), agr = num(d.agr), net = r2(aada - agr - sp);
  function set(id, v){ var e = document.getElementById(id); if (e) e.textContent = v; }
  set('s-spend', money(sp));
  set('s-left', money(aada - sp));
  set('s-net', money(net));
  set('s-verdict-t', net > 0 ? 'الصافي له — نكمّله' : net < 0 ? 'الصافي عليه — نخصم منه' : 'خالص');
  var v = document.getElementById('s-verdict');
  if (v) v.className = 'verdict ' + sgn(net);
}
function setTrip(f, v){ if (!DRAFT.trip) return; DRAFT.trip[f] = v; recalcTrip(); }
function setItem(i, f, v){ if (!DRAFT.trip) return; DRAFT.trip.items[i][f] = v; recalcTrip(); }

function delItem(i){
  DRAFT.trip.items.splice(i,1);

  document.getElementById('items').innerHTML = itemsHtml(DRAFT.trip); recalcTrip();
}
function saveTrip(no){
  var d = DRAFT.trip; if (!d) return;
  var sp = d.items.reduce(function(s,i){ return s + num(i.val); }, 0);
  if (!(sp > 0)){ MSG = 'اكتب بند منصرف واحد على الأقل'; render(); return; }
  var old = d.id ? DB.trips.filter(function(t){ return t.id === d.id; })[0] : null;
  var rec = {
    id: d.id || uid(), at: old ? old.at : Date.now(), truck:no, driver: truckOf(no).driver || '',
    tripNo: num(d.no), date: d.date || today(), from: d.from, to: d.to,
    aada: num(d.aada), agr: num(d.agr),
    items: d.items.filter(function(i){ return i.name || num(i.val); }).map(function(i){ return { name:i.name, val:num(i.val) }; })
  };
  if (old) DB.trips = DB.trips.map(function(t){ return t.id === rec.id ? rec : t; });
  else DB.trips.unshift(rec);
  save(); DRAFT.trip = null; MSG = old ? 'اتعدّلت ✓' : 'اتحفظت ✓'; render();
}
function tripDraftOf(t){

    aada: t.aada ? String(t.aada) : '', agr: t.agr ? String(t.agr) : '',
    items: (t.items || []).map(function(i){ return { name:i.name, val: i.val ? String(i.val) : '' }; }) };
  if (!d.items.length) d.items = [{ name:'', val:'' }];
  return d;

  var o = truckOil(no).reduce(function(s,x){ return s + num(x.cost); }, 0);

function download(name, text, type){
  var blob = new Blob([text], { type: type || 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
}
function exportJson(){ download('naql-backup-' + today() + '.json', JSON.stringify(DB, null, 2), 'application/json'); }
function importJson(input){
  var f = input.files && input.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var o = JSON.parse(String(r.result));
      if (!o || !Array.isArray(o.trucks)) throw new Error('bad');
      DB = { trucks:o.trucks, trips:o.trips||[], cards:o.cards||[], maint:o.maint||[], oil:o.oil||[], settles:o.settles||[] };
      save(); MSG = 'اتستوردت ✓'; render();
    }catch(e){ MSG = 'الملف مش صالح'; render(); }
  };
  r.readAsText(f);
}
function wipe(){
  if (!confirm('هتحذف كل العربيات والنقلات والبطاقات. متأكد؟')) return;
  DB = blank();
  save(); MSG = 'اتحذف الكل'; render();
}

function excelTruck(no){
  var t = truckOf(no), s = statementOf(no);
  var trips = rawTrips(no);
  var cards = truckCards(no).slice().sort(function(a,b){ return (a.date||'') < (b.date||'') ? -1 : 1; });
  var maint = truckMaint(no).slice().sort(function(a,b){ return (a.date||'') < (b.date||'') ? -1 : 1; });
  var oils = truckOil(no).slice().sort(function(a,b){ return num(a.km) - num(b.km); });

  function th(cells){
    return '<tr>' + cells.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>';
  }
  function tr(cells, cls){
    return '<tr' + (cls ? ' class="' + cls + '"' : '') + '>' + cells.map(function(c){ return '<td>' + (c === null || c === undefined ? '' : esc(c)) + '</td>'; }).join('') + '</tr>';
  }
  function title(txt, span){
    return '<tr class="title"><td colspan="' + span + '">' + esc(txt) + '</td></tr>';
  }

  var out = '';
  out += '<table>';
  out += title('حسابات عربية التشغيل', 7);
  out += tr(['رقم العربية', t.no, 'السواق', t.driver || '—', 'تاريخ التصدير', today(), '']);
  out += '<tr><td colspan="7"></td></tr>';

  /* الملخص */
  out += title('الملخص', 7);
  out += tr(['صافي بطاقات النقل', s.cards, 'صافي النقلات', s.trips, 'الصيانة', -s.maint, '']);
  out += tr(['إجمالي المنصرف', s.spend, 'غيارات الزيت', s.oil, 'رصيد العربية', s.bal, '']);
  out += '<tr><td colspan="7"></td></tr>';

  /* البطاقات */
  out += title('بطاقات النقل (' + cards.length + ')', 7);
  out += th(['التاريخ','الصنف','التحميل','التعتيق','الوزن (طن)','سعر الطن','الصافي']);
  cards.forEach(function(c){
    var k = cardCalc(c);
    out += tr([c.date, c.item || '', c.from || '', c.to || '', num(c.weight), num(c.price), k.net]);
  });
  out += tr(['الإجمالي','','','','','', r2(cards.reduce(function(a,c){ return a + cardCalc(c).net; },0))], 'tot');
  out += '<tr><td colspan="7"></td></tr>';

  /* النقلات */
  out += title('النقلات (' + trips.length + ')', 7);
  out += th(['نقلة','التاريخ','التحميل','التعتيق','العهدة','المنصرف','الصافي']);
  trips.forEach(function(x){
    out += tr([x.tripNo, x.date, x.from || '', x.to || '', num(x.aada), tripSpend(x), tripNet(x)]);
    (x.items || []).forEach(function(i){
      out += tr(['', '', '— ' + (i.name || 'بند'), '', '', num(i.val), '']);
    });
  });
  out += tr(['الإجمالي','','','', r2(trips.reduce(function(a,x){ return a + num(x.aada); },0)), r2(trips.reduce(function(a,x){ return a + tripSpend(x); },0)), r2(trips.reduce(function(a,x){ return a + tripNet(x); },0))], 'tot');
  out += '<tr><td colspan="7"></td></tr>';

  /* الصيانة */
  out += title('الصيانة (' + maint.length + ')', 7);
  out += th(['التاريخ','النوع','الكم','التكلفة','ملاحظة','','']);
  maint.forEach(function(m){
    out += tr([m.date, m.type || '', num(m.km), num(m.cost), m.note || '', '', '']);
  });
  out += tr(['الإجمالي','','', r2(maint.reduce(function(a,m){ return a + num(m.cost); },0)),'','',''], 'tot');
  out += '<tr><td colspan="7"></td></tr>';

  /* غيار الزيت */
  out += title('غيار الزيت (' + oils.length + ')', 7);
  out += th(['التاريخ','الكم','التكلفة','الغيار القادم','','','']);
  oils.forEach(function(o){
    out += tr([o.date, num(o.km), num(o.cost), num(o.nextKm) || '', '', '', '']);
  });
  out += tr(['الإجمالي','', r2(oils.reduce(function(a,o){ return a + num(o.cost); },0)),'','','',''], 'tot');
  out += '</table>';

  var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40" dir="rtl" lang="ar">' +
    '<head><meta charset="utf-8">' +
    '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>' +
    '<x:Name>عربية ' + esc(no) + '</x:Name>' +
    '<x:WorksheetOptions><x:DisplayRightToLeft/></x:WorksheetOptions>' +
    '</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->' +
    '<style>' +
    'body{font-family:Arial;font-size:11pt}' +
    'table{border-collapse:collapse}' +
    'td,th{border:1px solid #c9c9c9;padding:5px 8px;mso-number-format:"\\@";text-align:right;vertical-align:middle}' +
    'th{background:#111827;color:#ffffff;font-weight:bold}' +
    'tr.title td{background:#0f766e;color:#ffffff;font-weight:bold;font-size:12pt;border:1px solid #0f766e}' +
    'tr.tot td{background:#f1f5f9;font-weight:bold}' +
    '</style></head><body>' + out + '</body></html>';

  download('حسابات-عربية-' + no + '-' + today() + '.xls', '\ufeff' + html, 'application/vnd.ms-excel;charset=utf-8');
  MSG = 'اتصدّر ملف Excel للعربية ' + no + ' ✓';
  render();
}

      if (DRAFT.card) recalcCard();
