var articles=[
  {id:1,icon:'🚗',cat:'مرور',title:'إزاي تتجدد رخصة سيارتك؟',excerpt:'دليلك الكامل لتجديد رخصة السيارة في مصر — الخطوات والمستندات والمصاريف',readTime:'5 دقائق',content:`<h3>📋 الخطوات (أونلاين)</h3><p>1. سجّل الدخول على <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> واختار خدمة «مركباتي»</p><p>2. استعلم عن السيارة برقم اللوحة والشاسيه</p><p>3. دوس «تجديد» وسدد كل الرسوم والمخالفات إلكترونيًا</p><p>4. هيوصلك رسالة SMS بالتفعيل</p><p>5. الاستلام خلال 10 أيام عمل أو التوصيل للمنزل</p><h3>✅ شروط التجديد الإلكتروني</h3><p>• للسيارات الملاكية والدراجات النارية حتى 2030cc</p><p>• سداد كل الرسوم والمخالفات — وملصق إلكتروني</p><p>• مفيش حظر مروري ولا فحص فني مطلوب</p><h3>💰 الرسوم بالبنود</h3><p>كشف طبي 385ج + استمارة 115ج + ملف 65ج + نموذج 265 بـ45ج + طابع 15ج + شهادة مخالفات 120ج + ملصق 150ج + لوحات ~350ج + الضريبة حسب سعة المحرك من 225ج حتى 3000ج</p><p>إجمالي تجديد 3 سنين للسيارة الملاكية: 4000-6000 جنيه</p><h3>⏰ مهم!</h3><p>في مهلة سماح 30 يوم بعد انتهاء الرخصة — وفي وحدات مرور إلكترونية بالمولات بالحجز المسبق والدفع اللانقدي</p>`},
  {id:2,icon:'📊',cat:'ضرائب',title:'إزاي تسجل في الضريبة؟',excerpt:'خطوات التسجيل في المصلحة الضريبية وأهم المستندات المطلوبة',readTime:'7 دقائق',content:`<h3>📋 الخطوات</h3><p>1. التسجيل إلزامي خلال 30 يوم من بدء مزاولة النشاط أو الخضوع للقيمة المضافة (م.25 من قانون الإجراءات الضريبية الموحد 206/2020)</p><p>2. قدّم نموذج 1/2 تسجيل يدويًا أو إلكترونيًا من <a href=\"https://eta.gov.eg\" target=\"_blank\">eta.gov.eg</a> — النسخة الإلكترونية ليها حجية الإثبات</p><p>3. لو الطلب ناقص هتتخطر لتستوفيه خلال 15 يوم</p><p>4. استلم الرقم الضريبي والبطاقة الضريبية</p><h3>💰 الرسوم</h3><p>غير المكلفين تحت حد التسجيل: رسم سنوي بحد أقصى 500 جنيه (المحدد فعليًا 325 جنيه) وبيقف عند بلوغ الحد</p><h3>⏰ مهم!</h3><p>• صلاحية البطاقة الضريبية 5 سنين</p><p>• لو ما سجلتش، المأمورية ممكن تسجّلك من تلقاء نفسها وتخطورك خلال 5 أيام عمل — والتقصير مش بيسقط المسؤولية</p><h3>📞 القنوات والاستفسار</h3><p>المنظومة الإلكترونية والمكاتب الأمامية والمأمورية المختصة — الخط الساخن 16395</p>`},
  {id:3,icon:'🪪',cat:'أحوال مدنية',title:'إزاي تتجدد بطاقتك الشخصية؟',excerpt:'تجديد البطاقة الشخصية في 5 خطوات بسيطة',readTime:'4 دقائق',content:`<h3>📋 الخطوات</h3><p>1. التقدم أونلاين بالكامل من <a href=\"https://digigate.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> أو <a href=\"https://cso.moi.gov.eg\" target=\"_blank\">بوابة الأحوال المدنية</a></p><p>2. اكتب بياناتك وارفع المستندات المطلوبة</p><p>3. ادفع الرسوم: عادية 50ج (15 يوم) — عاجلة 125ج (3 أيام) — خاصة 175ج (24 ساعة) — VIP إكسبريس 515ج (30 دقيقة)</p><p>4. الاستلام بريد سريع للمنزل أو من السجل المدني</p><h3>📄 المستندات</h3><p>• البطاقة القديمة</p><p>• إثبات العنوان الجديد (لو غيرت سكنك)</p><p>• مستند من جهة العمل لو مر أكتر من 7 سنين على البطاقة السابقة (التقديم وقتها ورقيًا)</p><h3>⏰ إمتى لازم تتجدد؟</h3><p>البطاقة بتتجدد كل 7 سنين، أو لو غيرت عنوانك أو حالتك الاجتماعية</p><h3>💰 الغرامات</h3><p>• 100 جنيه لو اتعاملت ببطاقة منتهية أمام جهة رسمية</p><p>• 50 جنيه لو مجددتش بعد تغيير بياناتك</p><p>• 50 جنيه لو ما حدّثتش البيانات خلال 3 شهور من تغيرها</p>`},
  {id:4,icon:'🛂',cat:'جوازات',title:'إزاي تستخرج جواز السفر؟',excerpt:'دليلك الكامل لاستخراج جواز سفر مصري جديد',readTime:'6 دقائق',content:`<h3>📋 الخطوات</h3><p>1. قدّم طلبك من دليل خدمات الجوازات الإلكتروني <a href=\"https://enationality.moi.gov.eg\" target=\"_blank\">enationality.moi.gov.eg</a> أو احجز موعد من <a href=\"https://egpassport.gov.eg\" target=\"_blank\">egpassport.gov.eg</a> وروح لمكتب الجوازات</p><p>2. املا نموذج 29 جوازات (مجاني) وسجّل البيانات وخد البصمة</p><p>3. ادفع الرسوم</p><p>4. الاستلام: عادي 3-15 يوم عمل — مستعجل 48 ساعة — عاجل نفس اليوم</p><h3>💰 الرسوم (قرار وزير الداخلية 1104/2025 من 1/7/2025)</h3><p>• الرسم الأساسي 500 جنيه</p><p>• الإجمالي الفعلي: عادي ~1200-1400 جنيه — مستعجل ~1725 جنيه — VIP ~2950 جنيه</p><p>• بدل فاقد/تالف ~1510 جنيه (رسم أساسي مضاعف 1000 جنيه)</p><h3>📄 المستندات (فوق 16 سنة)</h3><p>• بطاقة الرقم القومي سارية</p><p>• 4 صور 4×6 بخلفية بيضاء</p><p>• موقف التجنيد للذكور</p><p>• وثيقة الزواج أو الطلاق للإناث</p><p>• قيد دراسي للطلاب</p><h3>🧸 للأطفال دون 16 سنة</h3><p>شهادة ميلاد مميكنة + جوازا الوالدين + قيد عقد الزواج + حضور أحد الوالدين</p><h3>⏰ صلاحية الجواز</h3><p>7 سنين — ومفيش مرافقين بيتضافوا عليه</p>`},
  {id:5,icon:'📋',cat:'أحوال مدنية',title:'إزاي تطلب شهادة ميلاد؟',excerpt:'استخراج شهادة ميلاد لنفسك أو لأطفالك',readTime:'3 دقائق',content:`<h3>📋 الخطوات</h3><p>1. من مكتب السجل المدني: اكتب نموذج 40 (طلب صورة وثيقة رسمية)</p><p>2. أو أونلاين من <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> (شرط: يوجد شهادة مميكنة مطبوعة سابقًا)</p><p>3. أو من الماكينات الذكية (العباسية، مطار القاهرة، شرم الشيخ، الغردقة) ومكاتب البريد</p><p>4. الاستلام: من السجل نفس اليوم، أو بالبريد خلال 3-10 أيام عمل</p><h3>💰 الرسوم الرسمية</h3><p>• أول مرة (مميكنة): 45 جنيه — نسخة مكررة: 25 جنيه</p><p>• ماكينة ذكية: 50 جنيه</p><p>• البريد: 55 جنيه (استلام من المكتب) / 65 جنيه (توصيل للمنزل)</p><p>• أونلاين: 65 جنيه أول مرة + 60 جنيه لكل نسخة إضافية</p><h3>📄 المستندات</h3><p>• الرقم القومي لصاحب الشأن أو للمولود</p><p>• بطاقة رقم قومي سارية لمقدم الطلب</p><h3>👥 مين له يطلبها؟</h3><p>صاحب الشأن، الأب، الأم، الأخ/الأخت، الزوج/الزوجة، الأبناء، الجد/الجدة، العم، الخال</p><h3>⏰ قيد المواليد</h3><p>سجّل المولود خلال 15 يوم من الولادة في مكتب الصحة — والمواليد في الخارج خلال 3 شهور من القنصلية المصرية</p>`},
  {id:6,icon:'🛂',cat:'جوازات',title:'إزاي تتجدد جواز السفر؟',excerpt:'تجديد الجواز قبل انتهاءه — الخطوات والمستندات',readTime:'5 دقائق',content:`<h3>📋 الخطوات</h3><p>1. التقديم من دليل خدمات الجوازات الإلكتروني <a href=\"https://enationality.moi.gov.eg\" target=\"_blank\">enationality.moi.gov.eg</a> أو حجز موعد من <a href=\"https://egpassport.gov.eg\" target=\"_blank\">egpassport.gov.eg</a></p><p>2. روح لمكتب الجوازات في الموعد وسلّم الجواز القديم</p><p>3. املا نموذج 29 جوازات (مجاني) وسجّل البيانات الجديدة</p><p>4. ادفع الرسوم: الرسم الأساسي 500 جنيه — الإجمالي الفعلي: عادي ~1200-1400 جنيه / مستعجل ~1725 جنيه</p><p>5. الاستلام: عادي 3-15 يوم عمل — مستعجل 48 ساعة — عاجل نفس اليوم</p><h3>📄 المستندات</h3><p>• الجواز القديم</p><p>• بطاقة الرقم القومي سارية</p><p>• 4 صور 4×6 بخلفية بيضاء</p><p>• موقف التجنيد للذكور — ووثيقة الزواج/الطلاق للإناث</p><h3>⏰ مهم!</h3><p>• الجواز صلاحيته 7 سنين</p><p>• لو البطاقة منتهية: فيه جواز مؤقت صلاحيته 3 سنين</p><h3>🌍 من الخارج</h3><p>التجديد عبر القنصليات المصرية والمدة أطول (6-8 أسابيع)</p>`},
  {id:7,icon:'👴',cat:'تأمينات',title:'إزاي تطلع المعاش؟',excerpt:'دليلك لاستخراج معاش التأمينات الاجتماعية',readTime:'8 دقائق',content:`<h3>📋 الخطوات</h3><p>1. قدّم طلب الصرف من محطة الصرف التابعة لسكنك (مكتب البريد أو البنك حسب المحافظة)</p><p>2. اطلع إخطار استحقاق المعاش من الهيئة القومية للتأمين الاجتماعي بعد مراجعة مدد الاشتراك</p><p>3. سجّل عنوانك ورقم موبايلك للتوصيل الإلكتروني أو الدفع بالماكينة</p><h3>⏰ المواعيد</h3><p>• سن المعاش القانوني بالقانون 148/2019</p><p>• المعاش المبكر من سن 55 بخصم 4.5% لكل سنة نقص ومؤهل بعد 300 شهر اشتراك</p><p>• أقصى أجر اشتراك 14,500 جنيه شهريًا</p><h3>💡 نصيحة</h3><p>• استعلام الموقف التأميني أونلاين من <a href=\"https://www.si.gov.eg\" target=\"_blank\">si.gov.eg</a> أو الخط الساخن 16163</p><p>• المعاش بيتصرف من أول الشهر التالي لاستحقاقه</p>`},
  {id:8,icon:'🤱',cat:'أحوال مدنية',title:'إزاي تسجّل مولود جديد؟',excerpt:'خطوات تسجيل المواليد الجدد واستخراج شهادة الميلاد',readTime:'4 دقائق',content:`<h3>📋 الخطوات</h3><p>1. خد إخطار الولادة من المستشفى أو الطبيب</p><p>2. بلّغ عن المولود لمكتب الصحة خلال 15 يوم من الولادة</p><p>3. قيّد المولود في السجل المدني واستلم شهادة الميلاد المميكنة (أول مرة 45 جنيه)</p><p>4. النسخ الإضافية: نموذج 40 من السجل المدني (مكررة 25 جنيه) أو أونلاين من <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> (65 جنيه أول مرة + 60 جنيه لكل نسخة إضافية)</p><h3>📄 المستندات</h3><p>• إخطار الولادة من المستشفى/مكتب الصحة</p><p>• بطاقة الرقم القومي للأب والأم</p><p>• عقد الزواج</p><h3>⏰ مهم!</h3><p>• التبليغ خلال 15 يوم من الولادة (مكتب الصحة)</p><p>• المواليد في الخارج: التسجيل خلال 3 شهور من القنصلية المصرية</p>`},
  {id:9,icon:'🏥',cat:'تأمين صحي',title:'إزاي تسجّل في التأمين الصحي؟',excerpt:'التسجيل في التأمين الصحي للموظفين والعائلة',readTime:'5 دقائق',content:`<h3>📋 الخطوات</h3><p>1. سجّل بيانات أسرتك التأمينية أونلاين من <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> — اختار المحافظة حسب البطاقة واحفظ</p><p>2. بعد 48 ساعة روح لوحدة الرعاية الأولية لسداد الاشتراك واستلام الكارت برقم الملف العائلي</p><p>3. اعمل الفحص المبدئي وافتح الملف العائلي</p><h3>👥 مين بيسجل إزاي؟</h3><p>• غير الخاضعين للتأمينات: من مكتب خدمة العملاء لبيانات الدخل والسداد الذاتي</p><p>• الغير قادرين: الدولة بتسدد عنهم</p><h3>📍 المحافظات المتاحة</h3><p>• المرحلة الأولى: بورسعيد، الأقصر، الإسماعيلية، جنوب سيناء، السويس، أسوان</p><p>• المرحلة الثانية: دمياط، كفر الشيخ، المنيا، مطروح، شمال سيناء</p><h3>💡 المميزات</h3><p>تغطية من الولادة للوفاة + مساهمات رمزية على الأدوية والأشعة والتحاليل (والمعفيون منها: الغير قادرين وأصحاب الأمراض المزمنة والأورام)</p><h3>🔄 خدمات تانية</h3><p>• إضافة مولود: شهادة ميلاد مميكنة + أصل كارت الأسرة</p><p>• النقل بين المحافظات: إفادة إغلاق الملف السابق</p>`},
  {id:10,icon:'💼',cat:'شركات',title:'إزاي تفتح مشروعك الخاص؟',excerpt:'خطوات تسجيل مشروع صغير أو متوسط في مصر',readTime:'7 دقائق',content:`<h3>📋 الخطوات</h3><p>1. اختار شكل المشروع (شركة أشخاص أو أموال أو مكتب/منشأة فردية)</p><p>2. حجز الاسم وإعداد عقد التأسيس والموافقات الأمنية والبنكية (تقديم إلكتروني بالكامل عبر <a href=\"https://www.gafi.gov.eg\" target=\"_blank\">gafi.gov.eg</a>)</p><p>3. سجل الشركة في السجل التجاري واستخرج البطاقة الضريبية</p><h3>💰 التكاليف</h3><p>رسوم التأسيس والسجل التجاري حسب شكل الشركة ونشاطها</p><h3>⏰ مهم!</h3><p>• تأسيس الشركات تقديمه إلكتروني بالكامل عبر بوابة جهاز الاستثمار (GAFI)</p><p>• الموافقات المسبقة لبعض الأنشطة (استيراد/تصدير/صحة) قبل التسجيل</p>`},
  {id:11,icon:'📄',cat:'أحوال مدنية',title:'إزاي تستخرج صحيفة حالة جنائية؟',excerpt:'دليلك لاستخراج صحيفة الحالة الجنائية أونلاين',readTime:'4 دقائق',content:`<h3>📋 الخطوات</h3><p>1. ادخل على <a href="https://ecriminal.gov.eg" target="_blank">ecriminal.gov.eg</a></p><p>2. سجّل حساب جديد بالرقم القومي</p><p>3. اختار "طلب صحيفة حالة"</p><p>4. ادفع الرسوم (75 جنيه للعادي، 100-150 جنيه للمستعجل)</p><p>5. استلم الصحيفة إلكترونياً خلال 24-72 ساعة (المستعجل) أو 4-5 أيام (العادي)</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي</p><p>• رقم تليفون للتواصل</p><h3>💰 المصاريف</h3><p>عادي: 75 جنيه (4-5 أيام) | مستعجل: 100-150 جنيه (24-72 ساعة) | أونلاين: 50 جنيه + توصيل 40-60 جنيه | مدة الصلاحية: 3 شهور</p><h3>💡 نصيحة</h3><p>الصحيفة بتستلم للمسافرين والشركات وأي مصلحة تطلبها</p>`},
  {id:12,icon:'🏠',cat:'أحوال مدنية',title:'إزاي تنقل قيدك لمحافظة تانية؟',excerpt:'نقل القيد السكاني بين المحافظات — الخطوات والمستندات',readTime:'5 دقائق',content:`<h3>📋 الخطوات</h3><p>1. روح لمكتب الأحوال المدنية في المحافظة الجديدة</p><p>2. اكتب استمارة نقل القيد</p><p>3. قدّم المستندات المطلوبة</p><p>4. استلم البطاقة الجديدة بعنوانك الجديد</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي القديمة</p><p>• عقد ملكية أو إيجار مسجل للمقر الجديد</p><p>• فاتورة كهرباء أو غاز باسمك على العنوان الجديد</p><h3>⏰ المدة</h3><p>نقل القيد بياخد من 7 لـ 15 يوم</p>`},
  {id:13,icon:'🚙',cat:'مرور',title:'إزاي تستخرج رخصة قيادة جديدة؟',excerpt:'دليل شامل لاستخراج رخصة قيادة لأول مرة',readTime:'8 دقائق',content:`<h3>📋 الخطوات</h3><p>1. افتح ملف رخصة القيادة في وحدة المرور</p><p>2. اعمل الكشف الطبي (نظر وباطنة وفصيلة الدم) وتحليل المخدرات من جهة معتمدة</p><p>3. عدّي الاختبار النظري للإشارات</p><p>4. عدّي الاختبار العملي</p><p>5. سدد الرسوم — والاستلام خلال 10-14 يوم عمل</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي</p><p>• المؤهل الدراسي أو إفادة القيد</p><p>• 4 صور 4×6</p><p>• نموذج 256</p><p>• شهادة طبية (نظر/باطنة/فصيلة دم)</p><p>• تحليل مخدرات معتمد</p><h3>💰 التكلفة</h3><p>1140-1500 جنيه إجمالية</p><h3>⏰ السن والصلاحية</h3><p>• الرخصة الخاصة: من 18 سنة — صلاحيتها 10 سنين</p><p>• الرخصة المهنية: من 21 سنة — بصلاحية أقصر</p>`},
  {id:14,icon:'⚖️',cat:'شهر عقاري',title:'إزاي تسجّل عقد في الشهر العقاري؟',excerpt:'توثيق العقود في الشهر العقاري — دليل كامل',readTime:'6 دقائق',content:`<h3>📋 إيه اللي بيسجل عندك؟</h3><p>• عقد بيع عقار: الرسم الأساسي من 500 جنيه (حتى 3900 جنيه لمساحة أقل من 300م) — المدة القصوى 37 يوم — ورسالة SMS بموقف الطلب خلال 24 ساعة</p><p>• رهن عقاري: لا ينعقد الرهن الرسمي إلا بورقة رسمية + القيد بالمأمورية المختصة + الرسوم على قيمة الدين — وفك الرهن بمخالصة موثقة</p><p>• عقد إيجار: رسوم 20 جنيه + رسم نسبي 0.5% (بحد أدنى 10 جنيه) — والتوثيق خلال 24 ساعة</p><h3>📄 المستندات</h3><p>• عقد البيع: رفع مساحي معتمد + رخصة + سند الملكية</p><p>• عقد الإيجار: أصل العقد + بطاقتان ساريتان + حضور الطرفين</p><h3>💡 نصيحة</h3><p>• حجز المعاد للتوثيق متاح عبر <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a></p><p>• في سيارة توثيق متنقلة بـ500 جنيه على الرقم 01555559875</p>`},
  {id:15,icon:'📱',cat:'خدمات عامة',title:'إزاي تسجّل في منصة مصر الرقمية؟',excerpt:'البوابة الوطنية للخدمات الحكومية — دليل التسجيل الكامل',readTime:'5 دقائق',content:`<h3>📋 الخطوات</h3><p>1. ادخل على <a href="https://digital.gov.eg" target="_blank">digital.gov.eg</a></p><p>2. دوس "إنشاء حساب جديد"</p><p>3. اكتب الرقم القومي وبياناتك</p><p>4. تأكّد من رقم موبايلك بكود OTP</p><p>5. خلّص كلمة السر وادخل على حسابك</p><h3>📄 الخدمات المتاحة</h3><p>• تجديد رخصة سيارة</p><p>• استخراج شهادة ميلاد</p><p>• صحيفة حالة جنائية</p><p>• خدمات الضرائب</p><p>• خدمات التأمينات</p><h3>💡 نصيحة</h3><p>منصة مصر الرقمية بتوفرلك كل الخدمات الحكومية في مكان واحد — توفّر وقتك وجهدك</p>`},
  {id:16,icon:'🔁',cat:'أحوال مدنية',title:'إزاي تطلب بدل فاقد لبطاقتك؟',excerpt:'استخراج بدل فاقد لبطاقة الرقم القومي المفقودة أو التالفة',readTime:'4 دقائق',content:`<h3>📋 الخطوات</h3><p>1. حرّر محضر فقد من قسم الشرطة أولاً (البطاقة التالفة مش محتاجة محضر)</p><p>2. قدّم طلب بدل فاقد/تالف أونلاين من <a href=\"https://digigate.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> أو حضوريًا من السجل المدني</p><p>3. ادفع الرسوم — نفس فئات الاستمارات: عادية 50ج (15 يوم) — عاجلة 125ج (3 أيام) — خاصة 175ج (24 ساعة) — VIP إكسبريس 515ج (30 دقيقة)</p><p>4. الاستلام من السجل أو بالبريد السريع</p><h3>📄 المستندات</h3><p>• محضر الفقد من قسم الشرطة</p><p>• البطاقة التالفة (في حالة التلف)</p><p>• صورة شخصية حديثة</p><h3>⏰ مهم!</h3><p>غرامة 50 جنيه لو اتأخرت أكتر من 15 يوم من تاريخ المحضر</p><h3>💡 نصيحة</h3><p>لو سرقولك البطاقة، المحضر بيساعدك تتجنب أي مسؤولية عن إساءة استخدامها</p>`},
  {id:17,icon:'🕊️',cat:'أحوال مدنية',title:'إزاي تستخرج شهادة وفاة؟',excerpt:'استخراج شهادة وفاة لأي قريب — الخطوات والمستندات',readTime:'3 دقائق',content:`<h3>📋 الخطوات</h3><p>1. بلّغ عن الوفاة خلال 24 ساعة لمكتب الصحة + استلم تصريح الدفن</p><p>2. الشهادة الأولى بتستلم من مكتب الصحة فقط</p><p>3. النسخ المميكنة (نموذج 40) من السجل المدني بـ25 جنيه</p><p>4. أو أونلاين من <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> (شرط: شهادة مميكنة مطبوعة سابقًا + قريب درجة أولى)</p><h3>📄 المستندات</h3><p>• تصريح الدفن من المستشفى أو مكتب الصحة</p><p>• بطاقة الرقم القومي للمتوفي (لو متاحة)</p><p>• بطاقة الرقم القومي لمقدم الطلب (قريب درجة أولى)</p><h3>💰 الرسوم</h3><p>الشهادة المميكنة: 25 جنيه</p><h3>⏰ مهم!</h3><p>التبليغ خلال 24 ساعة — والشهادة المترجمة للاستخدام في الخارج بتاخد 3-5 أيام عمل</p>`},
  {id:18,icon:'💍',cat:'أحوال مدنية',title:'إزاي تسجّل عقد زواج؟',excerpt:'توثيق عقد الزواج في مصر — الخطوات الكاملة',readTime:'5 دقائق',content:`<h3>📋 الخطوات</h3><p>1. روح لمكتب توثيق الزواج (المأذون) — الزوجين حاضرين شخصيًا مع شاهدين</p><p>2. اكتب عقد الزواج ووقّع الطرفان والشهود</p><p>3. ادفع الرسوم (600 جنيه + نسبة من المؤخر لو موجود)</p><p>4. استلم وثيقة الزواج الرسمية</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي للزوجين</p><p>• شهادة ميلاد الزوجين</p><p>• شهادة الطب الشرعي (لكلا الطرفين)</p><p>• شاهدان ذكران</p><h3>💰 المصاريف</h3><p>بدون مؤخر: 600 جنيه | مؤخر أقل من 5000: 600 + 3% | أقل من 10000: 600 + 4% | أكبر: 600 + 5% | طلاق حضوري/مراجعة: 600 | طلاق غيابي: 800</p><h3>📤 عايز نسخة من وثيقة قديمة؟</h3><p>قسيمة الزواج الإلكترونية 70 جنيه (تصدر خلال 7 أيام عمل) — أو من السجل المدني نفس اليوم/24 ساعة — متاح لمن أُطبعت وثيقته بعد أبريل 1962</p>`},
  {id:19,icon:'🚗',cat:'مرور',title:'إزاي تنقل ملكية سيارة؟',excerpt:'نقل ملكية سيارة بين الأفراد — دليل كامل',readTime:'6 دقائق',content:`<h3>📋 الخطوات</h3><p>1. اتفق مع المشتري على السعر واطلب شهادة بيانات السيارة (فحص فني + حصر مخالفات من وحدة المرور)</p><p>2. امضوا عقد البيع وإقرار البيع من وحدة المرور</p><p>3. سدد رسوم النقل (فحص فني + نموذج 24 + إقرار بيع + لجان فحص إن وجدت)</p><p>4. استخرج رخصة جديدة باسم المشتري ولوحات جديدة</p><h3>💰 الرسوم</h3><p>• رسوم الفحص الفني ونموذج 24 حسب نوع السيارة</p><p>• لوحات معدنية جديدة ~350 جنيه</p><h3>⏰ مهم!</h3><p>• النقل لازم يتم في وحدة المرور المختصة قبل تحرير أي مخالفات</p><p>• المطلوب: البطاقتان + شهادة بيانات السيارة + شهادة المخالفات + عقد البيع وإقرار البيع</p>`},
  {id:20,icon:'🏪',cat:'شركات',title:'إزاي تستخرج رخصة تجارية؟',excerpt:'استخراج رخصة مزاولة نشاط تجاري في مصر',readTime:'6 دقائق',content:`<h3>📋 الخطوات</h3><p>1. استخرج السجل التجاري من gafinet.com</p><p>2. سجّل في الغرفة التجارية المختصة</p><p>3. قدّم طلب رخصة تجارية للمحافظة</p><p>4. دفع الرسوم (حسب النشاط)</p><p>5. استلم الرخصة التجارية</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي</p><p>• السجل التجاري</p><p>• البطاقة الضريبية</p><p>• عقد إيجار أو ملكية المقر</p><p>• شهادة من الغرفة التجارية</p><h3>💰 الرسوم</h3><p>تختلف حسب نوع النشاط: 200-2000 جنيه</p><h3>💡 نصيحة</h3><p>قبل ما تفتح المحل، اتأكد إن عندك كل التراخيص: صحة، دفاع مدني، بيئة</p>`},
  {id:21,icon:'🌍',cat:'جوازات',title:'إزاي تطلع إقامة لأجنبي؟',excerpt:'استخراج إقامة لغير المصريين في مصر — دليل كامل',readTime:'7 دقائق',content:`<h3>📋 الخطوات</h3><p>1. روح لمصلحة وثائق السفر والجنسية والإقامة</p><p>2. اكتب طلب الإقامة واذكر السبب (عمل، دراسة، استثمار)</p><p>3. قدّم المستندات المطلوبة</p><p>4. ادفع الرسوم</p><p>5. استلم بطاقة الإقامة</p><h3>📄 المستندات</h3><p>• جواز سفر ساري</p><p>• تأشيرة دخول سارية</p><p>• سبب الإقامة (عقد عمل، قبول جامعي، استثمار)</p><p>• شهادة صحية</p><p>• إيصال سكن</p><h3>💰 الرسوم</h3><p>عادية: 155 جنيه | مستعجلة: 375 جنيه | سياحية: ~6875 جنيه | زوجية: 1500-7000 جنيه | غرامة تأخير: 1500-6000 جنيه | الرسوم بالدولار أو ما يعادله</p><h3>⏰ المدة</h3><p>الإقامة بتتجدد سنوياً، تقدر تطلبها 1-5 سنين</p>`},
  {id:22,icon:'🎓',cat:'نقابات',title:'إزاي تسجّل في نقابتك؟',excerpt:'التسجيل في النقابة المهنية للمهندسين والأطباء والمحامين',readTime:'5 دقائق',content:`<h3>📋 الخطوات</h3><p>1. حدد نقابتك (مهندسين، أطباء، محامين، تجاريين...)</p><p>2. روح لمقر النقابة في محافظتك</p><p>3. اكتب طلب التسجيل وادفع الرسوم</p><p>4. قدّم شهادة التخرج والوثائق</p><p>5. استلم كارت النقابة</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي</p><p>• شهادة التخرج (أصل + صورة)</p><p>• شهادة الموقف من التجنيد (للذكور)</p><p>• 4 صور شخصية</p><p>• رسم تخريج من النقابة</p><h3>💰 الرسوم</h3><p>تختلف حسب النقابة: 200-1000 جنيه للاشتراك السنوي</p><h3>💡 نصيحة</h3><p>سجّل في النقابة بعد التخرج مباشرة عشان تتجنب غرامة التأخير</p>`},
  {id:23,icon:'🏗️',cat:'مباني',title:'إزاي تطلب تصريح بناء؟',excerpt:'استخراج ترخيص بناء من الحي أو المدينة',readTime:'8 دقائق',content:`<h3>📋 الخطوات</h3><p>1. جهّز المخططات الهندسية مع مهندس استشاري</p><p>2. روح لإدارة المرور العمراني في حيك</p><p>3. اكتب طلب ترخيص بناء</p><p>4. قدّم المستندات المطلوبة</p><p>5. ادفع الرسوم واحصل على الترخيص</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي</p><p>• وثيقة ملكية الأرض</p><p>• المخططات الهندسية (من مهندس استشاري)</p><p>• شهادة من الحي بعدم مخالفة الخط التنظيمي</p><p>• تقرير جودة التربة</p><h3>💰 الرسوم</h3><p>تتراوح بين 500-5000 جنيه حسب مساحة المبنى ونوعه</p><h3>⏰ المدة</h3><p>الترخيص بياخد من 30-60 يوم من تقديم الطلب</p>`},
  {id:24,icon:'💰',cat:'ضرائب',title:'إزاي تطلع كشف حساب ضريبي؟',excerpt:'استخراج كشف حساب ضريبي للشركات والأفراد',readTime:'5 دقائق',content:`<h3>📋 الخطوات</h3><p>1. ادخل على <a href="https://eta.gov.eg" target="_blank">eta.gov.eg</a></p><p>2. سجّل دخول بحسابك الضريبي</p><p>3. اختار "كشف حساب"</p><p>4. حدد الفترة الزمنية المطلوبة</p><p>5. حمّل الكشف أو استلمه من المأمورية</p><h3>📄 المستندات</h3><p>• رقم التسجيل الضريبي</p><p>• بطاقة الرقم القومي</p><p>• تفويض (لو الوكيل)</p><h3>💡 نصيحة</h3><p>كشف الحساب مهم لمعرفة الموقف الضريبي وتجنب الغرامات</p>`},
  {id:25,icon:'🏭',cat:'شركات',title:'إزاي تسجّل في صندوق تنمية الصناعة؟',excerpt:'التسجيل في صندوق تنمية الصناعة للمصانع والمشاريع الصناعية',readTime:'6 دقائق',content:`<h3>📋 الخطوات</h3><p>1. روح لمقر صندوق تنمية الصناعة (أو الموقع الإلكتروني)</p><p>2. اكتب طلب تسجيل المشروع</p><p>3. قدّم المستندات المطلوبة</p><p>4. ادفع رسوم التسجيل</p><p>5. استلم شهادة التسجيل</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي</p><p>• السجل التجاري</p><p>• البطاقة الضريبية</p><p>• رخصة تشغيل المصنع</p><p>• دراسة جدوى المشروع</p><h3>💰 الفوائد</h3><p>الدعم المالي: قروض ميسرة بفائدة منخفضة</p><p>الإعفاءات الضريبية للمشاريع الصناعية الجديدة</p><h3>💡 نصيحة</h3><p>صندوق تنمية الصناعة بيدعم المشاريع الصناعية بقروض و إعفاءات ضريبية</p>`},
  {id:26,icon:'🤵',cat:'أحوال مدنية',title:'إزاي تطلب شهادة عدم زواج؟',excerpt:'استخراج شهادة إثبات الحالة الاجتماعية للزواج أو السفر',readTime:'3 دقائق',content:`<h3>📋 الخطوات</h3><p>1. ادخل على <a href="https://www.civilregistry.gov.eg" target="_blank">civilregistry.gov.eg</a> أو روح لمكتب الأحوال المدنية</p><p>2. اكتب طلب شهادة إثبات حالة (عدم زواج)</p><p>3. ادفع الرسوم (40-65 جنيه مميكن)</p><p>4. استلم الشهادة في نفس اليوم</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي</p><h3>💡 نصيحة</h3><p>الشهادة دي بتتطلب للزواج أو السفر أو لأي مصلحة تطلب إثبات الحالة الاجتماعية</p>`},
  {id:27,icon:'🎒',cat:'تعليم',title:'إزاي تسجّل طفل في مدرسة حكومية؟',excerpt:'تسجيل الأطفال في المدارس الحكومية — دليل كامل',readTime:'5 دقائق',content:`<h3>📋 الخطوات</h3><p>1. التقديم من نظام EMIS (نظام إدارة المعلومات التعليمية) عبر <a href=\"https://emis.gov.eg\" target=\"_blank\">emis.gov.eg</a> برقم قومي للطفل وللوالد</p><p>2. اختار المدرسة الحكومية حسب عنوان الإقامة الرسمي</p><p>3. ارفع المستندات إلكترونيًا أو سلّمها بالمدرسة</p><p>4. متابعة القبول من النظام</p><h3>📄 المستندات</h3><p>• شهادة ميلاد الطفل (رقم قومي)</p><p>• بطاقة الرقم القومي للوالد/الولي</p><p>• إثبات عنوان سكن (فاتورة مرافق أو عقد إيجار)</p><p>• 4 صور شخصية</p><h3>⏰ مهم!</h3><p>التقديم الإلزامي أونلاين لنقل وطلاب الصف الأول عبر نظام EMIS — والتقديم مجاني في المدارس الحكومية</p>`},
  {id:28,icon:'🏍️',cat:'مرور',title:'إزاي تستخرج رخصة تسيكل؟',excerpt:'استخراج رخصة قيادة موتوسيكل لأول مرة',readTime:'6 دقائق',content:`<h3>📋 الخطوات</h3><p>1. روح لوحدة المرور التابعة لسكناك</p><p>2. اكتب استمارة استخراج رخصة تسيكل</p><p>3. قدّم الفحص النظري والعملي</p><p>4. ادفع الرسوم</p><p>5. استلم الرخصة</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي</p><p>• 4 صور شخصية</p><p>• شهادة طبية</p><p>• إقرار بسياقة تسيكل من مدرسة معتمدة (لو مطلوب)</p><h3>💰 الرسوم</h3><p>الرخصة العادية: 60 جنيه | المستعجلة: 100 جنيه</p><h3>💡 نصيحة</h3><p>اتأكد إن عندك التأمين الإجباري على التسيكل قبل ما تسوق</p>`},
  {id:29,icon:'🏦',cat:'بريد',title:'إزاي تفتح حساب توفير بريدي؟',excerpt:'فتح حساب توفير في البريد المصري — دليل كامل',readTime:'4 دقائق',content:`<h3>📋 الخطوات</h3><p>1. اختار نوع الحساب (توفير بريد مصر أو شهادات ادخارية) وروح لأقرب فرع بريد</p><p>2. املا نموذج فتح الحساب وسلّم صورة بطاقة الرقم القومي</p><p>3. ايدع المبلغ الأولانيات (حسب نوع الحساب)</p><h3>💰 المزايا</h3><p>• توفير يومي وصرف من أي فرع بريد على مستوى الجمهورية</p><p>• الشهادات الادخارية متاحة للأفراد والقاصرين برأس مال صغير</p><p>• استرداد الشهادات في أي وقت من أي مكتب بريد</p><h3>⏰ مهم!</h3><p>• الحساب بيقبل الإيداع والصرف من أي فرع بريد على مستوى الجمهورية</p><p>• فيه أنواع مختلفة من الشهادات حسب مدة العائد ورأس المال</p>`},
  {id:30,icon:'💵',cat:'شركات',title:'إزاي تطلب قرض من جهاز تنمية المشروعات؟',excerpt:'الحصول على قرض ميسر للمشاريع الصغيرة و المتوسطة',readTime:'7 دقائق',content:`<h3>📋 الخطوات</h3><p>1. ادخل على موقع <a href="https://msme.gov.eg" target="_blank">جهاز تنمية المشروعات</a></p><p>2. اختار "طلب قرض"</p><p>3. اكتب بيانات المشروع و دراسة الجدوى</p><p>4. ارفع المستندات</p><p>5. انتظر الموافقة و صرف القرض</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي</p><p>• السجل التجاري</p><p>• البطاقة الضريبية</p><p>• دراسة جدوى المشروع</p><p>• عقد إيجار أو ملكية المقر</p><h3>💰 القروض</h3><p>من 10 آلاف لـ 2 مليون جنيه، بفائدة مخفضة (3-5%)</p><h3>💡 نصيحة</h3><p>جهّز دراسة جدوى واضحة عشان تزود فرص قبولك في القرض</p>`},
  {id:31,icon:'👷',cat:'تأمينات',title:'إزاي تسجّل في التأمين الاجتماعي؟',excerpt:'تسجيل العاملين في التأمينات الاجتماعية — دليل رب العمل',readTime:'6 دقائق',content:`<h3>📋 الخطوات</h3><p>1. ادخل على <a href="https://ensani.gov.eg" target="_blank">ensani.gov.eg</a></p><p>2. اختار "تسجيل صاحب عمل / عامل"</p><p>3. اكتب بيانات الشركة و العاملين</p><p>4. ارفع المستندات</p><p>5. استلم رقم التأميني لكل عامل</p><h3>📄 المستندات</h3><p>• السجل التجاري للشركة</p><p>• بطاقات الرقم القومي للعاملين</p><p>• عقد العمل</p><p>• استمارة 1 و 2 للتأمينات</p><h3>💰 الاشتراكات</h3><p>العامل بيدفع 14% من الأجر، صاحب العمل بيدفع 11% — إجمالي 25%</p><h3>💡 نصيحة</h3><p>سجّل العاملين في خلال 30 يوم من تاريخ التعيين عشان تتجنب الغرامة</p>`},
  {id:32,icon:'🏥',cat:'تأمين صحي',title:'إزاي تطلع كارت علاج مجاني؟',excerpt:'استخراج كارت التأمين الصحي للعلاج المجاني',readTime:'4 دقائق',content:`<h3>📋 الخطوات</h3><p>1. سجّل بيانات أسرتك التأمينية أونلاين من <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> — اختار المحافظة حسب البطاقة واحفظ</p><p>2. بعد 48 ساعة روح لوحدة الرعاية الأولية لسداد الاشتراك واستلام الكارت برقم الملف العائلي</p><p>3. اعمل الفحص المبدئي وافتح الملف العائلي</p><h3>👥 مين بيسجل إزاي؟</h3><p>• غير الخاضعين للتأمينات: من مكتب خدمة العملاء لبيانات الدخل والسداد الذاتي</p><p>• الغير قادرين: الدولة بتسدد عنهم</p><h3>📍 المحافظات المتاحة</h3><p>• المرحلة الأولى: بورسعيد، الأقصر، الإسماعيلية، جنوب سيناء، السويس، أسوان</p><p>• المرحلة الثانية: دمياط، كفر الشيخ، المنيا، مطروح، شمال سيناء</p><h3>💡 المميزات</h3><p>تغطية من الولادة للوفاة + مساهمات رمزية على الأدوية والأشعة والتحاليل (والمعفيون منها: الغير قادرين وأصحاب الأمراض المزمنة والأورام)</p>`},
  {id:33,icon:'⚖️',cat:'شهر عقاري',title:'إزاي تسجّل ميراث في الشهر العقاري؟',excerpt:'تسجيل إعلام الوراثة و نقل ملكية الموروث',readTime:'7 دقائق',content:`<h3>📋 الخطوات</h3><p>1. استخرج إعلام وراثة من محكمة الأسرة</p><p>2. روح لمكتب الشهر العقاري التابع لعقار الموروث</p><p>3. اكتب طلب تسجيل إعلام الوراثة</p><p>4. ادفع الرسوم</p><p>5. استلم تسجيل الميراث</p><h3>📄 المستندات</h3><p>• إعلام وراثة رسمي</p><p>• شهادة وفاة المورث</p><p>• بطاقات الرقم القومي للورثة</p><p>• مستندات ملكية العقار</p><h3>💰 الرسوم</h3><p>500-2000 جنيه حسب المساحة (حتى 100م=500، 100-200م=1000، 200-300م=1500، أكثر=2000) + رسوم إدارية | إجمالي 3000-4000 جنيه</p><h3>💡 نصيحة</h3><p>سجّل الميراث في أقرب وقت عشان تتجنب أي نزاعات بين الورثة</p>`},
  {id:34,icon:'🎓',cat:'تعليم',title:'إزاي تستخرج شهادة مؤهل دراسي؟',excerpt:'استخراج شهادة تخرج أو شهادة دراسية رسمية',readTime:'4 دقائق',content:`<h3>📋 الخطوات</h3><p>1. استخرج صورة رسمية من الشهادة: الجامعية من شئون الطلاب ← وكيل الكلية للتعليم ← أمين عام الجامعة</p><p>2. الثانوية والإعدادية من الإدارة التعليمية ← المديرية التعليمية ← سكرتير عام المحافظة</p><p>3. صدّق الشهادة من مكاتب تصديقات وزارة الخارجية (المكتب الرئيسي: مجمع التحرير)</p><h3>💰 الرسوم</h3><p>• تصديق غير تجاري (ومنه الشهادات الدراسية): 11 جنيه</p><p>• تصديق تجاري: 25 جنيه</p><h3>⏰ المدة</h3><p>• عادي: 3-5 أيام عمل</p><p>• فوري: نفس اليوم برسوم أعلى</p><h3>📄 المستندات</h3><p>• الشهادة الأصلية</p><p>• صورة بطاقة الرقم القومي سارية</p><p>• الترجمة المعتمدة لو مطلوبة للجهة الأجنبية</p><h3>💡 نصيحة</h3><p>لو الشهادة لجهة رسمية في دولة أجنبية: تصديق وزارة الخارجية + سفارة الدولة المعنية لو مشترطة</p>`},
  {id:35,icon:'🇪🇬',cat:'جوازات',title:'إزاي تطلب الجنسية المصرية؟',excerpt:'تجنيس الأجانب أو استرداد الجنسية المصرية',readTime:'8 دقائق',content:`<h3>📋 الجهة المختصة</h3><p>وزارة الداخلية — مصلحة الجوازات والهجرة والجنسية هي الجهة الوحيدة المختصة بالجنسية المصرية إثباتًا وكسبًا واستردادًا</p><h3>📋 الخطوات</h3><p>1. قدّم طلبك من قسم الجنسية بمصلحة الجوازات أو إلكترونيًا عبر دليل خدمات الجوازات <a href=\"https://enationality.moi.gov.eg" target=\"_blank\">enationality.moi.gov.eg</a></p><p>2. سدد الرسوم وجمّع المستندات المطلوبة لمسارك (الميلاد من أب مصري، أو التجنيس، أو الاسترداد)</p><p>3. متابعة الطلب من البوابة الرسمية للجنسية المصرية <a href=\"https://egyptcitizenship.gov.eg" target=\"_blank\">egyptcitizenship.gov.eg</a></p><h3>💰 الرسوم</h3><p>• جدول رسوم شهادات الجوازات يبدأ من ~47 جنيه حسب نوع الشهادة والسن</p><p>• عاجل اختياري: 100 جنيه</p><p>• لو الشهادة لجهة قضائية: بصرح من المحكمة أو النيابة المختصة</p><h3>⏰ مهم!</h3><p>• شروط كل مسار (أحكام قانون 140/2019) بتحددها البوابة الرسمية — راجعها قبل التقديم</p>`}
]

var grid=document.getElementById('articlesGrid');
grid.innerHTML=articles.map(function(a){
  return '<article class="article-card" onclick="openArticle('+a.id+')">'+
    '<div class="article-icon">'+a.icon+'</div>'+
    '<span class="article-cat">'+a.cat+'</span>'+
    '<h3 class="article-title">'+a.title+'</h3>'+
    '<p class="article-excerpt">'+a.excerpt+'</p>'+
    '<span class="article-readtime">⏱ '+a.readTime+'</span>'+
    '</article>';
}).join('');

function openArticle(id){
  var a=articles.find(function(x){return x.id===id});
  if(!a)return;
