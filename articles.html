  {id:33,icon:'⚖️',cat:'شهر عقاري',title:'إزاي تسجّل ميراث في الشهر العقاري؟',excerpt:'تسجيل إعلام الوراثة و نقل ملكية الموروث',readTime:'7 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>استخرج شهادة الوفاة (مكتب الصحة) ثم إعلام الوراثة من محكمة الأسرة المختصة (طلب + شهادة وفا</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>لو ملكية المورث مسجلة: قدّم طلب «شهر حق الإرث» في مأمورية الشهر العقاري أو مكتب السجل العي</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>لو الملكية غير مسجلة (عقد عرفي): دعوى صحة ونفاذ (سجّل صحيفة الدعوى أولًا بالشهر العقاري) ←</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>ارفع بيانًا مساحيًا عبر بوابة المركز التكنولوجي للتسجيل المساحي العقاري rsc.mped.gov.eg — </span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ إعلام الوراثة / الإشهاد الشرعي أو الحكم المثبت لحق الإرث</div><div class='doc-item'>✅ سندات ملكية المورث + كشوف رسمية من دفاتر التكليف وعوائد المباني ع</div><div class='doc-item'>✅ شهادة الوفاة + بطاقات الرقم القومي للورثة + ما يثبت صفة مقدم الطل</div></div></div><a href='https://rsc.mped.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على rsc.mped.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. استخرج شهادة الوفاة (مكتب الصحة) ثم إعلام الوراثة من محكمة الأسرة المختصة (طلب + شهادة وفاة + قائمة الورثة وأعمارهم وعناوينهم) — الإعلام بحدد الورثة وأنصبتهم</p><p>2. لو ملكية المورث مسجلة: قدّم طلب «شهر حق الإرث» في مأمورية الشهر العقاري أو مكتب السجل العيني المختص بالعقار</p><p>3. لو الملكية غير مسجلة (عقد عرفي): دعوى صحة ونفاذ (سجّل صحيفة الدعوى أولًا بالشهر العقاري) ← حكم نهائي ← تسجيل الحكم ← بعدها شهر حق الإرث</p><p>4. ارفع بيانًا مساحيًا عبر بوابة المركز التكنولوجي للتسجيل المساحي العقاري <a href="https://rsc.mped.gov.eg" target="_blank">rsc.mped.gov.eg</a> — الطلب بيتحول للمكتب الهندسي للمعاينة والتحديد، وبترجع للفحص وحصر النواقص (5 أيام لكل) ← سدّد الرسوم ← إتمام الشهر وإصدار سند ملكية باسم الورثة</p><h3>📄 المستندات</h3><p>• إعلام الوراثة / الإشهاد الشرعي أو الحكم المثبت لحق الإرث</p><p>• سندات ملكية المورث + كشوف رسمية من دفاتر التكليف وعوائد المباني عند تعذر السندات</p><p>• شهادة الوفاة + بطاقات الرقم القومي للورثة + ما يثبت صفة مقدم الطلب إن وجد</p><h3>💰 الرسوم</h3><p>مفيش رسم أساسي على شهر حق الإرث نفسه (تحفيزًا للورثة) — بتدفع رسومًا مساحية حسب المساحة: حتى 100م² = 500 جنيه / 101-200م² = 1000 / 201-300م² = 1500 / أكبر من 300م² = 2000، + رسوم إدارية بسيطة (تصوير وحفظ)</p><h3>⏰ المدة</h3><p>التسجيل بياخد 37-39 يوم عمل حسب المصادر الموثقة</p><h3>💡 نصيحة</h3><p>إعلام الوراثة لوحده لا ينقل الملكية — ولا يجوز التصرف في الموروث قبل تسجيل حق الإرث، فابدأ التسجيل في أقرب وقت لتجنب النزاعات بين الورثة</p>`},
  {id:34,icon:'🎓',cat:'تعليم',title:'إزاي تستخرج شهادة مؤهل دراسي؟',excerpt:'استخراج شهادة تخرج أو شهادة دراسية رسمية',readTime:'4 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>استخرج صورة رسمية من الشهادة: الجامعية من شئون الطلاب ← وكيل الكلية للتعليم ← أمين عام الج</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>الثانوية والإعدادية من الإدارة التعليمية ← المديرية التعليمية ← سكرتير عام المحافظة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>صدّق الشهادة من مكاتب تصديقات وزارة الخارجية (المكتب الرئيسي: مجمع التحرير)</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>تصديق تجاري</span><span>25ج</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ الشهادة الأصلية</div><div class='doc-item'>✅ صورة بطاقة الرقم القومي سارية</div><div class='doc-item'>✅ الترجمة المعتمدة لو مطلوبة للجهة الأجنبية</div></div></div></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. استخرج صورة رسمية من الشهادة: الجامعية من شئون الطلاب ← وكيل الكلية للتعليم ← أمين عام الجامعة</p><p>2. الثانوية والإعدادية من الإدارة التعليمية ← المديرية التعليمية ← سكرتير عام المحافظة</p><p>3. صدّق الشهادة من مكاتب تصديقات وزارة الخارجية (المكتب الرئيسي: مجمع التحرير)</p><h3>💰 الرسوم</h3><p>• تصديق غير تجاري (ومنه الشهادات الدراسية): 11 جنيه</p><p>• تصديق تجاري: 25 جنيه</p><h3>⏰ المدة</h3><p>• عادي: 3-5 أيام عمل</p><p>• فوري: نفس اليوم برسوم أعلى</p><h3>📄 المستندات</h3><p>• الشهادة الأصلية</p><p>• صورة بطاقة الرقم القومي سارية</p><p>• الترجمة المعتمدة لو مطلوبة للجهة الأجنبية</p><h3>💡 نصيحة</h3><p>لو الشهادة لجهة رسمية في دولة أجنبية: تصديق وزارة الخارجية + سفارة الدولة المعنية لو مشترطة</p>`},
  {id:35,icon:'🇪🇬',cat:'جوازات',title:'إزاي تطلب الجنسية المصرية؟',excerpt:'تجنيس الأجانب أو استرداد الجنسية المصرية',readTime:'8 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>وزارة الداخلية — مصلحة الجوازات والهجرة والجنسية هي الجهة الوحيدة المختصة بالجنسية المصرية</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>وم شهادات الجوازات يبدأ م</span><span>~47ج</span></div><div class='fee-item'><span>عاجل اختياري</span><span>100ج</span></div></div></div></div><div class='info-divider'></div>`,content:`<h3>📋 الجهة المختصة</h3><p>وزارة الداخلية — مصلحة الجوازات والهجرة والجنسية هي الجهة الوحيدة المختصة بالجنسية المصرية إثباتًا وكسبًا واستردادًا</p><h3>📋 الخطوات</h3><p>1. قدّم طلبك من قسم الجنسية بمصلحة الجوازات أو إلكترونيًا عبر دليل خدمات الجوازات <a href=\"https://enationality.moi.gov.eg" target=\"_blank\">enationality.moi.gov.eg</a></p><p>2. سدد الرسوم وجمّع المستندات المطلوبة لمسارك (الميلاد من أب مصري، أو التجنيس، أو الاسترداد)</p><p>3. متابعة الطلب من البوابة الرسمية للجنسية المصرية <a href=\"https://egyptcitizenship.gov.eg" target=\"_blank\">egyptcitizenship.gov.eg</a></p><h3>💰 الرسوم</h3><p>• جدول رسوم شهادات الجوازات يبدأ من ~47 جنيه حسب نوع الشهادة والسن</p><p>• عاجل اختياري: 100 جنيه</p><p>• لو الشهادة لجهة قضائية: بصرح من المحكمة أو النيابة المختصة</p><h3>⏰ مهم!</h3><p>• شروط كل مسار (أحكام قانون 140/2019) بتحددها البوابة الرسمية — راجعها قبل التقديم</p>`},
  {id:36,icon:'🍚',cat:'خدمات عامة',title:'إزاي تدير بطاقة التموين أونلاين؟',excerpt:'الاستعلام والخدمات التموينية أونلاين — من بوابة مصر الرقمية',readTime:'6 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>ادخل على digital.gov.eg ← خدمات التموين ← «الاستعلام عن صرف»</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>سجّل دخول بحسابك (الرقم القومي لرب الأسرة)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>دوس «تأكيد بيانات بطاقة التموين» ← «الاستعلام عن صرف» — هتظهرلك: الأفراد المقيدين + آخر عم</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ سن الطفل 4 سنين على الأقل • حد أقصى 4 أفراد (زوج وزوجة وطفلان) • </div></div></div><a href='https://digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على digital.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الاستعلام عن صرف</h3><p>1. ادخل على <a href="https://digital.gov.eg" target="_blank">digital.gov.eg</a> ← خدمات التموين ← «الاستعلام عن صرف»</p><p>2. سجّل دخول بحسابك (الرقم القومي لرب الأسرة)</p><p>3. دوس «تأكيد بيانات بطاقة التموين» ← «الاستعلام عن صرف» — هتظهرلك: الأفراد المقيدين + آخر عمليات صرف الخبز والسلع + كشف المحذوفين</p><h3>📱 استعلام أسرع</h3><p>ابعت «1» على 9136 من موبايل رب الأسرة المسجل بالوزارة</p><h3>🛠️ خدمات البوابة</h3><p>• بدل تالف أو فاقد • نقل بين المحافظات • إضافة الأبناء والزوجة • إصدار بطاقة جديدة • تفعيل • إيقاف نفسي • ضم المواليد</p><h3>📄 شروط إضافة الأبناء</h3><p>• سن الطفل 4 سنين على الأقل • حد أقصى 4 أفراد (زوج وزوجة وطفلان) • للفئات الأولى بالرعاية • دخل شهري أقل من 3000ج أو معاش أقل من 2500ج</p><h3>💡 نصيحة</h3><p>بدل الفاقد بيتطلب من مكتب التموين لرب الأسرة فقط — سلّم صورة الطلب خلال 3 أيام وإلا البطاقة القديمة تشتغل تاني. الاستعلام مجاني والخط الساخن 19959</p>`},
  {id:37,icon:'🏢',cat:'شركات',title:'إزاي تؤسس شركتك أونلاين من GAFI؟',excerpt:'تأسيس شركتك إلكترونيًا من بوابة GAFI في 7 خطوات',readTime:'8 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>التأسيس الإلكتروني من gafi.gov.eg — ومن أغسطس 2025 طلبات ذ.م.م إلكتروني فقط</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>القيد بالسجل التجاري</span><span>56ج</span></div><div class='fee-item'><span>فرع</span><span>261ج</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ شهادة عدم التباس (أو رقمها من مصر الرقمية) • إثبات شخصية ساري (إق</div></div></div><a href='https://gafi.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على gafi.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 البوابة</h3><p>التأسيس الإلكتروني من <a href="https://gafi.gov.eg" target="_blank">gafi.gov.eg</a> — ومن أغسطس 2025 طلبات ذ.م.م إلكتروني فقط</p><h3>📋 الخطوات السبع</h3><p>1. سجّل حسابك واعمل مساحة عمل</p><p>2. اختار الشكل القانوني (فردية — تضامن — توصية — ذ.م.م) وشوف الإجراءات والرسوم</p><p>3. املأ بيانات الشركة وارفع المستندات وابعت الطلب</p><p>4. سدّد كل رسوم الجهات دفعة واحدة بالبطاقة</p><p>5. وقّع إلكترونيًا على عقد التأسيس والنظام الأساسي</p><p>6. وقّع إلكترونيًا على محضر توثيق العقد من الشهر العقاري</p><p>7. الهيئة تكمّل الباقي نيابةً عنك: نقابة المحامين + الجهاز المركزي للمحاسبات + الغرف التجارية + السجل التجاري + البطاقة الضريبية + الملف التأميني — والاستلام من مركز خدمات المستثمرين أو بالبريد</p><h3>📄 المستندات</h3><p>• شهادة عدم التباس (أو رقمها من مصر الرقمية) • إثبات شخصية ساري (إقامة للأجانب) • مستخرج سجل المحاسبين لمراجع حسابات شركات الأموال</p><h3>💰 الرسوم</h3><p>القيد بالسجل التجاري 56ج (فرع 261ج) + رسوم حسب شكل الشركة ونشاطها</p><h3>💡 نصيحة</h3><p>التوقيع الإلكتروني من شركة مرخصة من ITIDA هو أكتر نقطة بتأخر — جهزه بدري. وشركة الشخص الواحد بتتأسس إلكترونيًا في ساعتين. الخط الساخن 16530</p>`},
  {id:38,icon:'🎒',cat:'تعليم',title:'إزاي تسجّل ولدك في الصف الأول الابتدائي؟',excerpt:'تسجيل أولى ابتدائي إلكترونيًا عبر بوابة EMIS — الخطوات والأوراق',readTime:'5 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>من بوابة مركز معلومات الوزارة emis.gov.eg — ورابط التقديم tansikgprim.emis.gov.eg</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ شهادة ميلاد مميكنة حديثة وصورها • 4 صور شخصية • صورة بطاقة الولي </div></div></div><a href='https://emis.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على emis.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 التقديم إلكتروني حصريًا</h3><p>من بوابة مركز معلومات الوزارة <a href="https://emis.gov.eg" target="_blank">emis.gov.eg</a> — ورابط التقديم tansikgprim.emis.gov.eg</p><h3>⏰ فترة التقديم</h3><p>بتتعلن سنويًا — سنة 2026/2027 كانت من 1 لـ30 يونيو</p><h3>📋 الخطوات</h3><p>1. اعمل حساب ولي أمر بالرقم القومي (الأب صاحب الولاية التعليمية)</p><p>2. اختار خدمة التقديم واكتب الرقم القومي للطفل من شهادة الميلاد المميكنة</p><p>3. اختار المدرسة حسب النطاق الجغرافي والمربع السكني</p><p>4. احفظ واطبع استمارة التقديم</p><p>5. تابع القبول المبدئي من نفس البوابة وسلّم الملف الورقي بالمدرسة</p><h3>📄 الأوراق</h3><p>• شهادة ميلاد مميكنة حديثة وصورها • 4 صور شخصية • صورة بطاقة الولي سارية • طوابع مهن تعليمية ودعم وتمويل المشروعات</p><h3>⚠️ سن القبول</h3><p>من 6 لـ9 سنين في الأول من أكتوبر (القرار 154/1989) — والمستوى الثالث رياض أطفال من 4 سنين</p><h3>💡 نصيحة</h3><p>التسجيل مجاني بالكامل — ولو مش قادر تسجّل بنفسك وحدة المعلومات بالمدرسة بتساعدك. الخط الساخن 19368</p>`},
  {id:39,icon:'⚖️',cat:'خدمات عامة',title:'إزاي ترفع دعوى مدنية أونلاين؟',excerpt:'إقامة الدعوى المدنية إلكترونيًا من بوابة مصر الرقمية — الشروط والخطوات',readTime:'7 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>يبقى ليك مصلحة وصفة في الدعوى (م.3) • المحكمة المختصة: الجزئية حتى 100 ألف جنيه والابتدائي</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ أسماء الأطراف ومواطنهم وموطن مختار • الوقائع والطلبات والأسانيد •</div></div></div><a href='https://digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على digital.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الشروط الأولية</h3><p>• يبقى ليك مصلحة وصفة في الدعوى (م.3) • المحكمة المختصة: الجزئية حتى 100 ألف جنيه والابتدائية فوق كده • صحيفة موقعة من محامٍ مقيد</p><h3>🖥️ الإقامة الإلكترونية من بوابة مصر الرقمية</h3><p>من <a href="https://digital.gov.eg" target="_blank">digital.gov.eg</a> بشروطها: محامي مسجّل ومفعّل في النظام + أرقام قومية لكل الأطراف + الأطراف على قيد الحياة + التوكيلات وسند الدعوى</p><h3>📄 بيانات الصحيفة (م.63)</h3><p>• أسماء الأطراف ومواطنهم وموطن مختار • الوقائع والطلبات والأسانيد • متطلبات القيد (م.65): إثبات سداد الرسوم أو الإعفاء + صور بعدد المدعى عليهم + المستندات + مذكرة شارحة أو إقرار</p><h3>💰 الرسوم</h3><p>نسبية من قيمة الدعوى حسب جدول الرسوم — والمعسر يطلب المعونة أو الإعفاء القضائي</p><h3>💡 نصيحة</h3><p>بعد رفعها: إخطار المدعى عليه بكتاب موصى عليه خلال 3 أيام — والخصومة تنعقد بالإعلان أو الحضور (م.68)</p>`},
  {id:40,icon:'🏥',cat:'تأمين صحي',title:'إزاي تسجّل أسرتك في التأمين الصحي الشامل؟',excerpt:'التسجيل في التأمين الصحي الشامل — الخطوات والمحافظات المتاحة',readTime:'6 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>ادخل على digital.gov.eg ← «تسجيل بيانات الأسرة التأمينية»</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>اختار محافظتك حسب البطاقة وسجّل البيانات واحفظ</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>بعد 48 ساعة روح وحدة الرعاية الأولية لسداد الاشتراك والفحص المبدئي واستلام الكارت برقم الم</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ غير الخاضعين للتأمينات: مكتب خدمة العملاء لبيانات الدخل والسداد ا</div></div></div><a href='https://digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على digital.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 التسجيل أونلاين</h3><p>1. ادخل على <a href="https://digital.gov.eg" target="_blank">digital.gov.eg</a> ← «تسجيل بيانات الأسرة التأمينية»</p><p>2. اختار محافظتك حسب البطاقة وسجّل البيانات واحفظ</p><p>3. بعد 48 ساعة روح وحدة الرعاية الأولية لسداد الاشتراك والفحص المبدئي واستلام الكارت برقم الملف العائلي</p><h3>📍 المتاح فين دلوقتي؟</h3><p>• المرحلة الأولى: بورسعيد — الأقصر — الإسماعيلية — جنوب سيناء — السويس — أسوان • المرحلة الثانية: دمياط — كفر الشيخ — المنيا — مطروح — شمال سيناء</p><h3>📄 حالات خاصة</h3><p>غير الخاضعين للتأمينات: مكتب خدمة العملاء لبيانات الدخل والسداد الذاتي — والغير قادرين تسدد عنهم الدولة</p><h3>💰 المساهمات</h3><p>رمزية على الأدوية والأشعة والتحاليل — والمعفيون منها: الغير قادرين وأصحاب الأمراض المزمنة والأورام. التغطية من الولادة للوفاة</p><h3>💡 نصيحة</h3><p>إضافة المواليد بشهادة ميلاد مميكنة + أصل كارت الأسرة — والنقل بين المحافظات بإفادة إغلاق الملف السابق. التفاصيل على uhia.gov.eg</p>`},
  {id:41,icon:'⚡',cat:'مرافق',title:'إزاي توصّل عداد كهرباء لمسكنك؟',excerpt:'توصيل عداد كهرباء جديد لمنزلك — الخطوات والمستندات والرسوم عبر بوابة خدمات الكهرباء',readTime:'5 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>ادخل على eservices.eehc.gov.eg وسجّل حساب</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>اختار «طلب توصيل عداد» واملأ بيانات العقار</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>ارفع المستندات وادفع الرسوم إلكترونيًا</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>المعاينة والتركيب خلال 7–15 يوم</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>أحادي الطور</span><span>1050ج</span></div><div class='fee-item'><span>ثلاثي الطور</span><span>1700ج</span></div><div class='fee-item'><span>عداد كود</span><span>50ج طلب</span></div></div><div class='fees-total'>حسب نوع العداد</div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ بطاقة الرقم القومي سارية</div><div class='doc-item'>✅ عقد ملكية أو إيجار موثق</div><div class='doc-item'>✅ فاتورة كهرباء حديثة للعقار</div><div class='doc-item'>✅ رخصة بناء للعقارات الجديدة</div></div></div><a href='https://eservices.eehc.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على بوابة الكهرباء</a></div><div class='info-divider'></div>`,content:`<h3>📋 التقديم الإلكتروني</h3><p>1. ادخل على <a href=\"https://eservices.eehc.gov.eg\" target=\"_blank\">بوابة خدمات الكهرباء</a> وسجّل حساب بالرقم القومي</p><p>2. اختار «طلب توصيل عداد جديد» واملأ بيانات العقار والعنوان التفصيلي</p><p>3. ارفع المستندات المطلوبة وادفع الرسوم إلكترونيًا بالبطاقة</p><p>4. هيتم المعاينة خلال 7 أيام ثم التركيب خلال 15 يوم</p><h3>💰 الرسوم</h3><p>• عداد أحادي الطور: 1050 جنيه • عداد ثلاثي الطور: 1700 جنيه • طلب عداد كود: 50 جنيه رسم الطلب</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي سارية • عقد ملكية أو إيجار موثق • فاتورة كهرباء حديثة للعقار • رخصة بناء للعقارات الجديدة</p><h3>💡 نصيحة</h3><p>لو العقار في منطقة جديدة، تأكد من وجود شبكة كهرباء قبل التقديم. عداد الكود مؤقت بيركّب بسرعة لحد ما يتعمل العداد الدائم</p>`},
  {id:42,icon:'💧',cat:'مرافق',title:'إزاي توصّل عداد مياه لمسكنك؟',excerpt:'توصيل عداد مياه جديد لشقتك — الخطوات والمستندات والرسوم',readTime:'5 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>روح شركة المياه التابع لها أو قدّم أونلاين</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>قدّم الطلب مع المستندات وادفع رسوم المعاينة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>المعاينة وتحديد المقايسة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>سداد المقايسة والتركيب</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>توصيل جديد</span><span>1000–3000ج</span></div><div class='fee-item'><span>معاينة</span><span>حسب المنطقة</span></div></div><div class='fees-total'>المقايسة تحدد بعد المعاينة</div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ بطاقة الرقم القومي سارية</div><div class='doc-item'>✅ عقد ملكية أو إيجار موثق</div><div class='doc-item'>✅ فاتورة كهرباء حديثة</div><div class='doc-item'>✅ فاتورة مياه للعقار</div></div></div><a href='https://www.hcww.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على موقع الشركة القابضة للمياه</a></div><div class='info-divider'></div>`,content:`<h3>📋 التقديم</h3><p>1. روح شركة المياه التابع لمنطقتك أو قدّم طلب أونلاين عبر الموقع الرسمي</p><p>2. قدّم الطلب مع المستندات المطلوبة وادفع رسوم المعاينة</p><p>3. هيتم المعاينة وتحديد المقايسة الفنية للأعمال المطلوبة</p><p>4. بعد سداد المقايسة هيتم التركيب خلال المدة المحددة</p><h3>💰 الرسوم</h3><p>• التوصيل الجديد بيختلف حسب المنطقة ونوع العقار من 1000 لـ 3000 جنيه تقريبًا • المعاينة بتحدد المقايسة النهائية</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي سارية • عقد ملكية أو إيجار موثق • فاتورة كهرباء حديثة بنفس العنوان • فاتورة مياه للعقار (لو موجود)</p><h3>💡 نصيحة</h3><p>تأكد إن شبكة المياه الرئيسية واصلة لحد العقار قبل التقديم. لو العقار جديد استخرج موافقة من جهاز المدينة الأول</p>`},
  {id:43,icon:'🔥',cat:'مرافق',title:'إزاي توصّل الغاز الطبيعي لشقتك؟',excerpt:'التعاقد على توصيل الغاز الطبيعي للمنازل — خطوات وأوراق ورسوم بالتقسيط',readTime:'6 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>ادخل موقع تاون جاس أو إيجاس واضغط «تعاقد أونلاين»</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>املأ البيانات وارفع المستندات</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>المعاينة وتحديد الكود الفني</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>التعاقد وتركيب العداد</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم (بالتقسيط)</div><div class='fees-grid'><div class='fee-item'><span>إجمالي التوصيل</span><span>5200ج</span></div><div class='fee-item'><span>قسط شهري</span><span>62ج</span></div><div class='fee-item'><span>مدة التقسيط</span><span>7 سنين</span></div></div><div class='fees-total'>بدون مقدم أو فوائد</div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ صورة بطاقة الرقم القومي سارية</div><div class='doc-item'>✅ عقد ملكية أو إيجار (مدته 10 سنين)</div><div class='doc-item'>✅ فاتورة كهرباء حديثة (3 شهور)</div><div class='doc-item'>✅ رقم الغاز المكتوب على باب العمارة</div></div></div><a href='https://www.egas.com.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ التعاقد على بوابة إيجاس</a></div><div class='info-divider'></div>`,content:`<h3>📋 التعاقد الإلكتروني</h3><p>1. ادخل على موقع <a href=\"https://www.egas.com.eg\" target=\"_blank\">إيجاس</a> أو موقع شركة الغاز التابع لمنطقتك (تاون جاس / غاز مصر / ناتجاس)</p><p>2. اضغط «تعاقد أونلاين» ← «عميل جديد» واملأ بياناتك الشخصية والعقار</p><p>3. ارفع المستندات المطلوبة بصيغة رقمية واضحة</p><p>4. هيتم المعاينة وتحديد الكود الفني والأعمال المطلوبة</p><p>5. استكمل التعاقد وسداد رسوم التأمين ثم التركيب</p><h3>💰 نظام التقسيط</h3><p>التكلفة الإجمالية 5200 جنيه (من إجمالي 16 ألف بعد الدعم) — تُقسّط على 7 سنين بواقع 62 جنيه شهريًا تُضاف لفاتورة الغاز — بدون مقدم أو فوائد</p><h3>📄 المستندات</h3><p>• صورة بطاقة الرقم القومي سارية • عقد ملكية أو إيجار (مدته لا تقل عن 10 سنين) • فاتورة كهرباء حديثة (لم تمضِ 3 شهور) • رقم الغاز المكتوب على باب العمارة</p><h3>💡 نصيحة</h3><p> لازم يكون العقار مرخص وفيه كهرباء والمنطقة مخدومة بشبكة غاز. نسبة إشغال العقار لا تقل عن 85% لتفعيل الخدمة</p>`},
  {id:44,icon:'💰',cat:'مرافق',title:'إزاي تسدّد فاتورة الغاز أونلاين؟',excerpt:'الاستعلام عن فاتورة الغاز وسدادها إلكترونيًا — كل الطرق في مكان واحد',readTime:'4 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>ادخل موقع بتروتريد أو ماي فوري أو جوميا باي</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>اختار «دفع فاتورة غاز» وادخل رقم المشترك</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>هتظهر قيمة الفاتورة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>ادفع بالبطاقة أو المحفظة واستلم الإيصال</span></div></div></div><div class='info-section'><div class='info-title'>💳 طرق السداد</div><div class='docs-checklist'><div class='doc-item'>✅ موقع بتروتريد petrotrade.com.eg بالفيزا</div><div class='doc-item'>✅ تطبيق ماي فوري (MyFawry)</div><div class='doc-item'>✅ تطبيق جوميا باي (JumiaPay)</div><div class='doc-item'>✅ المحافظ: فون كاش / فودافون كاش / إنستا باي</div><div class='doc-item'>✅ منافذ فوري وأمان ومصاري POS</div><div class='doc-item'>✅ مكاتب البريد المصري</div></div></div><a href='https://www.petrotrade.com.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 استعلم وادفع على بتروتريد</a></div><div class='info-divider'></div>`,content:`<h3>📋 الاستعلام عن الفاتورة</h3><p>1. ادخل على <a href=\"https://www.petrotrade.com.eg/billing/billq.aspx\" target=\"_blank\">موقع بتروتريد</a> ← «استعلام عن الفاتورة»</p><p>2. ادخل رقم المشترك (فرعي، شقة، عمارة، بلوك، قطاع، يومية، منطقة، محافظة)</p><p>3. اضغط «عرض الفواتير» هتظهرلك قيمة الفاتورة</p><h3>💳 طرق السداد الإلكتروني</h3><p>• <strong>بتروتريد:</strong> الموقع الرسمي بالفيزا أو ماستر كارد</p><p>• <strong>ماي فوري (MyFawry):</strong> حمّل التطبيق ← دفع فاتورة غاز ← رقم المشترك ← ادفع</p><p>• <strong>جوميا باي (JumiaPay):</strong> حمّل التطبيق ← فواتير الغاز ← رقم المشترك</p><p>• <strong>المحافظ الإلكترونية:</strong> فون كاش / فودافون كاش / أورانج كاش / إنستا باي</p><p>• <strong>منافذ POS:</strong> فوري / أمان / مصاري / خدماتي</p><p>• <strong>مكاتب البريد:</strong> خلال مواعيد العمل الرسمية</p><h3>⏰ تسجيل القراءة</h3><p>تسجيل قراءة العداد من يوم 1 لـ 27 من كل شهر عبر موقع بتروتريد أو تطبيق «بتروميتر» أو الخط الساخن 17169</p><h3>💡 نصيحة</h3><p>سدّد الفاتورة من يوم 1 لـ آخر يوم في الشهر لتجنب غرامة التأخير أو وقف الخدمة</p>`},
  {id:45,icon:'💧',cat:'مرافق',title:'إزاي تسدّد فاتورة المياه أونلاين؟',excerpt:'الاستعلام عن فاتورة المياه وسدادها إلكترونيًا — طرق وخطوات سهلة',readTime:'4 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>حمّل تطبيق 125-HCWW أو ادخل موقع الشركة القابضة للمياه</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>اختار شركتك وادخل رقم السداد الإلكتروني</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>هتظهر قيمة الفاتورة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>ادفع بالبطاقة أو المحفظة واستلم الإيصال</span></div></div></div><div class='info-section'><div class='info-title'>💳 طرق السداد</div><div class='docs-checklist'><div class='doc-item'>✅ تطبيق 125-HCWW (أندرويد و iOS)</div><div class='doc-item'>✅ موقع الشركة القابضة للمياه hcww.gov.eg</div><div class='doc-item'>✅ تطبيق ماي فوري (MyFawry)</div><div class='doc-item'>✅ منافذ فوري وأمان ومصاري</div><div class='doc-item'>✅ مكاتب البريد المصري</div></div></div><a href='https://www.hcww.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 استعلم وادفع على موقع المياه</a></div><div class='info-divider'></div>`,content:`<h3>📋 الاستعلام عن الفاتورة</h3><p>1. ادخل على <a href=\"https://www.hcww.gov.eg\" target=\"_blank\">موقع الشركة القابضة للمياه</a> ← قسم «خدماتنا»</p><p>2. اضغط «احسب فاتورتك بنفسك» واختار المحافظة والمنطقة ونوع النشاط</p><p>3. ادخل قراءة العداد الحالية والسابقة وحالة الصرف الصحي</p><p>4. اضغط «عرض الفاتورة» هتظهرلك قيمة الاستهلاك</p><h3>💳 السداد الإلكتروني</h3><p>• <strong>تطبيق 125-HCWW:</strong> حمّله من Google Play أو App Store ← أنشئ حساب ← اختار شركتك ← ادخل رقم السداد الإلكتروني ← ادفع</p><p>• <strong>الموقع الإلكتروني:</strong> «خدماتنا» ← «دفع الفواتير» ← اختار شركة المياه ← ادخل كود الدفع ← ادفع بالبطاقة</p><p>• <strong>ماي فوري:</strong> اختار شركة المياه ← رقم المشترك ← ادفع</p><p>• <strong>منافذ POS:</strong> فوري / أمان / مصاري — بكود مخصص لكل مدينة</p><h3>💡 نصيحة</h3><p>سجّل قراءة العداد بانتظام لضمان دقة الفاتورة، وادفع في الموعد المحدد لتجنب الغرامات أو انقطاع الخدمة</p>`},
  {id:46,icon:'📋',cat:'شركات',title:'إزاي تجدد سجلك التجاري؟',excerpt:'تجديد السجل التجاري إلكترونيًا — الخطوات والرسوم والمواعيد',readTime:'5 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>ادخل على egypt.gov.eg ← السجل التجاري ← تجديد</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>سجّل دخول بالرقم القومي واختار المنشأة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>ادفع الرسوم إلكترونيًا واطبع الإيصال</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>أفراد</span><span>100–170ج</span></div><div class='fee-item'><span>شركات</span><span>200–500ج</span></div><div class='fee-item'><span>صلاحية</span><span>5 سنين</span></div></div><div class='fees-total'>التجديد في آخر شهر قبل الانتهاء</div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ بطاقة الرقم القومي</div><div class='doc-item'>✅ رقم السجل التجاري الحالي</div><div class='doc-item'>✅ البطاقة الضريبية (لو موجود)</div></div></div><a href='https://www.egypt.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 جدّد على بوابة مصر الرقمية</a></div><div class='info-divider'></div>`,content:`<h3>📋 التجديد الإلكتروني</h3><p>1. ادخل على <a href=\"https://www.egypt.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> ← السجل التجاري ← «تجديد سجل»</p><p>2. سجّل دخول بالرقم القومي واختار المنشأة المطلوب تجديدها</p><p>3. ادفع الرسوم إلكترونيًا بالبطاقة واطبع الإيصال</p><h3>💰 الرسوم</h3><p>• الأفراد: 100–170 جنيه (9.5 جنيه رسم أساسي + رسوم غرفة + خدمات) • الشركات: 200–500 جنيه حسب نوع الشركة • صلاحية السجل 5 سنين</p><h3>⏰ مواعيد التجديد</h3><p>التجديد بيكون في آخر شهر قبل انتهاء السجل. لو فاتك الموعد فيه فترة سماح 90 يوم بس برسوم مضاعفة. بعد الـ 90 يوم بيتشطب السجل وتلزم إعادة القيد من جديد</p><h3>💡 نصيحة</h3><p>حدّد تذكير في موبايلك قبل شهر من انتهاء السجل عشان تتجدد في الموعد وتوفر على نفسك الرسوم المضاعفة</p>`},
  {id:47,icon:'🚗',cat:'مرور',title:'إزاي تستعلم وتسدد مخالفات المرور؟',excerpt:'الاستعلام عن مخالفات السيارة وسدادها أونلاين — خطوة بخطوة',readTime:'4 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>ادخل على ppo.gov.eg ← «نيابات المرور» ← «الاستعلامات»</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>ادخل رقم لوحة السيارة والمحافظة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>هتظهر المخالفات والقيمة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>ادفع أونلاين بالبطاقة أو فوري</span></div></div></div><div class='info-section'><div class='info-title'>💳 طرق السداد</div><div class='docs-checklist'><div class='doc-item'>✅ بوابة النيابة العامة ppo.gov.eg</div><div class='doc-item'>✅ بوابة مصر الرقمية digital.gov.eg</div><div class='doc-item'>✅ منافذ فوري (كاش أو بطاقة)</div><div class='doc-item'>✅ مكاتب المرور</div></div></div><a href='https://www.ppo.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 استعلم على بوابة النيابة العامة</a></div><div class='info-divider'></div>`,content:`<h3>📋 الاستعلام عن المخالفات</h3><p>1. ادخل على <a href=\"https://www.ppo.gov.eg\" target=\"_blank\">بوابة النيابة العامة</a> ← «نيابات المرور» ← «الاستعلامات»</p><p>2. ادخل رقم لوحة السيارة والمحافظة المسجلة فيها</p><p>3. هتظهرلك كل المخالفات بقيمتها وتواريخها</p><p>4. ممكن كمان تستعلم عبر <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a></p><h3>💳 السداد الإلكتروني</h3><p>• ادفع أونلاين بالبطاقة الائتمانية (فيزا / ماستر / ميزة)</p><p>• أو من خلال منافذ فوري بكاش أو بطاقة</p><p>• أو من مكاتب المرور المختصة</p><h3>💡 نصيحة</h3><p>استعلم بانتظام عن مخالفات سيارتك عشان تتجنب تراكمها والحجز على السيارة. السداد المبكر بيضمن تجديد الرخصة بدون مشاكل</p>`},
  {id:48,icon:'💉',cat:'صحة',title:'إزاي تستخرج شهادة تطعيم؟',excerpt:'استخراج شهادة تطعيم دولية للمسافرين — الخطوات والرسوم والمكاتب',readTime:'4 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>روح أقرب مركز تطعيم دولي أو مكتب صحة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>قدّم بطاقتك واحصل على التطعيم المطلوب</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>استلم شهادة التطعيم بـ QR Code</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>الحمى الصفراء</span><span>70ج</span></div><div class='fee-item'><span>الكوليرا</span><span>15ج</span></div><div class='fee-item'><span>التهاب سحائي</span><span>50ج</span></div><div class='fee-item'><span>بدل فاقد/تالف</span><span>100ج</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ بطاقة الرقم القومي للإطلاع</div><div class='doc-item'>✅ جواز السفر (للمسافرين)</div><div class='doc-item'>✅ تذكرة السفر (في بعض المراكز)</div></div></div><a href='https://www.mohp.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 اعرف أقرب مكتب صحة على موقع الوزارة</a></div><div class='info-divider'></div>`,content:`<h3>📋 استخراج الشهادة</h3><p>1. روح أقرب مركز تطعيم دولي أو مكتب صحة تابع لمنطقتك</p><p>2. قدّم بطاقة الرقم القومي للإطلاع واحصل على التطعيم المطلوب للدولة اللي بتسافرها</p><p>3. استلم شهادة التطعيم الدولية بـ QR Code مؤمنة من مجمع الإصدارات المؤمنة الذكية</p><h3>💰 رسوم التطعيمات</h3><p>• الحمى الصفراء: 70 جنيه • الكوليرا: 15 جنيه • الالتهاب السحائي الرباعي (للحج والعمرة): 50 جنيه • بدل فاقد أو تالف لأي شهادة: 100 جنيه</p><h3>📱 تطبيق اطمئن</h3><p>لو عندك شهادة تطعيم كورونا، حمّل تطبيق «اطمئن» (Egypt Health Passport) من App Store أو Google Play — بيعرض حالة التطعيم بـ QR Code وبيشتغل كجواز سفر صحي إلكتروني في المطارات</p><h3>💡 نصيحة</h3><p>بعض الدول بتطلب التطعيم قبل السفر بفترة معينة (مثلاً الحمى الصفراء قبل 10 أيام) — اكتشف متطلبات الدولة اللي بتسافرها من السفارة قبل التقديم</p>`},
  {id:49,icon:'🛂',cat:'سفر',title:'إزاي تطلع تأشيرة خروج وعودة؟',excerpt:'تأشيرة الخروج والعودة للسعودية للمقيمين المصريين — الخطوات والرسوم',readTime:'5 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>ادخل على Abher (أفراد) أو Muqeem (شركات)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>سجّل الدخول واختار تأشيرة خروج وعودة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>ادفع الرسوم واطبع التأشيرة</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>تأشيرة فردية</span><span>200 ريال</span></div><div class='fee-item'><span>تأشيرة متعددة</span><span>500 ريال</span></div><div class='fee-item'><span>مدة الفردية</span><span>60 يوم</span></div><div class='fee-item'><span>مدة المتعددة</span><span>180 يوم</span></div></div><div class='fees-total'>للمقيمين في السعودية — خرج وارجع</div></div><div class='info-section'><div class='info-title'>📄 الشروط</div><div class='docs-checklist'><div class='doc-item'>✅ إقامة سارية</div><div class='doc-item'>✅ جواز سفر ساري 6+ شهور</div><div class='doc-item'>✅ سداد كل الرسوم والمخالفات</div></div></div><a href='https://www.absher.sa' target='_blank' rel='noopener' class='form-download-btn'>📥 قدّم طلبك على Abher</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات (أونلاين)</h3><p>1. ادخل على <a href=\"https://www.absher.sa\" target=\"_blank\">Abher</a> (للأفراد) أو <a href=\"https://www.muqeem.sa\" target=\"_blank\">Muqeem</a> (للشركات)</p><p>2. سجّل الدخول بحسابك واختار «تأشيرة خروج وعودة»</p><p>3. اكتب بيانات السفر (تاريخ المغادرة، المدة)</p><p>4. ادفع الرسوم إلكترونيًا (مدى أو بطاقة بنكية)</p><p>5. اطلع التأشيرة واطبعها</p><h3>💰 الرسوم</h3><p>• تأشيرة فردية (مرة واحدة): 200 ريال سعودي — صالحة 60 يوم</p><p>• تأشيرة متعددة (دخول متكرر): 500 ريال سعودي — صالحة 180 يوم</p><h3>📄 الشروط</h3><p>• الإقامة سارية المفعول • جواز السفر ساري لمدة 6 شهور على الأقل • سداد كل الرسوم والمخالفات (لو وجدت)</p><h3>⏰ مهم!</h3><p>التأشيرة بتطلع فورًا بعد دفع الرسوم. لازم تطلعها قبل السفر — مفيش تأشيرة على المطار للمقيمين</p><h3>💡 نصيحة</h3><p>لو بتسافر مع العائلة، اطلع تأشيرة لكل فرد على حدة. تأكد من تطابق بيانات جواز السفر مع بيانات الإقامة قبل التقديم</p>`},
  {id:50,icon:'🏠',cat:'عقاري',title:'إزاي تسجّل عقد إيجار؟',excerpt:'توثيق عقد الإيجار في الشهر العقاري — الخطوات والأوراق والرسوم',readTime:'5 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>روح مكتب الشهر العقاري التابع للعقار</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>حضور المالك والمستأجر + المستندات</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>تقدير الرسوم وسدادها</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>التوقيع والختم — استلام خلال 24 ساعة</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>رسم نسبي</span><span>0.5% من الإيجار</span></div><div class='fee-item'><span>حد أدنى</span><span>10ج</span></div><div class='fee-item'><span>مبلغ تأمين</span><span>0.75%</span></div><div class='fee-item'><span>شرط جزائي</span><span>2%</span></div></div><div class='fees-total'>المدة: 24 ساعة</div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ بطاقة الرقم القومي سارية (الطرفين)</div><div class='doc-item'>✅ أصل عقد الإيجار</div><div class='doc-item'>✅ سند ملكية المؤجر</div><div class='doc-item'>✅ توكيل رسمي (لو بوكيل)</div></div></div><a href='https://www.digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 خدمات الشهر العقاري على مصر الرقمية</a></div><div class='info-divider'></div>`,content:`<h3>📋 توثيق عقد الإيجار</h3><p>1. روح مكتب الشهر العقاري أو فرع التوثيق التابع لمنطقة العقار</p><p>2. لازم يحضر المالك والمستأجر (أو وكياءهم بتوكيل رسمي)</p><p>3. قدّم المستندات المطلوبة وسيقوم الموظف بتقدير الرسوم</p><p>4. سدّد الرسوم ووقّع الطرفان على المحضر الرسمي</p><p>5. استلم العقد الموثق بختم شعار الجمهورية والصيغة التنفيذية خلال 24 ساعة</p><h3>💰 الرسوم</h3><p>• رسم نسبي: 0.5% من القيمة الإيجارية الإجمالية (حد أدنى 10 جنيه) • لو فيه مبلغ تأمين: 0.75% • لو فيه شرط جزائي: 2% • رسم توثيق: 20 جنيه عن كل سنة من مدة الإيجار</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي سارية للطرفين • أصل عقد الإيجار (نسختين على الأقل) • سند ملكية المؤجر للعقار • توكيل رسمي (لو بوكيل)</p><h3>💡 نصيحة</h3><p>توثيق عقد الإيجار بيحمي الطرفين: المالك يقدر ياخد إخلاء فوري من قاضي الأمور الوقتية لو المستأجر امتنع عن الدفع، والمستأجر محمي لو العقار اتباع لمالك جديد</p>`},
  {id:51,icon:'🏦',cat:'عقاري',title:'إزاي تسجّل رهن عقاري؟',excerpt:'تسجيل الرهن الرسمي للعقار في الشهر العقاري — الإجراءات والمستندات',readTime:'6 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>تجهيز عقد الرهن الرسمي أمام الموثق</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>تقديم طلب الشهر لمأمورية الشهر العقاري</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>سداد الرسوم والنشر</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>قيد الرهن على صحيفة العقار</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 المدة والصلاحية</div><div class='fees-grid'><div class='fee-item'><span>مدة القيد</span><span>حسب قيمة الدين</span></div><div class='fee-item'><span>صلاحية القيد</span><span>10 سنين</span></div><div class='fee-item'><span>تجديد القيد</span><span>قبل الانتهاء</span></div></div><div class='fees-total'>الرهن لا ينفذ إلا بالتسجيل</div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ سند ملكية العقار (عقد مسجل)</div><div class='doc-item'>✅ عقد الرهن الرسمي</div><div class='doc-item'>✅ بطاقات الرقم القومي للأطراف</div><div class='doc-item'>✅ بيان مساحي للعقار</div><div class='doc-item'>✅ شهادة خلو العقار من قيود</div></div></div><a href='https://www.digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 خدمات الشهر العقاري على مصر الرقمية</a></div><div class='info-divider'></div>`,content:`<h3>📋 تسجيل الرهن العقاري</h3><p>1. يحرر عقد الرهن الرسمي أمام الموثق المختص ويتضمن بيانات العقار وقيمة الدين</p><p>2. يتقدم طلب الشهر لمأمورية الشهر العقاري الواقع في دائرتها العقار</p><p>3. سداد الرسوم المقررة ثم النشر لإتاحة الفرصة لأي اعتراضات</p><p>4. يتم قيد الرهن على صحيفة العقار في السجل العقاري — هذا القيد هو الذي يحدد المرتبة القانونية للدائن</p><h3>⏰ صلاحية وتجديد القيد</h3><p>مدة نفاذ قيد الرهن 10 سنوات من تاريخ القيد — يجب تجديده قبل انتهاء المدة وإلا سقط الرهن واعتبر كأن لم يكن</p><h3>📄 المستندات</h3><p>• سند ملكية العقار (عقد مسجل) • عقد الرهن الرسمي • بطاقات الرقم القومي للأطراف • بيان مساحي للعقار • شهادة خلو العقار من رهون أو قيود سابقة</p><h3>💡 نصيحة</h3><p>الرهن الحيازي بديل لو العقار غير مسجل — لكن الرهن الرسمي هو الأقوى قانونًا لأنه يمنح الأولوية على الدائنين الآخرين. شطب الرهن يتم بمخالصة من الدائن أو حكم قضائي بعد سداد الدين</p>`},
  {id:52,icon:'📜',cat:'عقاري',title:'إزاي تسجّل بيع عقار؟',excerpt:'تسجيل عقد بيع عقاري في الشهر العقاري — الخطوات والأوراق والرسوم',readTime:'6 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>تجهيز العقد الابتدائي والمستندات</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>تقديم طلب التسجيل للشهر العقاري</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>المعاينة والفحص الفني</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>استلام العقد المشهر (السند الأخضر)</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>نموذج التسجيل</span><span>100ج</span></div><div class='fee-item'><span>تسجيل الوحدة</span><span>حتى 3900ج</span></div><div class='fee-item'><span>إجمالي تقريبي</span><span>حتى 4000ج</span></div></div><div class='fees-total'>المدة: حتى 37 يوم</div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ عقد بيع ابتدائي أو نهائي</div><div class='doc-item'>✅ بطاقات الرقم القومي للطرفين</div><div class='doc-item'>✅ رخصة مباني للعقار</div><div class='doc-item'>✅ بيان رفع مساحي معتمد</div><div class='doc-item'>✅ سند ملكية البائع</div><div class='doc-item'>✅ صورة شهادة التصرفات العقارية</div></div></div><a href='https://www.digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 خدمات الشهر العقاري على مصر الرقمية</a></div><div class='info-divider'></div>`,content:`<h3>📋 تسجيل عقد البيع</h3><p>1. جهّز العقد الابتدائي (العرفي) مع المستندات المطلوبة</p><p>2. قدّم طلب التسجيل على النموذج المعد لذلك في مأمورية الشهر العقاري + سداد الرسوم</p><p>3. هيتم الفحص الفني والمعاينة للتحقق من بيانات العقار ومطابقتها للواقع</p><p>4. بعد الاعتماد، استلم العقد المشهر (السند الأخضر) — ده النسخة الرسمية للملكية</p><h3>💰 الرسوم</h3><p>• نموذج طلب التسجيل: 100 جنيه • تسجيل الوحدة السكنية: حتى 3900 جنيه • الإجمالي: حتى 4000 جنيه (حسب مساحة وموقع العقار)</p><h3>⏰ المدة</h3><p>حسب قانون الشهر العقاري الجديد (9 لسنة 2022): المدة القصوى 37 يوم من تاريخ التوقيع على محضر التسجيل</p><h3>📄 المستندات</h3><p>• عقد بيع ابتدائي أو نهائي • بطاقات الرقم القومي للطرفين • رخصة مباني للعقار • بيان رفع مساحي معتمد (خريطة رقمية) • سند ملكية البائع • صورة شهادة التصرفات العقارية</p><h3>💡 نصيحة</h3><p>التسجيل هو الإثبات الرسمي للملكية — بدون التسجيل العقد يبقى عرفي بين الطرفين فقط ولا يحمي في مواجهة الغير. لاحظ المنشور الفني رقم 4 لسنة 2025: لازم تقدّم العقد العرفي الأصلي مع الطلب</p>`},
  {id:53,icon:'📑',cat:'عقاري',title:'إزاي تستخرج شهادة تسلسل ملكية؟',excerpt:'استخراج شهادة تصرفات عقارية من الشهر العقاري — الخطوات والرسوم',readTime:'4 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>روح مأمورية الشهر العقاري التابع لها العقار</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>قدّم طلب استخراج شهادة تصرفات عقارية</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>ادفع الرسوم وانتظر الرد</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>استلم الشهادة بكل التصرفات على العقار</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ بطاقة الرقم القومي لمقدم الطلب</div><div class='doc-item'>✅ بيانات العقار (عنوان + حدود)</div><div class='doc-item'>✅ رقم العقار في السجل (لو متاح)</div><div class='doc-item'>✅ توكيل رسمي (لو وكيل)</div></div></div><a href='https://www.digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 خدمات الشهر العقاري على مصر الرقمية</a></div><div class='info-divider'></div>`,content:`<h3>📋 شهادة التصرفات العقارية (تسلسل الملكية)</h3><p>1. روح مأمورية الشهر العقاري الواقع في دائرتها العقار</p><p>2. قدّم طلب استخراج شهادة تصرفات عقارية مع بيانات العقار التفصيلية</p><p>3. ادفع الرسوم المقررة وانتظر الرد</p><p>4. استلم الشهادة اللي بتوضح كل التصرفات والحقوق العينية على العقار</p><h3>📋 محتويات الشهادة</h3><p>الشهادة بتشمل: تسلسل الملكية للعقار • الرهون والقيود الموجودة • الحقوق العينية الأصلية والتبعية • الدعاوى القضائية المرفوعة على العقار • أي تعديلات على حدود العقار</p><h3>💡 نصيحة</h3><p>طلّع الشهادة دي قبل شراء أي عقار عشان تتأكد إن البائع مالك حقيقي وإن العقار خالٍ من الرهون والنزاعات. ده أهم إجراء وقائي قبل التسجيل</p>`},
  {id:54,icon:'✍️',cat:'عقاري',title:'إزاي تعمل توكيل في الشهر العقاري؟',excerpt:'توثيق توكيل رسمي في الشهر العقاري — أنواعه وخطواته والرسوم',readTime:'5 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>روح مكتب التوثيق التابع لمنطقتك</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>قدّم نوع التوكيل المطلوب والمستندات</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>سداد الرسوم والتوقيع أمام الموثق</span></div></div></div><div class='info-section'><div class='info-title'>📝 أنواع التوكيلات</div><div class='docs-checklist'><div class='doc-item'>✅ توكيل عام (شامل)</div><div class='doc-item'>✅ توكيل خاص (محدد)</div><div class='doc-item'>✅ توكيل بيع عقار</div><div class='doc-item'>✅ توكيل قضائي</div><div class='doc-item'>✅ توكيل زواج/طلاق</div><div class='doc-item'>✅ توكيل إدارة أعمال</div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ بطاقة الرقم القومي سارية للموكل</div><div class='doc-item'>✅ بيانات الوكيل (رقم قومي + عنوان)</div><div class='doc-item'>✅ بيانات العقار (لتوكيل البيع)</div></div></div><a href='https://www.digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 خدمات التوثيق على مصر الرقمية</a></div><div class='info-divider'></div>`,content:`<h3>📋 أنواع التوكيلات</h3><p>• <strong>توكيل عام:</strong> صلاحيات واسعة لإدارة كل أموال الموكل — يلزم رجوع لمحامٍ قبل إصداره</p><p>• <strong>توكيل خاص:</strong> صلاحيات محددة لغرض واحد (مثلاً بيع عقار معين)</p><p>• <strong>توكيل قضائي:</strong> للمحامي للتقاضي نيابة عن الموكل</p><p>• <strong>توكيل زواج أو طلاق:</strong> للتصرف في الأمور الزوجية</p><h3>📋 الإجراءات</h3><p>1. روح مكتب التوثيق (الشهر العقاري) التابع لمنطقتك أو قدّم أونلاين عبر <a href=\"https://www.digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a></p><p>2. حدّد نوع التوكيل المطلوب وقدّم المستندات</p><p>3. سدّد الرسوم ووقّع أمام الموثق — استلم التوكيل في نفس اليوم أو خلال 24 ساعة</p><h3>💡 نصيحة</h3><p>التوكيلات اللي ممكن إجراؤها إلكترونيًا من بوابة مصر الرقمية: توكيل عام قضايا، توكيل في الأمور الزوجية، إقرار تصحيح محرر موثق، إقرار بعدم وجود تعديلات على البيانات المساحية — باقي التوكيلات لازم حضور لمكتب التوثيق</p>`},
  {id:55,icon:'📇',cat:'تأمينات',title:'إزاي تعرف رقم تأمينك الاجتماعي؟',excerpt:'الاستعلام عن الرقم التأميني بالرقم القومي — خطوات سهلة على موقع التأمينات',readTime:'3 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>ادخل على nosi.gov.eg ← «الاستعلام عن الرقم التأميني»</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>اضغط «بدء الخدمة»</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>ادخل الرقم القومي + اسم الأم الأول</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>هتظهرلك بيانات الرقم التأميني</span></div></div></div><div class='info-section'><div class='info-title'>📄 المطلوب</div><div class='docs-checklist'><div class='doc-item'>✅ الرقم القومي (14 رقم)</div><div class='doc-item'>✅ اسم الأم الأول باللغة العربية</div></div></div><a href='https://www.nosi.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 استعلم عن رقمك التأميني الآن</a></div><div class='info-divider'></div>`,content:`<h3>📋 الاستعلام عن الرقم التأميني</h3><p>1. ادخل على <a href=\"https://www.nosi.gov.eg\" target=\"_blank\">موقع الهيئة القومية للتأمين الاجتماعي</a> ← «الاستعلام عن الرقم التأميني بالرقم القومي»</p><p>2. اضغط «بدء الخدمة»</p><p>3. ادخل البيانات المطلوبة: الرقم القومي المكون من 14 رقم + اسم الأم الأول باللغة العربية</p><p>4. ضع علامة «أنا لست روبوت» واضغط «إرسال الطلب»</p><p>5. هتظهرلك بيانات الرقم التأميني الخاص بيك</p><h3>💡 نصيحة</h3><p>الرقم التأميني هو المفتاح الرئيسي لكل خدمات التأمين الاجتماعي — من الولادة لحد المعاش. احتفظ بيه لأنه مطلوب في كل المعاملات التأمينية والمعاشات. لو لم يظهر الرقم، زر أقرب مكتب تأمينات لتحديث البيانات</p>`},
  {id:56,icon:'📊',cat:'تأمينات',title:'إزاي تستعلم عن مدد تأمينك؟',excerpt:'الاستعلام عن مدد الاشتراك التأميني وأجورك — عبر موقع التأمينات الاجتماعية',readTime:'4 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>ادخل nosi.gov.eg ← «مستخدم جديد» وسجّل حساب</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>سجّل دخول بالرقم القومي وكلمة المرور</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>اختار «الاستعلام عن مدد الاشتراك»</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>هتظهرلك كل المدد والأجور</span></div></div></div><div class='info-section'><div class='info-title'>📋 البيانات المعروضة</div><div class='docs-checklist'><div class='doc-item'>✅ الرقم التأميني</div><div class='doc-item'>✅ جهات العمل السابقة والحالية</div><div class='doc-item'>✅ مدد الاشتراك الفعلية</div><div class='doc-item'>✅ الأجر الأساسي والمتغير</div><div class='doc-item'>✅ موقفك التأميني (نشط/منقطع)</div><div class='doc-item'>✅ إجمالي مدة الاشتراك</div></div></div><a href='https://www.nosi.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 استعلم عن مدد تأمينك</a></div><div class='info-divider'></div>`,content:`<h3>📋 إنشاء حساب جديد</h3><p>1. ادخل على <a href=\"https://www.nosi.gov.eg\" target=\"_blank\">موقع التأمينات</a> ← «مستخدم جديد»</p><p>2. أدخل: الرقم القومي + الرقم التأميني + اسم الأم + رقم الموبايل + البريد الإلكتروني + كلمة المرور</p><p>3. هتصلك رسالة تحقق على الموبايل لتفعيل الحساب</p><h3>📋 الاستعلام عن المدد</h3><p>1. سجّل دخول بالرقم القومي وكلمة المرور</p><p>2. اختار «خدمات المؤمن عليه» ← «الاستعلام عن مدد الاشتراك»</p><p>3. هتظهرلك: كل مدد الاشتراك الفعلية + جهات العمل السابقة والحالية + الأجر الأساسي والمتغير لكل مدة + موقفك التأميني (نشط/منقطع) + إجمالي مدة الاشتراك المحسوبة للمعاش</p><h3>💡 نصيحة</h3><p>تابع مددك التأمينية بانتظام — لو فيه مدد ناقصة أو خطأ في الأجور، قدّم تظلم لمكتب التأمينات المختص. المدد دي هي اللي بتحدد قيمة معاشك عند التقاعد. الحد الأقصى للأجر التأميني 16700 جنيه شهريًا (2026)</p>`},
  {id:57,icon:'✏️',cat:'تأمينات',title:'إزاي تعدّل بياناتك التأمينية؟',excerpt:'تحديث بيانات المؤمن عليه في التأمينات الاجتماعية — الخطوات والمستندات',readTime:'4 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>ادخل nosi.gov.eg وسجّل دخول</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>اختار «تعديل البيانات» وحدد نوع التعديل</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>ارفع المستندات الداعمة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>أو روح مكتب التأمينات المختص</span></div></div></div><div class='info-section'><div class='info-title'>📝 أنواع التعديلات</div><div class='docs-checklist'><div class='doc-item'>✅ تعديل الاسم أو اسم الأم</div><div class='doc-item'>✅ تعديل عنوان السكن</div><div class='doc-item'>✅ تعديل بيانات جهة العمل</div><div class='doc-item'>✅ تعديل رقم الموبايل أو البريد</div><div class='doc-item'>✅ تصحيح تاريخ الميلاد</div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ بطاقة الرقم القومي سارية</div><div class='doc-item'>✅ مستند داعم للتعديل (شهادة ميلاد، إلخ)</div></div></div><a href='https://www.nosi.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 عدّل بياناتك على موقع التأمينات</a></div><div class='info-divider'></div>`,content:`<h3>📋 التعديل الإلكتروني</h3><p>1. ادخل على <a href=\"https://www.nosi.gov.eg\" target=\"_blank\">موقع التأمينات</a> وسجّل دخول بحسابك</p><p>2. اختار «تعديل البيانات» وحدد نوع التعديل المطلوب</p><p>3. ارفع المستندات الداعمة (مثلاً شهادة ميلاد لتعديل تاريخ الميلاد)</p><p>4. هيتم مراجعة الطلب وتفعيل التعديل بعد التحقق</p><h3>📋 التعديل من مكتب التأمينات</h3><p>لو التعديل مش متاح إلكترونيًا، روح أقرب مكتب تأمينات بالرقم القومي والمستند الداعم وملّأ نموذج التعديل</p><h3>💡 نصيحة</h3><p>حدّث بياناتك (خاصة الموبايل والعنوان) باستمرار عشان توصلك إشعارات المعاش والمستحقات. لو اسمك أو اسم أمك مختلف بين البطاقة وسجل التأمينات، صحّحه فورًا لأنه بيؤثر على استحقاق المعاش</p>`},
  {id:58,icon:'🩹',cat:'تأمينات',title:'إزاي تطلب معاش إصابة عمل؟',excerpt:'الحصول على معاش أو تعويض إصابة العمل — الخطوات والمستحقات',readTime:'6 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>جهة العمل تبلّغ الشرطة والتأمينات خلال 48 ساعة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>العلاج على نفقة التأمينات + تقرير طبي</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>تقدير نسبة العجز باللجنة الطبية</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>تقديم طلب تسوية للهيئة — أو رفع دعوى</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 المستحقات</div><div class='fees-grid'><div class='fee-item'><span>عجز كلي دائم</span><span>80% من الأجر</span></div><div class='fee-item'><span>عجز مؤقت</span><span>100% من الأجر</span></div><div class='fee-item'><span>عجز جزئي (35–100%)</span><span>نسبة من المعاش</span></div><div class='fee-item'><span>عجز جزئي (أقل من 35%)</span><span>تعويض قطعي</span></div></div><div class='fees-total'>إصابة قاتلة: 80% للورثة</div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ نموذج إخطار الإصابة (رقم 59)</div><div class='doc-item'>✅ محضر شرطة بالحادث</div><div class='doc-item'>✅ التقارير الطبية الأولية والنهائية</div><div class='doc-item'>✅ تقرير اللجنة الطبية بنسبة العجز</div><div class='doc-item'>✅ بطاقة الرقم القومي</div></div></div><a href='https://www.nosi.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 خدمات التأمينات على موقع NOSI</a></div><div class='info-divider'></div>`,content:`<h3>📋 إجراءات الإبلاغ</h3><p>1. <strong>إبلاغ جهة العمل:</strong> بتبلّغ الشرطة ومكتب التأمينات خلال 48 ساعة من الحادث (نموذج 59). لو لم تبلّغ، العامل يبلّغ بنفسه</p><p>2. <strong>العلاج:</strong> على نفقة التأمينات في مستشفى حكومي أو معتمد — احتفظ بكل التقارير الطبية</p><p>3. <strong>تقرير العجز:</strong> بعد انتهاء العلاج، اللجنة الطبية بتحدد نسبة العجز (كلي/جزئي/مؤقت)</p><p>4. <strong>طلب التسوية:</strong> قدّم طلب للهيئة القومية للتأمين الاجتماعي للحصول على المستحقات</p><h3>💰 المستحقات (قانون 148 لسنة 2019)</h3><p>• <strong>عجز كلي دائم:</strong> 80% من متوسط الأجر الشهري + 20% بدل رعاية (لو محتاج مساعدة)</p><p>• <strong>عجز مؤقت:</strong> 100% من الأجر يوميًا من يوم الإصابة لحد الشفاء أو ثبوت العجز الدائم</p><p>• <strong>عجز جزئي (35–100%):</strong> نسبة من معاش العجز الكلي حسب درجة العجز</p><p>• <strong>عجز جزئي (أقل من 35%):</strong> تعويض قطعي (48 شهر من المعاش)</p><p>• <strong>إصابة قاتلة:</strong> 80% من الأجر للورثة + منح الوفاة والجنازة</p><h3>💡 نصيحة</h3><p>لو رفضت الهيئة المعاش أو نسبة العجز مش عادلة، اطلب إعادة الكشف بلجنة طبية تانية، ولو لسه فيه رفض — ارفع دعوى عمالية. لو الإصابة بسبب إهمال صاحب العمل، ممكن ترفع دعوى تعويض مدنية بالإضافة لمعاش التأمينات</p>`},
  {id:59,icon:'🧾',cat:'ضرائب',title:'إزاي تسجّل في الفاتورة الإلكترونية؟',excerpt:'التسجيل على منظومة الفاتورة الإلكترونية لمصلحة الضرائب — خطوات الشركات',readTime:'6 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>ادخل على eta.gov.eg ← «التسجيل الذاتي»</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>ادخل الرقم الضريبي للشركة (9 أرقام)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>حدّد اللغة والبريد والموبايل + كود التأكيد</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>استخرج شهادة الختم الإلكتروني وادمج مع المنظومة</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 المتطلبات</div><div class='fees-grid'><div class='fee-item'><span>الختم الإلكتروني</span><span>من إيجيبت تراست/المقاصة</span></div><div class='fee-item'><span>نظام التكويد</span><span>GS1 أو EGS</span></div><div class='fee-item'><span>التكامل</span><span>API أو بورتال</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ الرقم الضريبي للشركة (9 أرقام)</div><div class='doc-item'>✅ بطاقة الرقم القومي للمفوض</div><div class='doc-item'>✅ بريد إلكتروني وموبايل الشركة</div><div class='doc-item'>✅ شهادة الختم الإلكتروني</div></div></div><a href='https://www.eta.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 سجّل على منظومة الفاتورة الإلكترونية</a></div><div class='info-divider'></div>`,content:`<h3>📋 التسجيل الذاتي</h3><p>1. ادخل على <a href=\"https://www.eta.gov.eg\" target=\"_blank\">موقع مصلحة الضرائب</a> ← «التسجيل على منظومة الفاتورة الإلكترونية»</p><p>2. ادخل الرقم الضريبي للممول (الشركة) المكون من 9 أرقام ووافق على الشروط والأحكام</p><p>3. حدّد اللغة الافتراضية + البريد الإلكتروني + رقم موبايل الممول</p><p>4. هوصلك كود تأكيد على البريد وكود على الموبايل — أدخلهم للتحقق</p><p>5. ادخل بيانات المفوض (رقم قومي ساري + الاسم + البريد الإلكتروني + كلمة المرور)</p><p>6. اضغط «إنهاء» — هيتبعت دعوة للمسؤول لاستكمال التسجيل</p><h3>📋 المتطلبات الفنية</h3><p>• <strong>الختم الإلكتروني:</strong> استخرجه من شركة إيجيبت تراست أو شركة مصر المقاصة</p><p>• <strong>نظام التكويد:</strong> استخدم GS1 أو EGS لتكويد السلع والخدمات</p><p>• <strong>التكامل:</strong> عبر API (للشركات الكبيرة) أو بورتال إصدار الفواتير (للشركات الصغيرة)</p><h3>💡 نصيحة</h3><p>الفاتورة الإلكترونية شرط أساسي لإثبات التكاليف ورد ضريبة القيمة المضافة. مصلحة الضرائب لا تعتد بأي تعاملات غير موثقة بالفاتورة الإلكترونية. الخط الساخن للدعم الفني: 16395</p>`},
  {id:60,icon:'💵',cat:'مرور',title:'إزاي تطلب استرداد رسوم مرور؟',excerpt:'استرداد رسوم المرور المدفوعة بالخطأ أو الزيادة — الخطوات والمستندات',readTime:'4 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>روح إدارة المرور التابع لها + إيصال السداد</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>قدّم طلب استرداد رسمي بالأسباب</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>ارفع المستندات الداعمة (إيصال، صورة الرخصة)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>الموافقة والتحويل لبنكي أو استلام نقدًا</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ إيصال سداد الرسوم الأصلي</div><div class='doc-item'>✅ بطاقة الرقم القومي سارية</div><div class='doc-item'>✅ صورة رخصة السيارة أو السير</div><div class='doc-item'>✅ طلب استرداد مكتوب بالأسباب</div><div class='doc-item'>✅ صورة من المخالفة (لو موجود)</div></div></div><a href='https://www.digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 خدمات المرور على بوابة مصر الرقمية</a></div><div class='info-divider'></div>`,content:`<h3>📋 حالات الاسترداد</h3><p>• دفع رسوم مرور بالخطأ (مثلاً دفعت رسوم تجديد مرتين)</p><p>• دفع رسم مخالفة ثم إلغاؤها بقرار من النيابة</p><p>• دفع رسوم زيادة عن المقرر (مثلاً رسوم نقل ملكية محسوبة خطأ)</p><p>• سداد رسوم على سيارة مباعة قبل نقل الملكية</p><h3>📋 الإجراءات</h3><p>1. روح إدارة المرور التابع لمنطقتك مع إيصال السداد الأصلي</p><p>2. قدّم طلب استرداد رسمي مكتوب يوضح أسباب طلب الاسترداد</p><p>3. ارفق المستندات الداعمة (الإيصال + بطاقة الرقم القومي + صورة رخصة السيارة)</p><p>4. بعد الموافقة، هيتم التحويل لحسابك البنكي أو الاستلام نقدًا من الخزينة</p><h3>⏰ مدة الاسترداد</h3><p>بتستغرق عملية الاسترداد عادة من 30 لـ 60 يوم من تاريخ تقديم الطلب الكامل</p><h3>💡 نصيحة</h3><p>احتفظ بكل إيصالات سداد رسوم المرور — الاسترداد مش ممكن بدون الإيصال الأصلي. لو سددت أونلاين عبر <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a>، احتفظ برقم العملية والإيصال الإلكتروني</p>`}
]

var grid=document.getElementById('articlesGrid');
grid.innerHTML=articles.map(function(a){
  return '<article class="article-card" onclick="openArticle('+a.id+')">'+
    '<div class="article-icon">'+a.icon+'</div>'+
    '<span class="article-cat">'+a.cat+'</span>'+
    '<h3 class="article-title">'+a.title+'</h3>'+
    '<p class="article-excerpt">'+a.excerpt+'</p>'+
    '<span class="article-readtime">⏱ '+a.readTime+'</span>'+
    '</article>';
}).join('');

function openArticle(id){
  var a=articles.find(function(x){return x.id===id});
  if(!a)return;
  var modal=document.getElementById('articleModal');
  var body=document.getElementById('modalBody');
  body.innerHTML=(a.infographic?a.infographic:'')+a.content;
  modal.classList.add('active');
  document.body.style.overflow='hidden';
}
function closeArticle(){
  var modal=document.getElementById('articleModal');
  modal.classList.remove('active');
  document.body.style.overflow='';
}
