<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#15264a"/>
      <stop offset="1" stop-color="#0a1530"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ef0ff"/>
      <stop offset="1" stop-color="#2a8fe0"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4fd1ff" stop-opacity="0.05"/>
    </radialGradient>
    <clipPath id="lensClip">
      <circle cx="232" cy="290" r="82"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- ورقة فيها خطوط بس (بدون تكرار النص) -->
  <g transform="rotate(-6 220 320)">
    <rect x="92" y="200" width="272" height="240" rx="20" fill="#eef2f8" stroke="#c4cfdf" stroke-width="6"/>
    <line x1="120" y1="248" x2="336" y2="248" stroke="#b6c2d4" stroke-width="9" stroke-linecap="round"/>
    <line x1="120" y1="282" x2="336" y2="282" stroke="#b6c2d4" stroke-width="9" stroke-linecap="round"/>
    <line x1="120" y1="316" x2="336" y2="316" stroke="#b6c2d4" stroke-width="9" stroke-linecap="round"/>
    <line x1="120" y1="350" x2="336" y2="350" stroke="#b6c2d4" stroke-width="9" stroke-linecap="round"/>
    <line x1="120" y1="384" x2="300" y2="384" stroke="#b6c2d4" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- عدسة مكبرة: زجاج خفيف + إطار أزرق -->
  <circle cx="232" cy="290" r="92" fill="url(#glass)" stroke="url(#ai)" stroke-width="16"/>
  <!-- النص داخل العدسة (مكبّر وواضح) -->
  <g clip-path="url(#lensClip)">
    <rect x="150" y="208" width="164" height="164" fill="#ffffff"/>
    <text x="232" y="256" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#15264a" text-anchor="middle">Scan</text>
    <text x="232" y="292" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#15264a" text-anchor="middle">Macaron</text>
    <text x="232" y="326" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2a8fe0" text-anchor="middle">AI</text>
  </g>
  <!-- لمعان على العدسة -->
  <path d="M176 240 A80 80 0 0 1 232 208" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <!-- مقبض العدسة -->
  <line x1="296" y1="354" x2="372" y2="414" stroke="url(#ai)" stroke-width="22" stroke-linecap="round"/>

  <!-- روبوت ممسك المقبض -->
  <line x1="392" y1="160" x2="384" y2="404" stroke="url(#ai)" stroke-width="26" stroke-linecap="round"/>
  <circle cx="384" cy="406" r="18" fill="url(#ai)"/>
  <rect x="342" y="90" width="100" height="74" rx="22" fill="#1a2d52" stroke="url(#ai)" stroke-width="6"/>
  <circle cx="392" cy="127" r="15" fill="#7ef0ff"/>
  <circle cx="392" cy="127" r="6" fill="#0a1530"/>
  <line x1="392" y1="90" x2="392" y2="70" stroke="url(#ai)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="392" cy="66" r="6" fill="url(#ai)"/>
</svg>
