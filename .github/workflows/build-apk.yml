name: Build Scan Macaron APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'twa-build/**'
      - 'scan/icon-512.png'
      - 'scan/icon-512-maskable.png'
      - 'scan/manifest.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode signing keystore
        env:
          KS_BASE64: ${{ secrets.SCANMACARON_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SCANMACARON_KS_PASS }}
        run: |
          echo "$KS_BASE64" | base64 -d > /tmp/scanmacaron.keystore
          echo "$KS_PASS" > /tmp/scanmacaron.ks-pass

      - name: Build TWA APK
        working-directory: twa-build
        env:
          KS_PASS: ${{ secrets.SCANMACARON_KS_PASS }}
        run: |
          bubblewrap build --manifest twa-manifest.json \
            --keystore /tmp/scanmacaron.keystore \
            --keystore-pass "$KS_PASS" \
            --alias scanmacaron \
            --key-pass "$KS_PASS" || true
          ls -la app-release-signed.apk 2>/dev/null && echo "APK found" || (ls -la *.apk 2>/dev/null; find . -name "*.apk" -type f)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-macaron-apk
          path: |
            twa-build/*.apk
            twa-build/app-release-signed.apk
          if-no-files-found: warn
          retention-days: 30
