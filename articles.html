body{font-family:Cairo,sans-serif;background:#0F1E3D;color:#e8eef8;margin:0;padding:0}

var articles=[
  {id:1,icon:'🚗',cat:'مرور',title:'إزاي تتجدد رخصة سيارتك؟',excerpt:'دليلك الكامل لتجديد رخصة السيارة في مصر — الخطوات والمستندات والمصاريف',readTime:'5 دقائق',infographic:`<div class="infographic"><div class="info-section"><div class="info-title">📋 الخطوات</div><div class="steps-flow"><div class="step"><span class="step-num">1</span><span class="step-text">سجّل على بوابة مصر الرقمية</span></div><div class="step-arrow">←</div><div class="step"><span class="step-num">2</span><span class="step-text">استعلم برقم اللوحة والشاسيه</span></div><div class="step-arrow">←</div><div class="step"><span class="step-num">3</span><span class="step-text">دوس «تجديد» + سداد إلكتروني</span></div><div class="step-arrow">←</div><div class="step"><span class="step-num">4</span><span class="step-text">رسالة SMS بالتفعيل</span></div><div class="step-arrow">←</div><div class="step"><span class="step-num">5</span><span class="step-text">الاستلام 10 أيام أو توصيل</span></div></div></div><div class="info-fees"><div class="fees-title">💰 الرسوم</div><div class="fees-grid"><div class="fee-item"><span>كشف طبي</span><span>385ج</span></div><div class="fee-item"><span>استمارة</span><span>115ج</span></div><div class="fee-item"><span>ملف</span><span>65ج</span></div><div class="fee-item"><span>نموذج 265</span><span>45ج</span></div><div class="fee-item"><span>شهادة مخالفات</span><span>120ج</span></div><div class="fee-item"><span>ملصق إلكتروني</span><span>150ج</span></div><div class="fee-item"><span>طابع</span><span>15ج</span></div><div class="fee-item"><span>لوحات</span><span>~350ج</span></div></div><div class="fees-total">إجمالي 3 سنين: 4000–6000 جنيه</div></div><div class="info-section"><div class="info-title">📄 المستندات</div><div class="docs-checklist"><div class="doc-item">✅ البطاقة القديمة</div><div class="doc-item">✅ سداد كل الرسوم والمخالفات</div><div class="doc-item">✅ ملصق إلكتروني</div></div></div><a href='https://digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على بوابة مصر الرقمية</a></div><div class="info-divider"></div>`,content:`<h3>📋 الخطوات (أونلاين)</h3><p>1. سجّل الدخول على <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> واختار خدمة «مركباتي»</p><p>2. استعلم عن السيارة برقم اللوحة والشاسيه</p><p>3. دوس «تجديد» وسدد كل الرسوم والمخالفات إلكترونيًا</p><p>4. هيوصلك رسالة SMS بالتفعيل</p><p>5. الاستلام خلال 10 أيام عمل أو التوصيل للمنزل</p><h3>✅ شروط التجديد الإلكتروني</h3><p>• للسيارات الملاكية والدراجات النارية حتى 2030cc</p><p>• سداد كل الرسوم والمخالفات — وملصق إلكتروني</p><p>• مفيش حظر مروري ولا فحص فني مطلوب</p><h3>💰 الرسوم بالبنود</h3><p>كشف طبي 385ج + استمارة 115ج + ملف 65ج + نموذج 265 بـ45ج + طابع 15ج + شهادة مخالفات 120ج + ملصق 150ج + لوحات ~350ج + الضريبة حسب سعة المحرك من 225ج حتى 3000ج</p><p>إجمالي تجديد 3 سنين للسيارة الملاكية: 4000-6000 جنيه</p><h3>⏰ مهم!</h3><p>في مهلة سماح 30 يوم بعد انتهاء الرخصة — وفي وحدات مرور إلكترونية بالمولات بالحجز المسبق والدفع اللانقدي</p>`},
  {id:2,icon:'📊',cat:'ضرائب',title:'إزاي تسجل في الضريبة؟',excerpt:'خطوات التسجيل في المصلحة الضريبية وأهم المستندات المطلوبة',readTime:'7 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>التسجيل إلزامي خلال 30 يوم من بدء مزاولة النشاط أو الخضوع للقيمة المضافة (م.25 من قانون ال</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>قدّم نموذج 1/2 تسجيل يدويًا أو إلكترونيًا من eta.gov.eg — النسخة الإلكترونية ليها حجية الإ</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>لو الطلب ناقص هتتخطر لتستوفيه خلال 15 يوم</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>استلم الرقم الضريبي والبطاقة الضريبية</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>رسم سنوي بحد أقصى</span><span>500ج</span></div><div class='fee-item'><span>المحدد فعليًا</span><span>325ج</span></div></div></div><a href='https://eta.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على eta.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. التسجيل إلزامي خلال 30 يوم من بدء مزاولة النشاط أو الخضوع للقيمة المضافة (م.25 من قانون الإجراءات الضريبية الموحد 206/2020)</p><p>2. قدّم نموذج 1/2 تسجيل يدويًا أو إلكترونيًا من <a href=\"https://eta.gov.eg\" target=\"_blank\">eta.gov.eg</a> — النسخة الإلكترونية ليها حجية الإثبات</p><p>3. لو الطلب ناقص هتتخطر لتستوفيه خلال 15 يوم</p><p>4. استلم الرقم الضريبي والبطاقة الضريبية</p><h3>💰 الرسوم</h3><p>غير المكلفين تحت حد التسجيل: رسم سنوي بحد أقصى 500 جنيه (المحدد فعليًا 325 جنيه) وبيقف عند بلوغ الحد</p><h3>⏰ مهم!</h3><p>• صلاحية البطاقة الضريبية 5 سنين</p><p>• لو ما سجلتش، المأمورية ممكن تسجّلك من تلقاء نفسها وتخطورك خلال 5 أيام عمل — والتقصير مش بيسقط المسؤولية</p><h3>📞 القنوات والاستفسار</h3><p>المنظومة الإلكترونية والمكاتب الأمامية والمأمورية المختصة — الخط الساخن 16395</p>`},
  {id:3,icon:'🪪',cat:'أحوال مدنية',title:'إزاي تتجدد بطاقتك الشخصية؟',excerpt:'تجديد البطاقة الشخصية في 5 خطوات بسيطة',readTime:'4 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>التقدم أونلاين بالكامل من بوابة مصر الرقمية أو بوابة الأحوال المدنية</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>اكتب بياناتك وارفع المستندات المطلوبة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>ادفع الرسوم: عادية 50ج (15 يوم) — عاجلة 125ج (3 أيام) — خاصة 175ج (24 ساعة) — VIP إكسبريس </span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>الاستلام بريد سريع للمنزل أو من السجل المدني</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ البطاقة القديمة</div><div class='doc-item'>✅ إثبات العنوان الجديد (لو غيرت سكنك)</div><div class='doc-item'>✅ مستند من جهة العمل لو مر أكتر من 7 سنين على البطاقة السابقة (التق</div></div></div><a href='https://digigate.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على digigate.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. التقدم أونلاين بالكامل من <a href=\"https://digigate.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> أو <a href=\"https://cso.moi.gov.eg\" target=\"_blank\">بوابة الأحوال المدنية</a></p><p>2. اكتب بياناتك وارفع المستندات المطلوبة</p><p>3. ادفع الرسوم: عادية 50ج (15 يوم) — عاجلة 125ج (3 أيام) — خاصة 175ج (24 ساعة) — VIP إكسبريس 515ج (30 دقيقة)</p><p>4. الاستلام بريد سريع للمنزل أو من السجل المدني</p><h3>📄 المستندات</h3><p>• البطاقة القديمة</p><p>• إثبات العنوان الجديد (لو غيرت سكنك)</p><p>• مستند من جهة العمل لو مر أكتر من 7 سنين على البطاقة السابقة (التقديم وقتها ورقيًا)</p><h3>⏰ إمتى لازم تتجدد؟</h3><p>البطاقة بتتجدد كل 7 سنين، أو لو غيرت عنوانك أو حالتك الاجتماعية</p><h3>💰 الغرامات</h3><p>• 100 جنيه لو اتعاملت ببطاقة منتهية أمام جهة رسمية</p><p>• 50 جنيه لو مجددتش بعد تغيير بياناتك</p><p>• 50 جنيه لو ما حدّثتش البيانات خلال 3 شهور من تغيرها</p>`},
  {id:4,icon:'🛂',cat:'جوازات',title:'إزاي تستخرج جواز السفر؟',excerpt:'دليلك الكامل لاستخراج جواز سفر مصري جديد',readTime:'6 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>قدّم طلبك من دليل خدمات الجوازات الإلكتروني enationality.moi.gov.eg أو احجز موعد من egpass</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>املا نموذج 29 جوازات (مجاني) وسجّل البيانات وخد البصمة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>ادفع الرسوم</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>الاستلام: عادي 3-15 يوم عمل — مستعجل 48 ساعة — عاجل نفس اليوم</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>الرسم الأساسي</span><span>500ج</span></div><div class='fee-item'><span>عادي</span><span>~1200-1400ج</span></div><div class='fee-item'><span>مستعجل</span><span>~1725ج</span></div><div class='fee-item'><span>VIP</span><span>~2950ج</span></div><div class='fee-item'><span>تالف</span><span>~1510ج</span></div><div class='fee-item'><span>رسم أساسي مضاعف</span><span>1000ج</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ بطاقة الرقم القومي سارية</div><div class='doc-item'>✅ 4 صور 4×6 بخلفية بيضاء</div><div class='doc-item'>✅ موقف التجنيد للذكور</div><div class='doc-item'>✅ وثيقة الزواج أو الطلاق للإناث</div><div class='doc-item'>✅ قيد دراسي للطلاب</div></div></div><a href='https://enationality.moi.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على enationality.moi.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. قدّم طلبك من دليل خدمات الجوازات الإلكتروني <a href=\"https://enationality.moi.gov.eg\" target=\"_blank\">enationality.moi.gov.eg</a> أو احجز موعد من <a href=\"https://egpassport.gov.eg\" target=\"_blank\">egpassport.gov.eg</a> وروح لمكتب الجوازات</p><p>2. املا نموذج 29 جوازات (مجاني) وسجّل البيانات وخد البصمة</p><p>3. ادفع الرسوم</p><p>4. الاستلام: عادي 3-15 يوم عمل — مستعجل 48 ساعة — عاجل نفس اليوم</p><h3>💰 الرسوم (قرار وزير الداخلية 1104/2025 من 1/7/2025)</h3><p>• الرسم الأساسي 500 جنيه</p><p>• الإجمالي الفعلي: عادي ~1200-1400 جنيه — مستعجل ~1725 جنيه — VIP ~2950 جنيه</p><p>• بدل فاقد/تالف ~1510 جنيه (رسم أساسي مضاعف 1000 جنيه)</p><h3>📄 المستندات (فوق 16 سنة)</h3><p>• بطاقة الرقم القومي سارية</p><p>• 4 صور 4×6 بخلفية بيضاء</p><p>• موقف التجنيد للذكور</p><p>• وثيقة الزواج أو الطلاق للإناث</p><p>• قيد دراسي للطلاب</p><h3>🧸 للأطفال دون 16 سنة</h3><p>شهادة ميلاد مميكنة + جوازا الوالدين + قيد عقد الزواج + حضور أحد الوالدين</p><h3>⏰ صلاحية الجواز</h3><p>7 سنين — ومفيش مرافقين بيتضافوا عليه</p>`},
  {id:5,icon:'📋',cat:'أحوال مدنية',title:'إزاي تطلب شهادة ميلاد؟',excerpt:'استخراج شهادة ميلاد لنفسك أو لأطفالك',readTime:'3 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>من مكتب السجل المدني: اكتب نموذج 40 (طلب صورة وثيقة رسمية)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>أو أونلاين من بوابة مصر الرقمية (شرط: يوجد شهادة مميكنة مطبوعة سابقًا)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>أو من الماكينات الذكية (العباسية، مطار القاهرة، شرم الشيخ، الغردقة) ومكاتب البريد</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>الاستلام: من السجل نفس اليوم، أو بالبريد خلال 3-10 أيام عمل</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>نسخة مكررة</span><span>25ج</span></div><div class='fee-item'><span>ماكينة ذكية</span><span>50ج</span></div><div class='fee-item'><span>البريد</span><span>55ج</span></div><div class='fee-item'><span>أونلاين</span><span>65ج</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ الرقم القومي لصاحب الشأن أو للمولود</div><div class='doc-item'>✅ بطاقة رقم قومي سارية لمقدم الطلب</div></div></div><a href='https://digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على digital.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. من مكتب السجل المدني: اكتب نموذج 40 (طلب صورة وثيقة رسمية)</p><p>2. أو أونلاين من <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> (شرط: يوجد شهادة مميكنة مطبوعة سابقًا)</p><p>3. أو من الماكينات الذكية (العباسية، مطار القاهرة، شرم الشيخ، الغردقة) ومكاتب البريد</p><p>4. الاستلام: من السجل نفس اليوم، أو بالبريد خلال 3-10 أيام عمل</p><h3>💰 الرسوم الرسمية</h3><p>• أول مرة (مميكنة): 45 جنيه — نسخة مكررة: 25 جنيه</p><p>• ماكينة ذكية: 50 جنيه</p><p>• البريد: 55 جنيه (استلام من المكتب) / 65 جنيه (توصيل للمنزل)</p><p>• أونلاين: 65 جنيه أول مرة + 60 جنيه لكل نسخة إضافية</p><h3>📄 المستندات</h3><p>• الرقم القومي لصاحب الشأن أو للمولود</p><p>• بطاقة رقم قومي سارية لمقدم الطلب</p><h3>👥 مين له يطلبها؟</h3><p>صاحب الشأن، الأب، الأم، الأخ/الأخت، الزوج/الزوجة، الأبناء، الجد/الجدة، العم، الخال</p><h3>⏰ قيد المواليد</h3><p>سجّل المولود خلال 15 يوم من الولادة في مكتب الصحة — والمواليد في الخارج خلال 3 شهور من القنصلية المصرية</p>`},
  {id:6,icon:'🛂',cat:'جوازات',title:'إزاي تتجدد جواز السفر؟',excerpt:'تجديد الجواز قبل انتهاءه — الخطوات والمستندات',readTime:'5 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>التقديم من دليل خدمات الجوازات الإلكتروني enationality.moi.gov.eg أو حجز موعد من egpasspor</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>روح لمكتب الجوازات في الموعد وسلّم الجواز القديم</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>املا نموذج 29 جوازات (مجاني) وسجّل البيانات الجديدة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>ادفع الرسوم: الرسم الأساسي 500 جنيه — الإجمالي الفعلي: عادي ~1200-1400 جنيه / مستعجل ~1725</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>5</span><span class='step-text'>الاستلام: عادي 3-15 يوم عمل — مستعجل 48 ساعة — عاجل نفس اليوم</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ الجواز القديم</div><div class='doc-item'>✅ بطاقة الرقم القومي سارية</div><div class='doc-item'>✅ 4 صور 4×6 بخلفية بيضاء</div><div class='doc-item'>✅ موقف التجنيد للذكور — ووثيقة الزواج/الطلاق للإناث</div></div></div><a href='https://enationality.moi.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على enationality.moi.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. التقديم من دليل خدمات الجوازات الإلكتروني <a href=\"https://enationality.moi.gov.eg\" target=\"_blank\">enationality.moi.gov.eg</a> أو حجز موعد من <a href=\"https://egpassport.gov.eg\" target=\"_blank\">egpassport.gov.eg</a></p><p>2. روح لمكتب الجوازات في الموعد وسلّم الجواز القديم</p><p>3. املا نموذج 29 جوازات (مجاني) وسجّل البيانات الجديدة</p><p>4. ادفع الرسوم: الرسم الأساسي 500 جنيه — الإجمالي الفعلي: عادي ~1200-1400 جنيه / مستعجل ~1725 جنيه</p><p>5. الاستلام: عادي 3-15 يوم عمل — مستعجل 48 ساعة — عاجل نفس اليوم</p><h3>📄 المستندات</h3><p>• الجواز القديم</p><p>• بطاقة الرقم القومي سارية</p><p>• 4 صور 4×6 بخلفية بيضاء</p><p>• موقف التجنيد للذكور — ووثيقة الزواج/الطلاق للإناث</p><h3>⏰ مهم!</h3><p>• الجواز صلاحيته 7 سنين</p><p>• لو البطاقة منتهية: فيه جواز مؤقت صلاحيته 3 سنين</p><h3>🌍 من الخارج</h3><p>التجديد عبر القنصليات المصرية والمدة أطول (6-8 أسابيع)</p>`},
  {id:7,icon:'👴',cat:'تأمينات',title:'إزاي تطلع المعاش؟',excerpt:'دليلك لاستخراج معاش التأمينات الاجتماعية',readTime:'8 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>قدّم طلب الصرف من محطة الصرف التابعة لسكنك (مكتب البريد أو البنك حسب المحافظة)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>اطلع إخطار استحقاق المعاش من الهيئة القومية للتأمين الاجتماعي بعد مراجعة مدد الاشتراك</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>سجّل عنوانك ورقم موبايلك للتوصيل الإلكتروني أو الدفع بالماكينة</span></div></div></div><a href='https://www.si.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على si.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. قدّم طلب الصرف من محطة الصرف التابعة لسكنك (مكتب البريد أو البنك حسب المحافظة)</p><p>2. اطلع إخطار استحقاق المعاش من الهيئة القومية للتأمين الاجتماعي بعد مراجعة مدد الاشتراك</p><p>3. سجّل عنوانك ورقم موبايلك للتوصيل الإلكتروني أو الدفع بالماكينة</p><h3>⏰ المواعيد</h3><p>• سن المعاش القانوني بالقانون 148/2019</p><p>• المعاش المبكر من سن 55 بخصم 4.5% لكل سنة نقص ومؤهل بعد 300 شهر اشتراك</p><p>• أقصى أجر اشتراك 14,500 جنيه شهريًا</p><h3>💡 نصيحة</h3><p>• استعلام الموقف التأميني أونلاين من <a href=\"https://www.si.gov.eg\" target=\"_blank\">si.gov.eg</a> أو الخط الساخن 16163</p><p>• المعاش بيتصرف من أول الشهر التالي لاستحقاقه</p>`},
  {id:8,icon:'🤱',cat:'أحوال مدنية',title:'إزاي تسجّل مولود جديد؟',excerpt:'خطوات تسجيل المواليد الجدد واستخراج شهادة الميلاد',readTime:'4 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>خد إخطار الولادة من المستشفى أو الطبيب</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>بلّغ عن المولود لمكتب الصحة خلال 15 يوم من الولادة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>قيّد المولود في السجل المدني واستلم شهادة الميلاد المميكنة (أول مرة 45 جنيه)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>النسخ الإضافية: نموذج 40 من السجل المدني (مكررة 25 جنيه) أو أونلاين من بوابة مصر الرقمية (</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ إخطار الولادة من المستشفى/مكتب الصحة</div><div class='doc-item'>✅ بطاقة الرقم القومي للأب والأم</div><div class='doc-item'>✅ عقد الزواج</div></div></div><a href='https://digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على digital.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. خد إخطار الولادة من المستشفى أو الطبيب</p><p>2. بلّغ عن المولود لمكتب الصحة خلال 15 يوم من الولادة</p><p>3. قيّد المولود في السجل المدني واستلم شهادة الميلاد المميكنة (أول مرة 45 جنيه)</p><p>4. النسخ الإضافية: نموذج 40 من السجل المدني (مكررة 25 جنيه) أو أونلاين من <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> (65 جنيه أول مرة + 60 جنيه لكل نسخة إضافية)</p><h3>📄 المستندات</h3><p>• إخطار الولادة من المستشفى/مكتب الصحة</p><p>• بطاقة الرقم القومي للأب والأم</p><p>• عقد الزواج</p><h3>⏰ مهم!</h3><p>• التبليغ خلال 15 يوم من الولادة (مكتب الصحة)</p><p>• المواليد في الخارج: التسجيل خلال 3 شهور من القنصلية المصرية</p>`},
  {id:9,icon:'🏥',cat:'تأمين صحي',title:'إزاي تسجّل في التأمين الصحي؟',excerpt:'التسجيل في التأمين الصحي للموظفين والعائلة',readTime:'5 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>سجّل بيانات أسرتك التأمينية أونلاين من بوابة مصر الرقمية — اختار المحافظة حسب البطاقة واحف</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>بعد 48 ساعة روح لوحدة الرعاية الأولية لسداد الاشتراك واستلام الكارت برقم الملف العائلي</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>اعمل الفحص المبدئي وافتح الملف العائلي</span></div></div></div><a href='https://digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على digital.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. سجّل بيانات أسرتك التأمينية أونلاين من <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> — اختار المحافظة حسب البطاقة واحفظ</p><p>2. بعد 48 ساعة روح لوحدة الرعاية الأولية لسداد الاشتراك واستلام الكارت برقم الملف العائلي</p><p>3. اعمل الفحص المبدئي وافتح الملف العائلي</p><h3>👥 مين بيسجل إزاي؟</h3><p>• غير الخاضعين للتأمينات: من مكتب خدمة العملاء لبيانات الدخل والسداد الذاتي</p><p>• الغير قادرين: الدولة بتسدد عنهم</p><h3>📍 المحافظات المتاحة</h3><p>• المرحلة الأولى: بورسعيد، الأقصر، الإسماعيلية، جنوب سيناء، السويس، أسوان</p><p>• المرحلة الثانية: دمياط، كفر الشيخ، المنيا، مطروح، شمال سيناء</p><h3>💡 المميزات</h3><p>تغطية من الولادة للوفاة + مساهمات رمزية على الأدوية والأشعة والتحاليل (والمعفيون منها: الغير قادرين وأصحاب الأمراض المزمنة والأورام)</p><h3>🔄 خدمات تانية</h3><p>• إضافة مولود: شهادة ميلاد مميكنة + أصل كارت الأسرة</p><p>• النقل بين المحافظات: إفادة إغلاق الملف السابق</p>`},
  {id:10,icon:'💼',cat:'شركات',title:'إزاي تفتح مشروعك الخاص؟',excerpt:'خطوات تسجيل مشروع صغير أو متوسط في مصر',readTime:'7 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>اختار شكل المشروع (شركة أشخاص أو أموال أو مكتب/منشأة فردية)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>حجز الاسم وإعداد عقد التأسيس والموافقات الأمنية والبنكية (تقديم إلكتروني بالكامل عبر gafi.</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>سجل الشركة في السجل التجاري واستخرج البطاقة الضريبية</span></div></div></div><a href='https://www.gafi.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على gafi.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. اختار شكل المشروع (شركة أشخاص أو أموال أو مكتب/منشأة فردية)</p><p>2. حجز الاسم وإعداد عقد التأسيس والموافقات الأمنية والبنكية (تقديم إلكتروني بالكامل عبر <a href=\"https://www.gafi.gov.eg\" target=\"_blank\">gafi.gov.eg</a>)</p><p>3. سجل الشركة في السجل التجاري واستخرج البطاقة الضريبية</p><h3>💰 التكاليف</h3><p>رسوم التأسيس والسجل التجاري حسب شكل الشركة ونشاطها</p><h3>⏰ مهم!</h3><p>• تأسيس الشركات تقديمه إلكتروني بالكامل عبر بوابة جهاز الاستثمار (GAFI)</p><p>• الموافقات المسبقة لبعض الأنشطة (استيراد/تصدير/صحة) قبل التسجيل</p>`},
  {id:11,icon:'📄',cat:'أحوال مدنية',title:'إزاي تستخرج صحيفة حالة جنائية؟',excerpt:'دليلك لاستخراج صحيفة الحالة الجنائية أونلاين',readTime:'4 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>ادخل بوابة الأدلة الجنائية (أو دليل خدمات موقع الداخلية ← الأدلة الجنائية)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>اختار «إصدار صحيفة الحالة الجنائية المميكنة» وسجّل الدخول أو اعمل حساب جديد</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>املأ بياناتك (القومي — الاسم — العنوان) واضغط «تسجيل الطلب»</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>ادفع الرسوم إلكترونيًا (بطاقة أو فوري أو محفظة)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>5</span><span class='step-text'>التنفيذ خلال 72 ساعة والاستلام من مندوب البريد بعد التحقق من بطاقتك</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>عادي</span><span>~75ج</span></div><div class='fee-item'><span>مستعجل</span><span>100-150ج</span></div><div class='fee-item'><span>أونلاين</span><span>~50ج</span></div><div class='fee-item'><span>توصيل بريد</span><span>40-60ج</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ صورة شخصية حديثة 4×6</div><div class='doc-item'>✅ بطاقة الرقم القومي (أو جواز سفر ساري — شهادة ميلاد لمن دون 15 سنة</div></div></div><a href='https://ecriminal.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على ecriminal.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات (أونلاين)</h3><p>1. ادخل <a href=\"https://ecriminal.gov.eg\" target=\"_blank\">بوابة الأدلة الجنائية</a> (أو دليل خدمات <a href=\"https://moi.gov.eg\" target=\"_blank\">موقع الداخلية</a> ← الأدلة الجنائية)</p><p>2. اختار «إصدار صحيفة الحالة الجنائية المميكنة» وسجّل الدخول أو اعمل حساب جديد</p><p>3. املأ بياناتك (القومي — الاسم — العنوان) واضغط «تسجيل الطلب»</p><p>4. ادفع الرسوم إلكترونيًا (بطاقة أو فوري أو محفظة)</p><p>5. التنفيذ خلال 72 ساعة والاستلام من مندوب البريد بعد التحقق من بطاقتك</p><h3>📄 المستندات</h3><p>• صورة شخصية حديثة 4×6</p><p>• بطاقة الرقم القومي (أو جواز سفر ساري — شهادة ميلاد لمن دون 15 سنة — بطاقة إقامة للأجانب)</p><h3>💰 الرسوم</h3><p>• عادي ~75ج (استلام 4-5 أيام) — مستعجل 100-150ج (24-72 ساعة وممكن نفس اليوم في مكاتب الأقسام) — أونلاين ~50ج + توصيل بريد 40-60ج</p><h3>⏰ مهم</h3><p>• لازم تكون بصماتك العشرية مسجلة بالأحوال المدنية</p><p>• التقديم والاستلام شخصيين — الفيش موجه لجهة واحدة فقط — وصلاحيته 3 شهور من الإصدار</p><h3>💡 نصيحة</h3><p>احتفظ برقم الطلب بعد الدفع لتتبعه أونلاين</p>`},
  {id:12,icon:'🏠',cat:'أحوال مدنية',title:'إزاي تنقل قيدك لمحافظة تانية؟',excerpt:'نقل القيد السكاني بين المحافظات — الخطوات والمستندات',readTime:'5 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>روح لمكتب السجل المدني التابع لإقامتك الجديدة (البطاقة الجديدة بتطلع منه)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>اشتري استمارة بطاقة واملأها بالعنوان الجديد بدقة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>قدّم الاستمارة والمستندات وسدّد الرسوم</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>استلم بطاقتك حسب فئة الاستمارة — وبعض الحالات ممكن تبدأ أونلاين من بوابة الأحوال المدنية ب</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>عادية</span><span>50ج</span></div><div class='fee-item'><span>عاجلة</span><span>125ج</span></div><div class='fee-item'><span>خاصة</span><span>175ج</span></div><div class='fee-item'><span>VIP إكسبريس</span><span>515ج</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ البطاقة الحالية (صورة + الأصل للاطلاع)</div><div class='doc-item'>✅ إثبات العنوان الجديد: عقد تمليك موثق — أو عقد إيجار موثق (مع حضور</div><div class='doc-item'>✅ لو ساكن مع قريب: إقرار منه + بطاقته + ما يثبت القرابة</div><div class='doc-item'>✅ الزوجة لعنوان زوجها: صورة بطاقة الزوج (+ وثيقة الزواج عند بعض الم</div></div></div><a href='https://cso.moi.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على cso.moi.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. روح لمكتب السجل المدني التابع لإقامتك الجديدة (البطاقة الجديدة بتطلع منه)</p><p>2. اشتري استمارة بطاقة واملأها بالعنوان الجديد بدقة</p><p>3. قدّم الاستمارة والمستندات وسدّد الرسوم</p><p>4. استلم بطاقتك حسب فئة الاستمارة — وبعض الحالات ممكن تبدأ أونلاين من <a href=\"https://cso.moi.gov.eg\" target=\"_blank\">بوابة الأحوال المدنية</a> بس التوقيع غالبًا حضوري</p><h3>📄 المستندات</h3><p>• البطاقة الحالية (صورة + الأصل للاطلاع)</p><p>• إثبات العنوان الجديد: عقد تمليك موثق — أو عقد إيجار موثق (مع حضور المؤجر للتصديق) — أو إيصال مرافق حديث (كهرباء/مياه/غاز/تليفون) باسمك</p><p>• لو ساكن مع قريب: إقرار منه + بطاقته + ما يثبت القرابة</p><p>• الزوجة لعنوان زوجها: صورة بطاقة الزوج (+ وثيقة الزواج عند بعض المكاتب)</p><h3>💰 الرسوم</h3><p>نفس فئات استمارات البطاقة: عادية 50ج (15 يوم) — عاجلة 125ج (3 أيام) — خاصة 175ج (24 ساعة) — VIP إكسبريس 515ج (30 دقيقة)</p><h3>⏰ مهم</h3><p>قانون الأحوال المدنية 143/1994 (م.48) بيديك 3 شهور بس لتحديث بياناتك بعد تغيير سكنك — بعدها غرامة 50ج</p><h3>💡 نصيحة</h3><p>بعد نقل قيدك افتكر تنقل بطاقة التموين من <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> عشان تفضل تصرف من محافظتك الجديدة</p>`},
  {id:13,icon:'🚙',cat:'مرور',title:'إزاي تستخرج رخصة قيادة جديدة؟',excerpt:'دليل شامل لاستخراج رخصة قيادة لأول مرة',readTime:'8 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>افتح ملف رخصة القيادة في وحدة المرور</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>اعمل الكشف الطبي (نظر وباطنة وفصيلة الدم) وتحليل المخدرات من جهة معتمدة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>عدّي الاختبار النظري للإشارات</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>عدّي الاختبار العملي</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>5</span><span class='step-text'>سدد الرسوم — والاستلام خلال 10-14 يوم عمل</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ بطاقة الرقم القومي</div><div class='doc-item'>✅ المؤهل الدراسي أو إفادة القيد</div><div class='doc-item'>✅ 4 صور 4×6</div><div class='doc-item'>✅ نموذج 256</div><div class='doc-item'>✅ شهادة طبية (نظر/باطنة/فصيلة دم)</div></div></div></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. افتح ملف رخصة القيادة في وحدة المرور</p><p>2. اعمل الكشف الطبي (نظر وباطنة وفصيلة الدم) وتحليل المخدرات من جهة معتمدة</p><p>3. عدّي الاختبار النظري للإشارات</p><p>4. عدّي الاختبار العملي</p><p>5. سدد الرسوم — والاستلام خلال 10-14 يوم عمل</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي</p><p>• المؤهل الدراسي أو إفادة القيد</p><p>• 4 صور 4×6</p><p>• نموذج 256</p><p>• شهادة طبية (نظر/باطنة/فصيلة دم)</p><p>• تحليل مخدرات معتمد</p><h3>💰 التكلفة</h3><p>1140-1500 جنيه إجمالية</p><h3>⏰ السن والصلاحية</h3><p>• الرخصة الخاصة: من 18 سنة — صلاحيتها 10 سنين</p><p>• الرخصة المهنية: من 21 سنة — بصلاحية أقصر</p>`},
  {id:14,icon:'⚖️',cat:'شهر عقاري',title:'إزاي تسجّل عقد في الشهر العقاري؟',excerpt:'توثيق العقود في الشهر العقاري — دليل كامل',readTime:'6 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>عقد بيع عقار: الرسم الأساسي من 500 جنيه (حتى 3900 جنيه لمساحة أقل من 300م) — المدة القصوى </span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>رهن عقاري: لا ينعقد الرهن الرسمي إلا بورقة رسمية + القيد بالمأمورية المختصة + الرسوم على ق</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>عقد إيجار: رسوم 20 جنيه + رسم نسبي 0.5% (بحد أدنى 10 جنيه) — والتوثيق خلال 24 ساعة</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ عقد البيع: رفع مساحي معتمد + رخصة + سند الملكية</div><div class='doc-item'>✅ عقد الإيجار: أصل العقد + بطاقتان ساريتان + حضور الطرفين</div></div></div><a href='https://digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على digital.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 إيه اللي بيسجل عندك؟</h3><p>• عقد بيع عقار: الرسم الأساسي من 500 جنيه (حتى 3900 جنيه لمساحة أقل من 300م) — المدة القصوى 37 يوم — ورسالة SMS بموقف الطلب خلال 24 ساعة</p><p>• رهن عقاري: لا ينعقد الرهن الرسمي إلا بورقة رسمية + القيد بالمأمورية المختصة + الرسوم على قيمة الدين — وفك الرهن بمخالصة موثقة</p><p>• عقد إيجار: رسوم 20 جنيه + رسم نسبي 0.5% (بحد أدنى 10 جنيه) — والتوثيق خلال 24 ساعة</p><h3>📄 المستندات</h3><p>• عقد البيع: رفع مساحي معتمد + رخصة + سند الملكية</p><p>• عقد الإيجار: أصل العقد + بطاقتان ساريتان + حضور الطرفين</p><h3>💡 نصيحة</h3><p>• حجز المعاد للتوثيق متاح عبر <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a></p><p>• في سيارة توثيق متنقلة بـ500 جنيه على الرقم 01555559875</p>`},
  {id:15,icon:'📱',cat:'خدمات عامة',title:'إزاي تسجّل في منصة مصر الرقمية؟',excerpt:'البوابة الوطنية للخدمات الحكومية — دليل التسجيل الكامل',readTime:'5 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>ادخل على digital.gov.eg ودوس «إنشاء حساب جديد»</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>اكتب الرقم القومي + رقم المصنع المدوّن على البطاقة + الاسم الأول لأمك واضغط «تحقق» (لو عند</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>اكتب رقم موبايلك المسجل باسمك — هيوصلك كود SMS من 6 أرقام</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>اكتب الكود واضغط «التالي»</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>5</span><span class='step-text'>اعمل كلمة سر قوية (حروف إنجليزية كبيرة وصغيرة + أرقام) — والبريد الإلكتروني اختياري</span></div></div></div><a href='https://digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على digital.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. ادخل على <a href=\"https://digital.gov.eg\" target=\"_blank\">digital.gov.eg</a> ودوس «إنشاء حساب جديد»</p><p>2. اكتب الرقم القومي + رقم المصنع المدوّن على البطاقة + الاسم الأول لأمك واضغط «تحقق» (لو عندك أكتر من بطاقة من التجديد استخدم رقم المصنع في الأحدث)</p><p>3. اكتب رقم موبايلك المسجل باسمك — هيوصلك كود SMS من 6 أرقام</p><p>4. اكتب الكود واضغط «التالي»</p><p>5. اعمل كلمة سر قوية (حروف إنجليزية كبيرة وصغيرة + أرقام) — والبريد الإلكتروني اختياري</p><p>6. سجّل دخولك بعد كده بالموبايل أو الرقم القومي وكلمة السر</p><h3>⚠️ الشروط</h3><p>• موبايل مسجل باسمك شخصيًا (بيستقبل كود التفعيل)</p><p>• بياناتك متطابقة مع بطاقة الرقم القومي — خاصة الاسم الأول لأمك</p><h3>🛠️ أشهر الخدمات</h3><p>التموين (استعلام وبدل فاقد ونقل بين المحافظات) — المرور (تجديد الرخصة والمخالفات) — الأحوال المدنية (شهادات ميلاد ووفاة وقيد عائلي) — التوثيق والشهر العقاري — القضايا والمحاكم — التأمينات — الضرائب العقارية — السجل التجاري</p><h3>💡 نصيحة</h3><p>نزّل تطبيق «مصر الرقمية» من Google Play أو App Store بنفس حسابك — إشعارات فورية لطلباتك وسداد إلكتروني</p>`},
  {id:16,icon:'🔁',cat:'أحوال مدنية',title:'إزاي تطلب بدل فاقد لبطاقتك؟',excerpt:'استخراج بدل فاقد لبطاقة الرقم القومي المفقودة أو التالفة',readTime:'4 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>حرّر محضر فقد من قسم الشرطة أولاً (البطاقة التالفة مش محتاجة محضر)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>قدّم طلب بدل فاقد/تالف أونلاين من بوابة مصر الرقمية أو حضوريًا من السجل المدني</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>ادفع الرسوم — نفس فئات الاستمارات: عادية 50ج (15 يوم) — عاجلة 125ج (3 أيام) — خاصة 175ج (2</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>الاستلام من السجل أو بالبريد السريع</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ محضر الفقد من قسم الشرطة</div><div class='doc-item'>✅ البطاقة التالفة (في حالة التلف)</div><div class='doc-item'>✅ صورة شخصية حديثة</div></div></div><a href='https://digigate.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على digigate.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. حرّر محضر فقد من قسم الشرطة أولاً (البطاقة التالفة مش محتاجة محضر)</p><p>2. قدّم طلب بدل فاقد/تالف أونلاين من <a href=\"https://digigate.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> أو حضوريًا من السجل المدني</p><p>3. ادفع الرسوم — نفس فئات الاستمارات: عادية 50ج (15 يوم) — عاجلة 125ج (3 أيام) — خاصة 175ج (24 ساعة) — VIP إكسبريس 515ج (30 دقيقة)</p><p>4. الاستلام من السجل أو بالبريد السريع</p><h3>📄 المستندات</h3><p>• محضر الفقد من قسم الشرطة</p><p>• البطاقة التالفة (في حالة التلف)</p><p>• صورة شخصية حديثة</p><h3>⏰ مهم!</h3><p>غرامة 50 جنيه لو اتأخرت أكتر من 15 يوم من تاريخ المحضر</p><h3>💡 نصيحة</h3><p>لو سرقولك البطاقة، المحضر بيساعدك تتجنب أي مسؤولية عن إساءة استخدامها</p>`},
  {id:17,icon:'🕊️',cat:'أحوال مدنية',title:'إزاي تستخرج شهادة وفاة؟',excerpt:'استخراج شهادة وفاة لأي قريب — الخطوات والمستندات',readTime:'3 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>بلّغ عن الوفاة خلال 24 ساعة لمكتب الصحة + استلم تصريح الدفن</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>الشهادة الأولى بتستلم من مكتب الصحة فقط</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>النسخ المميكنة (نموذج 40) من السجل المدني بـ25 جنيه</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>أو أونلاين من بوابة مصر الرقمية (شرط: شهادة مميكنة مطبوعة سابقًا + قريب درجة أولى)</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>الشهادة المميكنة</span><span>25ج</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ تصريح الدفن من المستشفى أو مكتب الصحة</div><div class='doc-item'>✅ بطاقة الرقم القومي للمتوفي (لو متاحة)</div><div class='doc-item'>✅ بطاقة الرقم القومي لمقدم الطلب (قريب درجة أولى)</div></div></div><a href='https://digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على digital.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. بلّغ عن الوفاة خلال 24 ساعة لمكتب الصحة + استلم تصريح الدفن</p><p>2. الشهادة الأولى بتستلم من مكتب الصحة فقط</p><p>3. النسخ المميكنة (نموذج 40) من السجل المدني بـ25 جنيه</p><p>4. أو أونلاين من <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> (شرط: شهادة مميكنة مطبوعة سابقًا + قريب درجة أولى)</p><h3>📄 المستندات</h3><p>• تصريح الدفن من المستشفى أو مكتب الصحة</p><p>• بطاقة الرقم القومي للمتوفي (لو متاحة)</p><p>• بطاقة الرقم القومي لمقدم الطلب (قريب درجة أولى)</p><h3>💰 الرسوم</h3><p>الشهادة المميكنة: 25 جنيه</p><h3>⏰ مهم!</h3><p>التبليغ خلال 24 ساعة — والشهادة المترجمة للاستخدام في الخارج بتاخد 3-5 أيام عمل</p>`},
  {id:18,icon:'💍',cat:'أحوال مدنية',title:'إزاي تسجّل عقد زواج؟',excerpt:'توثيق عقد الزواج في مصر — الخطوات الكاملة',readTime:'5 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>روح لمكتب توثيق الزواج (المأذون) — الزوجين حاضرين شخصيًا مع شاهدين</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>اكتب عقد الزواج ووقّع الطرفان والشهود</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>ادفع الرسوم (600 جنيه + نسبة من المؤخر لو موجود)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>استلم وثيقة الزواج الرسمية</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>بدون مؤخر</span><span>600ج</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ بطاقة الرقم القومي للزوجين</div><div class='doc-item'>✅ شهادة ميلاد الزوجين</div><div class='doc-item'>✅ شهادة الطب الشرعي (لكلا الطرفين)</div><div class='doc-item'>✅ شاهدان ذكران</div></div></div></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. روح لمكتب توثيق الزواج (المأذون) — الزوجين حاضرين شخصيًا مع شاهدين</p><p>2. اكتب عقد الزواج ووقّع الطرفان والشهود</p><p>3. ادفع الرسوم (600 جنيه + نسبة من المؤخر لو موجود)</p><p>4. استلم وثيقة الزواج الرسمية</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي للزوجين</p><p>• شهادة ميلاد الزوجين</p><p>• شهادة الطب الشرعي (لكلا الطرفين)</p><p>• شاهدان ذكران</p><h3>💰 المصاريف</h3><p>بدون مؤخر: 600 جنيه | مؤخر أقل من 5000: 600 + 3% | أقل من 10000: 600 + 4% | أكبر: 600 + 5% | طلاق حضوري/مراجعة: 600 | طلاق غيابي: 800</p><h3>📤 عايز نسخة من وثيقة قديمة؟</h3><p>قسيمة الزواج الإلكترونية 70 جنيه (تصدر خلال 7 أيام عمل) — أو من السجل المدني نفس اليوم/24 ساعة — متاح لمن أُطبعت وثيقته بعد أبريل 1962</p>`},
  {id:19,icon:'🚗',cat:'مرور',title:'إزاي تنقل ملكية سيارة؟',excerpt:'نقل ملكية سيارة بين الأفراد — دليل كامل',readTime:'6 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>اتفق مع المشتري على السعر واطلب شهادة بيانات السيارة (فحص فني + حصر مخالفات من وحدة المرور</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>امضوا عقد البيع وإقرار البيع من وحدة المرور</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>سدد رسوم النقل (فحص فني + نموذج 24 + إقرار بيع + لجان فحص إن وجدت)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>استخرج رخصة جديدة باسم المشتري ولوحات جديدة</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>لوحات معدنية جديدة</span><span>~350ج</span></div></div></div></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. اتفق مع المشتري على السعر واطلب شهادة بيانات السيارة (فحص فني + حصر مخالفات من وحدة المرور)</p><p>2. امضوا عقد البيع وإقرار البيع من وحدة المرور</p><p>3. سدد رسوم النقل (فحص فني + نموذج 24 + إقرار بيع + لجان فحص إن وجدت)</p><p>4. استخرج رخصة جديدة باسم المشتري ولوحات جديدة</p><h3>💰 الرسوم</h3><p>• رسوم الفحص الفني ونموذج 24 حسب نوع السيارة</p><p>• لوحات معدنية جديدة ~350 جنيه</p><h3>⏰ مهم!</h3><p>• النقل لازم يتم في وحدة المرور المختصة قبل تحرير أي مخالفات</p><p>• المطلوب: البطاقتان + شهادة بيانات السيارة + شهادة المخالفات + عقد البيع وإقرار البيع</p>`},
  {id:20,icon:'🏪',cat:'شركات',title:'إزاي تستخرج رخصة تجارية؟',excerpt:'استخراج رخصة مزاولة نشاط تجاري في مصر',readTime:'6 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>جهّز عقد إيجار المقر موثق (أو مثبت التاريخ) + إيصال مرافق حديث</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>افتح ملف ضريبي في مأمورية الضرائب المختصة أولاً — البطاقة الضريبية بتتصدر مجانًا خلال 3-7 </span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>سجّل في الغرفة التجارية المختصة واستلم شهادة مزاولة النشاط التجاري (رسومها حسب رأس المال)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>قدّم طلب القيد في مكتب السجل التجاري — المكاتب المميكنة بتنجز بنفس اليوم غالبًا، وفيه استخ</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>5</span><span class='step-text'>للشركات: تأسيس إلكتروني كامل عبر gafi.gov.eg — جهاز الاستثمار ينجز عنك تصديق نقابة المحامي</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>إلى</span><span>63ج</span></div><div class='fee-item'><span>خدمات مميزة</span><span>~25ج</span></div><div class='fee-item'><span>من</span><span>~55-75ج</span></div><div class='fee-item'><span>لرأس المال الصغير حتى</span><span>800-2000ج</span></div><div class='fee-item'><span>قدّر ميزانية إجمالية</span><span>200-500ج</span></div></div><div class='fees-total'>إجمالية 200-500 جنيه</div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ بطاقة الرقم القومي (السن 21 سنة على الأقل، وممنوع للموظفين الحكوم</div><div class='doc-item'>✅ عقد إيجار موثق/مثبت التاريخ + إيصال مرافق باسمك</div><div class='doc-item'>✅ شهادة مزاولة النشاط من الغرفة التجارية</div><div class='doc-item'>✅ البطاقة الضريبية</div></div></div><a href='https://eta.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على eta.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. جهّز عقد إيجار المقر موثق (أو مثبت التاريخ) + إيصال مرافق حديث</p><p>2. افتح ملف ضريبي في مأمورية الضرائب المختصة أولاً — البطاقة الضريبية بتتصدر مجانًا خلال 3-7 أيام، والتسجيل متاح عبر <a href="https://eta.gov.eg" target="_blank">eta.gov.eg</a></p><p>3. سجّل في الغرفة التجارية المختصة واستلم شهادة مزاولة النشاط التجاري (رسومها حسب رأس المال)</p><p>4. قدّم طلب القيد في مكتب السجل التجاري — المكاتب المميكنة بتنجز بنفس اليوم غالبًا، وفيه استخراج وتجديد واستعلام أونلاين عبر <a href="https://itda.gov.eg" target="_blank">itda.gov.eg</a> وبوابة مصر الرقمية</p><p>5. للشركات: تأسيس إلكتروني كامل عبر <a href="https://gafi.gov.eg" target="_blank">gafi.gov.eg</a> — جهاز الاستثمار ينجز عنك تصديق نقابة المحامين والقيد بالسجل والبطاقة الضريبية والملف التأميني</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي (السن 21 سنة على الأقل، وممنوع للموظفين الحكوميين)</p><p>• عقد إيجار موثق/مثبت التاريخ + إيصال مرافق باسمك</p><p>• شهادة مزاولة النشاط من الغرفة التجارية</p><p>• البطاقة الضريبية</p><h3>💰 الرسوم</h3><p>رسوم السجل الحكومية المباشرة للفرد من ~9.5 إلى 63 جنيه + خدمات مميزة ~25 جنيه، وأكبر بند هو الغرفة التجارية حسب رأس المال: من ~55-75 جنيه لرأس المال الصغير حتى 800-2000 جنيه فأكثر لرأس المال الكبير — قدّر ميزانية إجمالية 200-500 جنيه للقيد الفردي</p><h3>💡 نصيحة</h3><p>السجل صالح 5 سنين (قانون 34/1976) — جدّده قبل الانتهاء بشهر، وفي مهلة سماح 90 يوم برسوم مضاعفة. واتأكد إن المحل بعد القيد فيه التراخيص المطلوبة: صحة، دفاع مدني، بيئة</p>`},
  {id:21,icon:'🌍',cat:'جوازات',title:'إزاي تطلع إقامة لأجنبي؟',excerpt:'استخراج إقامة لغير المصريين في مصر — دليل كامل',readTime:'7 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>سوّي إقامتك خلال 30 يوم من الدخول في مصلحة الجوازات والهجرة والجنسية (وزارة الداخلية)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>حدد نوع الإقامة: سياحية / عمل / دراسة / استثمار / عقار / زواج / مرافقين</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>جهّز مستند السبب: تصريح عمل (بموافقة وزارة القوى العاملة) أو قيد دراسي أو سجل تجاري للاستث</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>قدّم الطلب والمستندات وسدد الرسوم واستلم بطاقة الإقامة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>5</span><span class='step-text'>التجديد متاح أونلاين عبر منصة خدمات الجوازات: رفع مستندات + سداد + متابعة الطلب</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>في الغردقة</span><span>~6875ج</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ جواز سفر ساري + تأشيرة دخول سارية</div><div class='doc-item'>✅ استمارة الطلب + صور شخصية</div><div class='doc-item'>✅ مستند سبب الإقامة حسب النوع</div><div class='doc-item'>✅ عقد إيجار موثق / إثبات سكن + إيصال مرافق</div></div></div></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. سوّي إقامتك خلال 30 يوم من الدخول في مصلحة الجوازات والهجرة والجنسية (وزارة الداخلية)</p><p>2. حدد نوع الإقامة: سياحية / عمل / دراسة / استثمار / عقار / زواج / مرافقين</p><p>3. جهّز مستند السبب: تصريح عمل (بموافقة وزارة القوى العاملة) أو قيد دراسي أو سجل تجاري للاستثمار أو عقد زواج موثق</p><p>4. قدّم الطلب والمستندات وسدد الرسوم واستلم بطاقة الإقامة</p><p>5. التجديد متاح أونلاين عبر منصة خدمات الجوازات: رفع مستندات + سداد + متابعة الطلب</p><h3>📄 المستندات</h3><p>• جواز سفر ساري + تأشيرة دخول سارية</p><p>• استمارة الطلب + صور شخصية</p><p>• مستند سبب الإقامة حسب النوع</p><p>• عقد إيجار موثق / إثبات سكن + إيصال مرافق</p><h3>💰 الرسوم</h3><p>بتختلف حسب النوع والمدة والجنسية ومفيش رقم موحد معلن — مثال موثق: الإقامة السياحية (البلاستيك) في الغردقة ~6875 جنيه لـ6 شهور، وفيه مسار سريع بـ65$ خلال 10 أيام. اسأل عن رسوم حالتك بالظبط قبل التقديم</p><h3>💡 نصيحة</h3><p>جدّد الإقامة قبل انتهائها بوقت كافٍ (شهرين على الأقل) — التأخير بيجيب غرامات وبيحول التجديد لتقنين وضع أبطأ وأغلى</p>`},
  {id:22,icon:'🎓',cat:'نقابات',title:'إزاي تسجّل في نقابتك؟',excerpt:'التسجيل في النقابة المهنية للمهندسين والأطباء والمحامين',readTime:'5 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>حدد نقابتك — أغلب النقابات الكبرى بقت القيد فيها إلكتروني بجزء حضوري بسيط</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>المهندسين: قدّم بنفسك (الحضور الشخصي إلزامي وممنوع التوكيل) بأصل مؤقت التخرج + فيش وتشبيه </span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>الأطباء: سجّل إلكترونيًا عبر register.ems.org.eg في 4 مراحل (بيانات شخصية ← إقامة ← أكاديم</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>أطباء الأسنان: التقديم إلكتروني كامل عبر eds.eg</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>5</span><span class='step-text'>احجز موعد تسليم الأصول واستلم كارت النقابة</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>دمغة هندسية</span><span>10ج</span></div><div class='fee-item'><span>الأطباء</span><span>1660ج</span></div><div class='fee-item'><span>أسنان</span><span>850ج</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ أصل شهادة التخرج (أو مؤقت التخرج) + صورة</div><div class='doc-item'>✅ بطاقة الرقم القومي سارية + صور شخصية</div><div class='doc-item'>✅ فيش وتشبيه باسم النقابة</div><div class='doc-item'>✅ الموقف من التجنيد للذكور — وللخريجين من خارج مصر: معادلة المجلس ا</div></div></div><a href='https://eea.org.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على eea.org.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. حدد نقابتك — أغلب النقابات الكبرى بقت القيد فيها إلكتروني بجزء حضوري بسيط</p><p>2. المهندسين: قدّم بنفسك (الحضور الشخصي إلزامي وممنوع التوكيل) بأصل مؤقت التخرج + فيش وتشبيه باسم النقابة — التفاصيل على <a href="https://eea.org.eg" target="_blank">eea.org.eg</a></p><p>3. الأطباء: سجّل إلكترونيًا عبر <a href="https://register.ems.org.eg" target="_blank">register.ems.org.eg</a> في 4 مراحل (بيانات شخصية ← إقامة ← أكاديمية ← رفع مستندات)</p><p>4. أطباء الأسنان: التقديم إلكتروني كامل عبر <a href="https://eds.eg" target="_blank">eds.eg</a></p><p>5. احجز موعد تسليم الأصول واستلم كارت النقابة</p><h3>📄 المستندات</h3><p>• أصل شهادة التخرج (أو مؤقت التخرج) + صورة</p><p>• بطاقة الرقم القومي سارية + صور شخصية</p><p>• فيش وتشبيه باسم النقابة</p><p>• الموقف من التجنيد للذكور — وللخريجين من خارج مصر: معادلة المجلس الأعلى للجامعات</p><h3>💰 الرسوم</h3><p>المهندسين: دمغة هندسية 10 جنيه (و1000 جنيه رسم لجنة قيد لا يرد لخريجي الخارج) — الأطباء: 1660 جنيه للمصري شاملة رسوم ترخيص مزاولة مهنة الطب (و300$ للأجنبي) — أسنان: 850 جنيه حكومي / 1850 خاص / 38850 أجنبي</p><h3>💡 نصيحة</h3><p>سجّل بعد التخرج مباشرة عشان تتجنب غرامات التأخير، وحقق من موقع نقابتك الرسمي قبل أي زيارة</p>`},
  {id:23,icon:'🏗️',cat:'مباني',title:'إزاي تطلب تصريح بناء؟',excerpt:'استخراج ترخيص بناء من الحي أو المدينة',readTime:'8 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>مرحلة بيان صلاحية الموقع (20 يوم): طلب + بطاقة + كروكي الأرض (بدون عقد مشهر) ← رفع مساحي ب</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>مرحلة الترخيص: طلب + تعاقد مع مهندس/مكتب هندسي معتمد + توكيل رسمي + رسومات هندسية + مستند </span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>تعاقد مهندس إشراف ومقاول ← لجنة فحص وتحديد الرسوم (10 أيام) ← سداد الرسوم ← استلام الترخيص</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ بطاقة الرقم القومي + مستند ملكية الأرض</div><div class='doc-item'>✅ الرسومات الهندسية معتمدة من مهندس/مكتب هندسي</div><div class='doc-item'>✅ بيان صلاحية الموقع + الرفع المساحي</div><div class='doc-item'>✅ عقود الإشراف والتنفيذ + وثيقة التأمين عند اللزوم</div></div></div></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>المرجع: قانون البناء الموحد 119/2008 — والتقديم بقى في المركز التكنولوجي بالوحدة المحلية (8 خطوات بدل 15)</p><p>1. مرحلة بيان صلاحية الموقع (20 يوم): طلب + بطاقة + كروكي الأرض (بدون عقد مشهر) ← رفع مساحي بعد سداد رسومه (15 يوم) ← مراجعة الاشتراطات وإصدار البيان (5 أيام)</p><p>2. مرحلة الترخيص: طلب + تعاقد مع مهندس/مكتب هندسي معتمد + توكيل رسمي + رسومات هندسية + مستند ملكية + وثيقة تأمين لو المبنى محتاجها ← مراجعة الطلب (14 يوم)</p><p>3. تعاقد مهندس إشراف ومقاول ← لجنة فحص وتحديد الرسوم (10 أيام) ← سداد الرسوم ← استلام الترخيص خلال 48 ساعة</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي + مستند ملكية الأرض</p><p>• الرسومات الهندسية معتمدة من مهندس/مكتب هندسي</p><p>• بيان صلاحية الموقع + الرفع المساحي</p><p>• عقود الإشراف والتنفيذ + وثيقة التأمين عند اللزوم</p><h3>💰 الرسوم</h3><p>مفيش رقم موحد معلن — لجنة الفحص بتحدد الرسوم حسب مساحة ونشاط المبنى قبل السداد والاستلام</p><h3>⏰ المدة والارتفاعات</h3><p>الإجمالي ~26 يوم عمل (~40 يوم لو فيه وثيقة تأمين) — الارتفاع: شارع عرضه 6م أو أكثر = أرضي + 3 أدوار (حتى 13م)، وشارع 8م+ = ضعف عرض الشارع، والنشاط التجاري أرضي + أول لشارع 10م+</p><h3>💡 نصيحة</h3><p>في المدن الجديدة التقديم إلكتروني كامل عبر بوابة هيئة المجتمعات العمرانية الجديدة — والرخصة صالحة 3 سنين قابلة للتجديد لمرة واحدة</p>`},
  {id:24,icon:'💰',cat:'ضرائب',title:'إزاي تطلع كشف حساب ضريبي؟',excerpt:'استخراج كشف حساب ضريبي للشركات والأفراد',readTime:'5 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>اعمل حساب على eta.gov.eg وحقق من بريدك الإلكتروني</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>ادخل «مساحة عمل الممول»</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>اربط حسابك بتسجيل ضريبي موجود (بيتطلب تفعيل إعدادات المراسلات: رقم موبايل + كود SMS من 6 أ</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>افتح «خدمات حسابات الممولين» واختار طلب كشف حساب أو شهادة بيانات ممول</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>5</span><span class='step-text'>سدّد الرسوم ببطاقة ائتمانية وانتظر المراجعة — الشهادة بتتصدر إلكترونيًا</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ رقم التسجيل الضريبي (لو مسجل) + بطاقة الرقم القومي</div><div class='doc-item'>✅ موبايل وبريد إلكتروني لتنشيط الحساب</div><div class='doc-item'>✅ تفويض رسمي لو الوكيل (للأشخاص الاعتبارية)</div></div></div><a href='https://eta.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على eta.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. اعمل حساب على <a href="https://eta.gov.eg" target="_blank">eta.gov.eg</a> وحقق من بريدك الإلكتروني</p><p>2. ادخل «مساحة عمل الممول»</p><p>3. اربط حسابك بتسجيل ضريبي موجود (بيتطلب تفعيل إعدادات المراسلات: رقم موبايل + كود SMS من 6 أرقام + تأكيد البريد) أو اعمل «تسجيل ضريبي جديد» (نظام عادي أو مبسط)</p><p>4. افتح «خدمات حسابات الممولين» واختار طلب كشف حساب أو شهادة بيانات ممول</p><p>5. سدّد الرسوم ببطاقة ائتمانية وانتظر المراجعة — الشهادة بتتصدر إلكترونيًا</p><h3>📄 المستندات</h3><p>• رقم التسجيل الضريبي (لو مسجل) + بطاقة الرقم القومي</p><p>• موبايل وبريد إلكتروني لتنشيط الحساب</p><p>• تفويض رسمي لو الوكيل (للأشخاص الاعتبارية)</p><h3>💰 ملاحظة</h3><p>لو لسه مش مسجل: التسجيل إلزامي خلال 30 يوم من مزاولة النشاط (نموذج 1 لشخص طبيعي / نموذج 2 لاعتباري) والرقم بيتصدر خلال 5 أيام عمل</p><h3>💡 نصيحة</h3><p>كشف الحساب بيبين مديونياتك الحقيقية فتتجنب الفوائد والغرامات — والخط الساخن لمصلحة الضرائب 16395</p>`},
  {id:25,icon:'🏭',cat:'شركات',title:'إزاي تسجّل في صندوق تنمية الصناعة؟',excerpt:'التمويل الميسر للمصانع والآلات عبر مبادرة القطاعات الصناعية ذات الأولوية — الهيئة العامة للتنمية الصناعية IDA',readTime:'6 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>اتأكد إن نشاطك ضمن القطاعات ذات الأولوية (9 قطاعات): الأدوية، الهندسية، الغذائية، الغزل وا</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>قدّم طلبًا مستوفيًا للمستندات للمقر الرئيسي للهيئة بالتجمع الخامس أو الفروع بالمحافظات — ف</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>الهيئة بتدرس الطلب فنيًا وبترد خلال أسبوعين وبتخاطب البنك المتعامل معاك</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>البنك بيتم الدراسة الائتمانية والصرف — بحد أقصى 100 مليون جنيه للعميل الواحد (و150 مليون م</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ إثبات أن النشاط ضمن القطاعات ذات الأولوية + إثبات الانتهاء من الإ</div><div class='doc-item'>✅ بيان تفصيلي بخطوط الإنتاج والآلات + قيمتها التقديرية وموعد الشحن</div><div class='doc-item'>✅ المبلغ المطلوب في الحدود المقررة + موقع المنشأة + البنك المتعامل</div><div class='doc-item'>✅ صورة الفاتورة الضريبية أو الاعتماد المستندي</div><div class='doc-item'>✅ للمنشآت القائمة: رخصة التشغيل + السجل الصناعي ساريين</div></div></div><a href='https://ida.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على ida.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>ملاحظة: مفيش جهة اسمها حرفيًا «صندوق تنمية الصناعة» — الدعم الفعلي بيتقدم عبر مبادرة تمويل القطاعات الصناعية ذات الأولوية من الهيئة العامة للتنمية الصناعية IDA والبنوك المشاركة بإشراف البنك المركزي ووزارة المالية</p><p>1. اتأكد إن نشاطك ضمن القطاعات ذات الأولوية (9 قطاعات): الأدوية، الهندسية، الغذائية، الغزل والنسيج والملابس الجاهزة، الكيماوية، التعدينية، مواد البناء والحراريات، الجلود، المعدنية</p><p>2. قدّم طلبًا مستوفيًا للمستندات للمقر الرئيسي للهيئة بالتجمع الخامس أو الفروع بالمحافظات — في أولوية جغرافية لجنوب الجيزة وإقليم قناة السويس والمحافظات الحدودية والصعيد</p><p>3. الهيئة بتدرس الطلب فنيًا وبترد خلال أسبوعين وبتخاطب البنك المتعامل معاك</p><p>4. البنك بيتم الدراسة الائتمانية والصرف — بحد أقصى 100 مليون جنيه للعميل الواحد (و150 مليون مع الأطراف المرتبطة) بعد رفع الحدود في المرحلة الثانية</p><h3>📄 المستندات</h3><p>• إثبات أن النشاط ضمن القطاعات ذات الأولوية + إثبات الانتهاء من الإنشاءات (رخصة بناء وجاهزية)</p><p>• بيان تفصيلي بخطوط الإنتاج والآلات + قيمتها التقديرية وموعد الشحن</p><p>• المبلغ المطلوب في الحدود المقررة + موقع المنشأة + البنك المتعامل</p><p>• صورة الفاتورة الضريبية أو الاعتماد المستندي</p><p>• للمنشآت القائمة: رخصة التشغيل + السجل الصناعي ساريين</p><h3>💰 الشروط</h3><p>مبادرة بـ30 مليار جنيه لتمويل الآلات والمعدات وخطوط الإنتاج — عائد مخفض 15% سنويًا لمدة 5 سنين (وزارة المالية بتتحمل الفرق)، وفيه خصم إضافي حتى 2% لزيادة القيمة المضافة المحلية أو الأنشطة المستحدثة</p><h3>💡 نصيحة</h3><p>تابع إعلانات المراحل والقطاعات على موقع الهيئة <a href="https://ida.gov.eg" target="_blank">ida.gov.eg</a> — المرحلة الثانية ضافت قطاعات جديدة ورفعت حدود التمويل</p>`},
  {id:26,icon:'🤵',cat:'أحوال مدنية',title:'إزاي تطلب شهادة عدم زواج؟',excerpt:'استخراج شهادة إثبات الحالة الاجتماعية للزواج أو السفر',readTime:'3 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>للمصريين (أساسًا للاستخدام في الخارج): استخرج قيدًا فرديًا من مصلحة الأحوال المدنية وصدّقه</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>حرر طلب الشهادة وقدّمه مع أصل جواز السفر — القنوات: السفارات والقنصليات والبعثات المصرية، </span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>للأجانب في مصر (الزواج المدني): شهادة من سفارة بلدك توضح حالتك الاجتماعية (أعزب/مطلق/أرمل)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>سجّل الزواج في مكتب توثيق زواج الأجانب بوزارة العدل مع شهادة صحية من مستشفى حكومي معتمد + </span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ قيد فردي مصدق (للمصريين) أو إثبات الحالة الاجتماعية من سفارة بلدك</div><div class='doc-item'>✅ جواز سفر ساري + ما يثبت الإقامة القانونية</div><div class='doc-item'>✅ شهادة طلاق/وفاة مصدقة ومترجمة ترجمة رسمية (للمطلق والأرمل)</div></div></div></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>الاسم الرسمي: «شهادة عدم ممانعة من الزواج»</p><p>1. للمصريين (أساسًا للاستخدام في الخارج): استخرج قيدًا فرديًا من مصلحة الأحوال المدنية وصدّقه من وزارة الخارجية</p><p>2. حرر طلب الشهادة وقدّمه مع أصل جواز السفر — القنوات: السفارات والقنصليات والبعثات المصرية، وموقع وزارة الخارجية المطوَّر بيتيح استخراج وتصديق الأوراق إلكترونيًا</p><p>3. للأجانب في مصر (الزواج المدني): شهادة من سفارة بلدك توضح حالتك الاجتماعية (أعزب/مطلق/أرمل) وإن الزواج لا يخالف قوانين بلدك + تصديق من وزارة الخارجية المصرية</p><p>4. سجّل الزواج في مكتب توثيق زواج الأجانب بوزارة العدل مع شهادة صحية من مستشفى حكومي معتمد + شاهدين مصريين بالغين + مترجم معتمد لو لزم</p><h3>📄 المستندات</h3><p>• قيد فردي مصدق (للمصريين) أو إثبات الحالة الاجتماعية من سفارة بلدك (للأجانب)</p><p>• جواز سفر ساري + ما يثبت الإقامة القانونية</p><p>• شهادة طلاق/وفاة مصدقة ومترجمة ترجمة رسمية (للمطلق والأرمل)</p><h3>💰 الرسوم</h3><p>مفيش رسوم موحدة معلنة رسميًا — بتختلف حسب القناة (سفارة/وزارة/قنصلية)، فحقق منها قبل التقديم</p><h3>💡 نصيحة</h3><p>الشهادة دي بتتطلب للزواج أو السفر أو لأي مصلحة بطلب إثبات الحالة الاجتماعية — ابدأ بالقيد الفردي لأنه أساس كل حاجة، وداخل مصر بيطلبون منك عادة قيدًا فرديًا من الأحوال المدنية</p>`},
  {id:27,icon:'🎒',cat:'تعليم',title:'إزاي تسجّل طفل في مدرسة حكومية؟',excerpt:'تسجيل الأطفال في المدارس الحكومية — دليل كامل',readTime:'5 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>التقديم من نظام EMIS (نظام إدارة المعلومات التعليمية) عبر emis.gov.eg برقم قومي للطفل وللو</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>اختار المدرسة الحكومية حسب عنوان الإقامة الرسمي</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>ارفع المستندات إلكترونيًا أو سلّمها بالمدرسة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>متابعة القبول من النظام</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ شهادة ميلاد الطفل (رقم قومي)</div><div class='doc-item'>✅ بطاقة الرقم القومي للوالد/الولي</div><div class='doc-item'>✅ إثبات عنوان سكن (فاتورة مرافق أو عقد إيجار)</div><div class='doc-item'>✅ 4 صور شخصية</div></div></div><a href='https://emis.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على emis.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. التقديم من نظام EMIS (نظام إدارة المعلومات التعليمية) عبر <a href=\"https://emis.gov.eg\" target=\"_blank\">emis.gov.eg</a> برقم قومي للطفل وللوالد</p><p>2. اختار المدرسة الحكومية حسب عنوان الإقامة الرسمي</p><p>3. ارفع المستندات إلكترونيًا أو سلّمها بالمدرسة</p><p>4. متابعة القبول من النظام</p><h3>📄 المستندات</h3><p>• شهادة ميلاد الطفل (رقم قومي)</p><p>• بطاقة الرقم القومي للوالد/الولي</p><p>• إثبات عنوان سكن (فاتورة مرافق أو عقد إيجار)</p><p>• 4 صور شخصية</p><h3>⏰ مهم!</h3><p>التقديم الإلزامي أونلاين لنقل وطلاب الصف الأول عبر نظام EMIS — والتقديم مجاني في المدارس الحكومية</p>`},
  {id:28,icon:'🏍️',cat:'مرور',title:'إزاي تستخرج رخصة تسيكل؟',excerpt:'استخراج رخصة قيادة موتوسيكل لأول مرة',readTime:'6 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>روح لوحدة المرور التابعة لمحل إقامتك المدون ببطاقة الرقم القومي (السن 18 سنة على الأقل)</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>اشترِ نموذج 256 من وحدة المرور واملأ الاستمارة</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>اجتز الاختبار النظري (قواعد وآداب المرور والإشارات) والاختبار العملي</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>سدّد الرسوم واستلم الرخصة — الإجراء جوه الوحدة بياخد حوالي ساعة بعد اجتياز الاختبارات</span></div></div></div><div class='info-fees'><div class='fees-title'>💰 الرسوم</div><div class='fees-grid'><div class='fee-item'><span>رسوم رئيسية</span><span>~1160ج</span></div><div class='fee-item'><span>بـ</span><span>6.5ج</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ بطاقة الرقم القومي سارية (أو جواز سفر)</div><div class='doc-item'>✅ شهادتان طبيتان: باطنة + نظر، موضح بهما فصيلة الدم</div><div class='doc-item'>✅ أصل المؤهل الدراسي أو شهادة محو الأمية</div><div class='doc-item'>✅ 4 صور شخصية حديثة</div></div></div></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. روح لوحدة المرور التابعة لمحل إقامتك المدون ببطاقة الرقم القومي (السن 18 سنة على الأقل)</p><p>2. اشترِ نموذج 256 من وحدة المرور واملأ الاستمارة</p><p>3. اجتز الاختبار النظري (قواعد وآداب المرور والإشارات) والاختبار العملي</p><p>4. سدّد الرسوم واستلم الرخصة — الإجراء جوه الوحدة بياخد حوالي ساعة بعد اجتياز الاختبارات</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي سارية (أو جواز سفر)</p><p>• شهادتان طبيتان: باطنة + نظر، موضح بهما فصيلة الدم</p><p>• أصل المؤهل الدراسي أو شهادة محو الأمية</p><p>• 4 صور شخصية حديثة</p><h3>💰 الرسوم</h3><p>رسوم رئيسية ~1160 جنيه (كشف طبي 285 + ملف 30 + رسم أول مرة 160 + حافظة بيانات 185 + ضريبة 150 + رسوم الاستخراج 350) + بنود صغيرة (نموذج 256 بـ6.5 جنيه ونموذج اختبار شهري 10) — أرقام سبتمبر 2026، والبوابة الرسمية مش بتعرض رقمًا موحدًا فراجع وحدة المرور. وده غير رسوم ترخيص الدراجة نفسها واللوحات (~1830 جنيه تقديريًا)</p><h3>⏰ المدة</h3><p>رخصة الدراجة النارية الخاصة صالحة 5 سنين (م.37 قانون المرور) — وغرامة القيادة بدون رخصة قد تصل 1000 جنيه</p><h3>💡 نصيحة</h3><p>اتأكد إن عندك التأمين الإجباري على التسيكل قبل ما تسوق — شرط قانوني وبيحميك في الحوادث</p>`},
  {id:29,icon:'🏦',cat:'بريد',title:'إزاي تفتح حساب توفير بريدي؟',excerpt:'فتح حساب توفير في البريد المصري — دليل كامل',readTime:'4 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>اختار نوع الحساب (توفير بريد مصر أو شهادات ادخارية) وروح لأقرب فرع بريد</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>املا نموذج فتح الحساب وسلّم صورة بطاقة الرقم القومي</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>ايدع المبلغ الأولانيات (حسب نوع الحساب)</span></div></div></div></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. اختار نوع الحساب (توفير بريد مصر أو شهادات ادخارية) وروح لأقرب فرع بريد</p><p>2. املا نموذج فتح الحساب وسلّم صورة بطاقة الرقم القومي</p><p>3. ايدع المبلغ الأولانيات (حسب نوع الحساب)</p><h3>💰 المزايا</h3><p>• توفير يومي وصرف من أي فرع بريد على مستوى الجمهورية</p><p>• الشهادات الادخارية متاحة للأفراد والقاصرين برأس مال صغير</p><p>• استرداد الشهادات في أي وقت من أي مكتب بريد</p><h3>⏰ مهم!</h3><p>• الحساب بيقبل الإيداع والصرف من أي فرع بريد على مستوى الجمهورية</p><p>• فيه أنواع مختلفة من الشهادات حسب مدة العائد ورأس المال</p>`},
  {id:30,icon:'💵',cat:'شركات',title:'إزاي تطلب قرض من جهاز تنمية المشروعات؟',excerpt:'الحصول على قرض ميسر للمشاريع الصغيرة و المتوسطة',readTime:'7 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>حدد فئة مشروعك (متناهي الصغر / صغيرة / متوسطة) وروح للمكتب الإقليمي للجهاز أو البنك المتعا</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>استوف الشروط وقدّم المستندات مع دراسة مبسطة (متناهي الصغر) أو دراسة جدوى</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>الطلب بيتحول للدراسة الائتمانية في الجهاز أو البنك</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>بعد الموافقة، صرف تمويل الصغيرة بيتم خلال ~5 أيام عمل</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ سجل تجاري بمستخرج حديث (45 يوم على الأكثر) + بطاقة ضريبية</div><div class='doc-item'>✅ عقد إيجار مثبت التاريخ بالشهر العقاري أو مستند ملكية/حيازة المقر</div><div class='doc-item'>✅ تراخيص مزاولة النشاط + دراسة الجدوى</div><div class='doc-item'>✅ حسب النشاط: بطاقات الشركاء، الهيكل الإداري، موقف الضرائب والتأمين</div></div></div><a href='https://msmeda.org.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على msmeda.org.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. حدد فئة مشروعك (متناهي الصغر / صغيرة / متوسطة) وروح للمكتب الإقليمي للجهاز أو البنك المتعاقد — الموقع الرسمي <a href="https://msmeda.org.eg" target="_blank">msmeda.org.eg</a></p><p>2. استوف الشروط وقدّم المستندات مع دراسة مبسطة (متناهي الصغر) أو دراسة جدوى</p><p>3. الطلب بيتحول للدراسة الائتمانية في الجهاز أو البنك</p><p>4. بعد الموافقة، صرف تمويل الصغيرة بيتم خلال ~5 أيام عمل</p><h3>📄 المستندات</h3><p>• سجل تجاري بمستخرج حديث (45 يوم على الأكثر) + بطاقة ضريبية</p><p>• عقد إيجار مثبت التاريخ بالشهر العقاري أو مستند ملكية/حيازة المقر</p><p>• تراخيص مزاولة النشاط + دراسة الجدوى</p><p>• حسب النشاط: بطاقات الشركاء، الهيكل الإداري، موقف الضرائب والتأمينات، قوائم مالية</p><h3>💰 التمويل</h3><p>متناهي الصغر: حتى 242 ألف جنيه للعميل النهائي عبر الجهات الوسيطة المرخصة — الصغيرة: من 250 ألف حتى 8 مليون جنيه (و10 مليون للتجديد) — المتوسطة: حتى ~30 مليون جنيه. مبادرة البنك المركزي بعائد 5% متناقص، وسداد مرن حتى 60 شهرًا، وبدون ضامن في مبادرات «مشروعك»</p><h3>💡 نصيحة</h3><p>جهّز دراسة جدوى واضحة عشان تزود فرص قبولك، واتأكد إن مستخرج السجل التجاري أحدث من 45 يوم قبل التقديم</p>`},
  {id:31,icon:'👷',cat:'تأمينات',title:'إزاي تسجّل في التأمين الاجتماعي؟',excerpt:'تسجيل العاملين في التأمينات الاجتماعية — دليل رب العمل',readTime:'6 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>كل مواطن ليه رقم تأميني واحد من الميلاد لحد استحقاق المعاش — استعلم عنه أونلاين: موقع الهي</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>لو مفيش رقم مسجل: روح أقرب مكتب تأمينات بأصل شهادة الميلاد المميكنة (أو البطاقة) والموظف ب</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>لرب العمل: سجّل العاملين لدى الهيئة خلال 30 يوم من التعيين (نظام التأمين الاجتماعي الشامل </span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>4</span><span class='step-text'>اعمل حساب على موقع الهيئة (اسم رباعي + اسم الأم الأول + القومي + الرقم التأميني + موبايل +</span></div></div></div><div class='info-section'><div class='info-title'>📄 المستندات</div><div class='docs-checklist'><div class='doc-item'>✅ بطاقة الرقم القومي سارية أو شهادة ميلاد مميكنة</div><div class='doc-item'>✅ للشركة: السجل التجاري + عقد العمل + نماذج قيد العاملين المعتمدة ل</div></div></div><a href='https://www.nosi.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على nosi.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. كل مواطن ليه رقم تأميني واحد من الميلاد لحد استحقاق المعاش — استعلم عنه أونلاين: موقع الهيئة القومية للتأمينات الاجتماعية <a href="https://www.nosi.gov.eg" target="_blank">nosi.gov.eg</a> ← خدمة «الاستعلام عن الرقم التأميني بالرقم القومي» ← الرقم القومي (14 رقمًا) + الاسم الأول للأم ← «أنا لست روبوت» ← إرسال، والرقم بيظهر فورًا</p><p>2. لو مفيش رقم مسجل: روح أقرب مكتب تأمينات بأصل شهادة الميلاد المميكنة (أو البطاقة) والموظف بيسجل لك رقمًا تأمينيًا جديدًا ويبلغك بيه</p><p>3. لرب العمل: سجّل العاملين لدى الهيئة خلال 30 يوم من التعيين (نظام التأمين الاجتماعي الشامل — قانون 148/2019)</p><p>4. اعمل حساب على موقع الهيئة (اسم رباعي + اسم الأم الأول + القومي + الرقم التأميني + موبايل + بريد + كلمة سر) لمتابعة العاملين واستخراج برنت التأمينات</p><h3>📄 المستندات</h3><p>• بطاقة الرقم القومي سارية أو شهادة ميلاد مميكنة</p><p>• للشركة: السجل التجاري + عقد العمل + نماذج قيد العاملين المعتمدة لدى الهيئة</p><h3>💰 الاشتراكات</h3><p>إجمالي 29.75% من أجر الاشتراك التأميني (قانون 148/2019): صاحب العمل 18.75% (شيخوخة وعجز ووفاة 12 + مكافأة نهاية الخدمة 1 + إصابات 1.5 + مرض 3.25 + بطالة 1) والعامل 11% (شيخوخة 9 + مكافأة 1 + مرض 1) — أجر الاشتراك في 2026 محصور بين 2700 و16700 جنيه، وكل 7 سنين بتزيد نسبة اشتراك الشيخوخة 1% مناصفة بين الطرفين (أول زيادة يناير 2027)</p><h3>💡 نصيحة</h3><p>برنت التأمينات المعتمد بيصدر من مكتب التأمينات التابع لمحل إقامتك (ختم المكتب + توقيع مديره) وبيتطلب في التعيينات والمعاشات — والاستعلام عن المدد والأجور متاح أونلاين. الخط الساخن للهيئة 16217</p>`},
  {id:32,icon:'🏥',cat:'تأمين صحي',title:'إزاي تطلع كارت علاج مجاني؟',excerpt:'استخراج كارت التأمين الصحي للعلاج المجاني',readTime:'4 دقائق',infographic:`<div class='infographic'><div class='info-section'><div class='info-title'>📋 الخطوات</div><div class='steps-flow'><div class='step'><span class='step-num'>1</span><span class='step-text'>سجّل بيانات أسرتك التأمينية أونلاين من بوابة مصر الرقمية — اختار المحافظة حسب البطاقة واحف</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>2</span><span class='step-text'>بعد 48 ساعة روح لوحدة الرعاية الأولية لسداد الاشتراك واستلام الكارت برقم الملف العائلي</span></div><div class='step-arrow'>←</div><div class='step'><span class='step-num'>3</span><span class='step-text'>اعمل الفحص المبدئي وافتح الملف العائلي</span></div></div></div><a href='https://digital.gov.eg' target='_blank' rel='noopener' class='form-download-btn'>📥 ابدأ الخدمة على digital.gov.eg</a></div><div class='info-divider'></div>`,content:`<h3>📋 الخطوات</h3><p>1. سجّل بيانات أسرتك التأمينية أونلاين من <a href=\"https://digital.gov.eg\" target=\"_blank\">بوابة مصر الرقمية</a> — اختار المحافظة حسب البطاقة واحفظ</p><p>2. بعد 48 ساعة روح لوحدة الرعاية الأولية لسداد الاشتراك واستلام الكارت برقم الملف العائلي</p><p>3. اعمل الفحص المبدئي وافتح الملف العائلي</p><h3>👥 مين بيسجل إزاي؟</h3><p>• غير الخاضعين للتأمينات: من مكتب خدمة العملاء لبيانات الدخل والسداد الذاتي</p><p>• الغير قادرين: الدولة بتسدد عنهم</p><h3>📍 المحافظات المتاحة</h3><p>• المرحلة الأولى: بورسعيد، الأقصر، الإسماعيلية، جنوب سيناء، السويس، أسوان</p><p>• المرحلة الثانية: دمياط، كفر الشيخ، المنيا، مطروح، شمال سيناء</p><h3>💡 المميزات</h3><p>تغطية من الولادة للوفاة + مساهمات رمزية على الأدوية والأشعة والتحاليل (والمعفيون منها: الغير قادرين وأصحاب الأمراض المزمنة والأورام)</p>`},
